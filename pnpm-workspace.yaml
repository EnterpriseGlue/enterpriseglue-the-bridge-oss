packages:
  - 'backend'
  - 'frontend'
  - 'packages/*'
public-hoist-pattern:
  - '*'
  - 'inferno'
  - 'inferno*'
overrides:
  # Security remediations for vulnerable transitive runtime and build dependencies.
  brace-expansion: 5.0.8
  form-data: 4.0.6
  immutable: 5.1.9
  postcss: 8.5.18
  undici: 7.29.0
  vite: 7.3.6
allowBuilds:
  '@carbon/charts': true
  '@carbon/charts-react': true
  '@carbon/colors': true
  '@carbon/feature-flags': true
  '@carbon/grid': true
  '@carbon/icon-helpers': true
  '@carbon/icons': true
  '@carbon/icons-react': true
  '@carbon/layout': true
  '@carbon/link': true
  '@carbon/motion': true
  '@carbon/pictograms': true
  '@carbon/react': true
  '@carbon/styles': true
  '@carbon/themes': true
  '@carbon/type': true
  '@carbon/utilities': true
  '@carbon/utils-position': true
  '@ibm/plex': true
  '@ibm/plex-mono': true
  '@ibm/plex-sans': true
  '@ibm/plex-sans-arabic': true
  '@ibm/plex-sans-devanagari': true
  '@ibm/plex-sans-hebrew': true
  '@ibm/plex-sans-thai': true
  '@ibm/plex-sans-thai-looped': true
  '@ibm/plex-serif': true
  '@parcel/watcher': true
  '@scarf/scarf': true
  core-js: true
  esbuild: true
  inferno: true
  msw: true
  oracledb: true
  # @google-cloud/spanner works without protobufjs' optional postinstall-generated code.
  # Keep third-party install-time code disabled and verify the supported runtime in the
  # connected Spanner acceptance gate.
  protobufjs: false
auditConfig:
  # The OSS host uses React Router Data Mode only. GHSA-qwww-vcr4-c8h2 applies exclusively to
  # unstable RSC APIs, which are forbidden by the production-audit source guard.
  ignoreGhsas:
    - GHSA-qwww-vcr4-c8h2
