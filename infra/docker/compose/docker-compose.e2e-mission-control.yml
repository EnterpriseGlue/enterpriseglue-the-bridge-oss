services:
  db:
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"

  camunda-mock:
    image: node:24-alpine
    working_dir: /mock
    command: ["node", "server.mjs"]
    ports:
      - "${CAMUNDA_MOCK_HOST_PORT:-59080}:9080"
    environment:
      MOCK_CAMUNDA_USE_ADAPTED_BUNDLE: ${MOCK_CAMUNDA_USE_ADAPTED_BUNDLE:-}
    volumes:
      - ./test/e2e/mock-camunda:/mock:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:9080/health').then((r)=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      enterpriseglue-network:
        aliases:
          # The live Operaton acceptance journey uses a product-accurate
          # hostname while reusing this deterministic REST-compatible runtime.
          - operaton-mock
          # Public-shaped local DNS name exercises the external registration
          # URL contract without weakening its localhost/private-host denylist.
          - camunda-mock.example.test

  backend:
    environment:
      CAMUNDA_BASE_URL: ${CAMUNDA_BASE_URL:-http://camunda-mock:9080/engine-rest}
      # Disposable mock credential used by configuration-bundle E2E coverage.
      E2E_ENGINE_PASSWORD: ${E2E_ENGINE_PASSWORD:-e2e-local-only}
    depends_on:
      db:
        condition: service_healthy
      camunda-mock:
        condition: service_healthy
