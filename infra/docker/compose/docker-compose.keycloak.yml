services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    command: start-dev --import-realm
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-keycloak-admin}
      KC_HEALTH_ENABLED: "true"
    volumes:
      # CI protocol rehearsals generate a copy with their disposable dynamic
      # localhost origin. Developer stacks keep using the checked-in fixture.
      - ${KEYCLOAK_REALM_IMPORT_FILE:-./infra/docker/keycloak/enterpriseglue-local-realm.json}:/opt/keycloak/data/import/enterpriseglue-local-realm.json:ro
    ports:
      - "${KEYCLOAK_HOST_PORT:-8180}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - enterpriseglue-network
