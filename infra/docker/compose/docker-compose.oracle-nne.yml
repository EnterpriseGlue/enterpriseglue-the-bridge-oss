# Apply after the Oracle overlay. External Oracle deployments can use this
# client overlay without the local database service.
services:
  backend:
    user: !reset null
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
      target: oracle
      args:
        ENTERPRISEGLUE_HOST_VERSION: ${ENTERPRISEGLUE_HOST_VERSION:-0.16.0}
    environment:
      ORACLE_NETWORK_ENCRYPTION: native-aes256-required
      ORACLE_NET_CONFIG_DIR: /etc/enterpriseglue/oracle
    volumes:
      - ${EG_ORACLE_NET_CONFIG_HOST_DIR:-./infra/docker/oracle/client}:/etc/enterpriseglue/oracle:ro
