# Optional authorization configuration bootstrap overlay.
# Use only with EG_CONFIG_BUNDLE_HOST_PATH set to one JSON payload file and
# EG_CONFIG_BOOTSTRAP_MODE=validate or apply in the backend environment file.
services:
  backend:
    environment:
      EG_CONFIG_BUNDLE_PATH: /etc/enterpriseglue/config/bundle.json
    volumes:
      - ${EG_CONFIG_BUNDLE_HOST_PATH:?set-an-absolute-or-repository-relative-bundle-file}:/etc/enterpriseglue/config/bundle.json:ro
      # Reserved for file-backed secret references. Keep it separate from the
      # JSON bundle and never place secret values in the bundle itself.
      - ${EG_CONFIG_SECRETS_HOST_PATH:-./.local/enterpriseglue-config-secrets}:/var/run/secrets/enterpriseglue:ro
