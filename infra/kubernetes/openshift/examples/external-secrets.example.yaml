# Requires External Secrets Operator and an existing SecretStore or
# ClusterSecretStore named enterpriseglue-secret-store. Replace remote keys and
# properties with paths from the target provider. The deployment script uses
# these generated Kubernetes Secrets when OPENSHIFT_SECRET_SOURCE=external.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: enterpriseglue-runtime
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    name: enterpriseglue-secret-store
    kind: ClusterSecretStore
  target:
    name: enterpriseglue-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef: { key: enterpriseglue/runtime, property: JWT_SECRET }
    - secretKey: ADMIN_EMAIL
      remoteRef: { key: enterpriseglue/runtime, property: ADMIN_EMAIL }
    - secretKey: ADMIN_PASSWORD
      remoteRef: { key: enterpriseglue/runtime, property: ADMIN_PASSWORD }
    - secretKey: ENCRYPTION_KEY
      remoteRef: { key: enterpriseglue/runtime, property: ENCRYPTION_KEY }
    - secretKey: POSTGRES_URL
      remoteRef: { key: enterpriseglue/runtime, property: POSTGRES_URL }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: enterpriseglue-config-references
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    name: enterpriseglue-secret-store
    kind: ClusterSecretStore
  target:
    name: enterpriseglue-config-secrets
    creationPolicy: Owner
  data:
    - secretKey: PAYMENTS_ENGINE_TOKEN
      remoteRef: { key: enterpriseglue/config-references, property: PAYMENTS_ENGINE_TOKEN }
