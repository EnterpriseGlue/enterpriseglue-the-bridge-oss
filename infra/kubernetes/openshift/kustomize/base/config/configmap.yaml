apiVersion: v1
kind: ConfigMap
metadata:
  name: enterpriseglue-config
  labels:
    app.kubernetes.io/name: enterpriseglue
    app.kubernetes.io/part-of: enterpriseglue

data:
  NODE_ENV: "production"
  API_PORT: "8787"
  FRONTEND_URL: "https://enterpriseglue.example.com"
  API_BASE_URL: ""
  API_UPSTREAM: "enterpriseglue-backend:8787"

  DATABASE_TYPE: "postgres"

  POSTGRES_HOST: "postgresql"
  POSTGRES_PORT: "5432"
  POSTGRES_DATABASE: "enterpriseglue"
  POSTGRES_SCHEMA: "main"
  POSTGRES_SSL: "false"
  POSTGRES_SSL_REJECT_UNAUTHORIZED: "false"

  ORACLE_HOST: "oracle-db"
  ORACLE_PORT: "1521"
  ORACLE_SERVICE_NAME: "XEPDB1"
  ORACLE_SCHEMA: "ENTERPRISEGLUE"

  GIT_REPOS_PATH: "/app/data/repos"
  GIT_DEFAULT_BRANCH: "main"
  EXPOSE_BACKEND: "false"

  # Bootstrap stays disabled unless an environment explicitly supplies a
  # mounted bundle plus validate/apply mode through its deployment process.
  EG_CONFIG_BOOTSTRAP_MODE: "disabled"
  EG_CONFIG_EXPECTED_TENANT_SCOPE: "platform"
  EG_CONFIG_FAIL_CLOSED: "true"
  EG_CONFIG_REQUIRE_SECRET_PREFLIGHT: "false"
  EG_CONFIG_MAX_BYTES: "1048576"
  EG_CONFIG_SECRET_PROVIDER: "env"
  EG_CONFIG_SECRET_FILE_ROOT: "/var/run/secrets/enterpriseglue"

  # Engine access is fail-closed until operators replace this empty host list.
  EG_ENGINE_ALLOWED_HOSTS: ""
  EG_ENFORCE_ENGINE_ENDPOINT_POLICY: "true"
  EG_ENGINE_ALLOW_PRIVATE_HOSTS: "false"
  EG_ALLOW_INSECURE_ENGINE_HTTP: "false"

  # Official public Git hosts are built in; custom Git/PII hosts are explicit.
  EG_ADMIN_INTEGRATION_ALLOWED_HOSTS: ""
  EG_ENFORCE_ADMIN_INTEGRATION_ENDPOINT_POLICY: "true"
  EG_ADMIN_INTEGRATION_ALLOW_PRIVATE_HOSTS: "false"

  # Direct SSO is fail-closed until operators replace this empty host list.
  EG_IDENTITY_PROVIDER_ALLOWED_HOSTS: ""
  EG_ENFORCE_IDENTITY_PROVIDER_ENDPOINT_POLICY: "true"
  EG_IDENTITY_PROVIDER_ALLOW_PRIVATE_HOSTS: "false"
  EG_IDENTITY_FLOW_RATE_LIMIT_MAX: "300"
  SSO_DIAGNOSTICS_INTERVAL_MS: "60000"
  EG_LDAP_RECONCILIATION_IDENTITY_LIMIT: "10000"
  EG_LDAP_RECONCILIATION_CONCURRENCY: "4"
  EG_LDAP_RECONCILIATION_GROUP_QUERY_LIMIT: "10000"
  EG_LDAP_RECONCILIATION_GROUP_RESULT_LIMIT: "100000"
  EG_LDAP_GROUP_SEARCH_QUERY_LIMIT: "100"
  EG_LDAP_GROUP_SEARCH_RESULT_LIMIT: "5000"
