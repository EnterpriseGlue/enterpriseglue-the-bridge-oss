{{- if .Values.workers.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "enterpriseglue-host.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "enterpriseglue-host.labels" . | nindent 4 }}
    {{- include "enterpriseglue-host.selectorLabels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  {{- if not .Values.workers.autoscaling.enabled }}
  replicas: {{ .Values.workers.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      {{- include "enterpriseglue-host.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "enterpriseglue-host.selectorLabels" (dict "root" . "component" "worker") | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      annotations:
        enterpriseglue.io/rollout-revision: {{ .Values.rolloutRevision | quote }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "enterpriseglue-host.serviceAccountName" (dict "root" . "component" "worker") }}
      {{- include "enterpriseglue-host.commonPodSpec" (dict "root" . "component" "worker") | nindent 6 }}
      {{- include "enterpriseglue-host.topologySpread" (dict "root" . "component" "worker") | nindent 6 }}
      terminationGracePeriodSeconds: 90
      containers:
        {{- include "enterpriseglue-host.connectionProxy" (dict "root" . "nativeSidecar" false) | nindent 8 }}
        - name: worker
          image: {{ include "enterpriseglue-host.backendImage" . | quote }}
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          envFrom:
            - configMapRef: { name: {{ .Values.database.configMapName }} }
            - secretRef: { name: {{ .Values.database.applicationSecretName }} }
          env:
            - { name: EG_RUNTIME_ROLE, value: "worker" }
            - name: EG_DATABASE_STARTUP_MODE
              value: {{ ternary "verify" "apply" .Values.database.migration.enabled | quote }}
            {{- if .Values.pluginAssets.enabled }}
            - name: ENTERPRISEGLUE_PLUGIN_ASSET_ROOT
              value: {{ .Values.pluginAssets.mountPath | quote }}
            {{- end }}
          securityContext:
            {{- include "enterpriseglue-host.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.workers.resources | nindent 12 }}
          livenessProbe:
            exec: { command: ["node", "-e", "process.exit(0)"] }
            initialDelaySeconds: 20
            periodSeconds: 30
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if .Values.pluginAssets.enabled }}
            - name: plugin-assets
              mountPath: {{ .Values.pluginAssets.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - { name: tmp, emptyDir: {} }
        {{- if .Values.pluginAssets.enabled }}
        - name: plugin-assets
          persistentVolumeClaim:
            claimName: {{ required "pluginAssets.existingClaim is required when pluginAssets.enabled=true" .Values.pluginAssets.existingClaim }}
        {{- end }}
{{- end }}
