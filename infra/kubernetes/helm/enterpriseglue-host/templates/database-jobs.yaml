{{- include "enterpriseglue-host.releaseEffectCohortValidate" . }}
{{- include "enterpriseglue-host.managedShardBootstrapValidate" . }}
{{- $schemaEpochOwnerMode := include "enterpriseglue-host.schemaEpochOwnerMode" . | trim }}
{{- $schemaEpochTarget := eq (include "enterpriseglue-host.schemaEpochTarget" . | trim) "true" }}
{{- if .Values.database.managedShardBootstrap.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "enterpriseglue-host.fullname" . }}-bootstrap-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "enterpriseglue-host.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
    enterpriseglue.io/managed-shard-bootstrap-manifest-sha256: {{ (.Files.Get "files/managed-shard-bootstrap-manifest.json" | sha256sum) | quote }}
spec:
  backoffLimit: {{ .Values.database.managedShardBootstrap.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.database.managedShardBootstrap.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "enterpriseglue-host.selectorLabels" (dict "root" . "component" "bootstrap") | nindent 8 }}
      annotations:
        enterpriseglue.io/managed-shard-bootstrap-manifest-sha256: {{ (.Files.Get "files/managed-shard-bootstrap-manifest.json" | sha256sum) | quote }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "enterpriseglue-host.serviceAccountName" (dict "root" . "component" "bootstrap") }}
      {{- include "enterpriseglue-host.commonPodSpec" (dict "root" . "component" "bootstrap") | nindent 6 }}
      {{- if .Values.database.connectionProxy.enabled }}
      initContainers:
        {{- include "enterpriseglue-host.connectionProxy" (dict "root" . "nativeSidecar" true) | nindent 8 }}
      {{- end }}
      containers:
        - name: bootstrap
          image: {{ include "enterpriseglue-host.managedShardBootstrapImage" . | quote }}
          imagePullPolicy: {{ .Values.database.managedShardBootstrap.image.pullPolicy }}
          env:
            - name: EG_MANAGED_SHARD_BOOTSTRAP_ENABLED
              value: "true"
            - name: EG_MANAGED_SHARD_TARGET_TENANCY_MODE
              value: "pooled"
            - name: EG_MANAGED_SHARD_ID
              value: {{ .Values.database.managedShardBootstrap.shardId | quote }}
            - name: EG_POSTGRES_RUNTIME_ROLE
              value: {{ .Values.database.migration.runtimeRole | quote }}
            - name: DATABASE_TYPE
              value: "postgres"
            - name: EG_TENANCY_MODE
              value: "single"
            - name: EG_MANAGED_SHARD_BOOTSTRAP_RECEIPT_PATH
              value: /var/run/enterpriseglue-bootstrap/receipt.json
          envFrom:
            - configMapRef: { name: {{ .Values.database.configMapName }} }
            - secretRef: { name: {{ .Values.database.migrationSecretName }} }
            - secretRef: { name: {{ .Values.database.managedShardBootstrap.seedSecretName }} }
          securityContext:
            {{- include "enterpriseglue-host.containerSecurityContext" . | nindent 12 }}
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: bootstrap-receipt, mountPath: /var/run/enterpriseglue-bootstrap }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: bootstrap-receipt, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
{{- end }}
{{- if ne $schemaEpochOwnerMode "disabled" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "enterpriseglue-host.fullname" . }}-migrate-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "enterpriseglue-host.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.database.migration.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.database.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "enterpriseglue-host.selectorLabels" (dict "root" . "component" "migration") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "enterpriseglue-host.serviceAccountName" (dict "root" . "component" "migration") }}
      {{- include "enterpriseglue-host.commonPodSpec" (dict "root" . "component" "migration") | nindent 6 }}
      {{- if .Values.database.connectionProxy.enabled }}
      initContainers:
        {{- include "enterpriseglue-host.connectionProxy" (dict "root" . "nativeSidecar" true) | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "enterpriseglue-host.backendImage" . | quote }}
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command: ["node", "-e"]
          args:
            {{- if eq $schemaEpochOwnerMode "apply-through-executable" }}
            - "import('./dist/packages/shared/dist/db/run-migrations.js').then(({runSchemaEpochOwnerMigrations}) => runSchemaEpochOwnerMigrations())"
            {{- else }}
            - "import('./dist/packages/shared/dist/db/run-migrations.js').then(({runMigrations}) => runMigrations({mode:'apply'}))"
            {{- end }}
          {{- if or .Values.database.migration.runtimeRole .Values.database.profile.databaseType }}
          env:
            {{- if .Values.database.migration.runtimeRole }}
            - name: EG_POSTGRES_RUNTIME_ROLE
              value: {{ .Values.database.migration.runtimeRole | quote }}
            {{- end }}
            {{- if .Values.database.profile.databaseType }}
            - name: DATABASE_TYPE
              value: {{ .Values.database.profile.databaseType | quote }}
            - name: EG_TENANCY_MODE
              value: {{ .Values.database.profile.tenancyMode | quote }}
            {{- end }}
          {{- end }}
          envFrom:
            - configMapRef: { name: {{ .Values.database.configMapName }} }
            - secretRef: { name: {{ .Values.database.migrationSecretName }} }
          securityContext:
            {{- include "enterpriseglue-host.containerSecurityContext" . | nindent 12 }}
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
{{- end }}
{{- if .Values.database.releaseEffectCohort.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "enterpriseglue-host.fullname" . }}-open-effect-cohort-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "enterpriseglue-host.labels" . | nindent 4 }}
    app.kubernetes.io/component: cohort
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- include "enterpriseglue-host.releaseEffectCohortAnnotations" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.database.releaseEffectCohort.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.database.releaseEffectCohort.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "enterpriseglue-host.selectorLabels" (dict "root" . "component" "cohort") | nindent 8 }}
      annotations:
        {{- include "enterpriseglue-host.releaseEffectCohortAnnotations" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "enterpriseglue-host.serviceAccountName" (dict "root" . "component" "cohort") }}
      {{- include "enterpriseglue-host.commonPodSpec" (dict "root" . "component" "cohort") | nindent 6 }}
      {{- if .Values.database.connectionProxy.enabled }}
      initContainers:
        {{- include "enterpriseglue-host.connectionProxy" (dict "root" . "nativeSidecar" true) | nindent 8 }}
      {{- end }}
      containers:
        - name: open-effect-cohort
          image: {{ include "enterpriseglue-host.backendImage" . | quote }}
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command: ["node", "-e"]
          args:
            - "import('./dist/packages/shared/dist/services/platform-admin/open-release-effect-cohort.js').then(({openConfiguredReleaseEffectCohort}) => openConfiguredReleaseEffectCohort())"
          env:
            {{- include "enterpriseglue-host.releaseEffectCohortEnvironment" . | nindent 12 }}
            - name: DATABASE_TYPE
              value: {{ .Values.database.profile.databaseType | quote }}
            - name: EG_TENANCY_MODE
              value: {{ .Values.database.profile.tenancyMode | quote }}
          envFrom:
            - configMapRef: { name: {{ .Values.database.configMapName }} }
            - secretRef: { name: {{ .Values.database.applicationSecretName }} }
          securityContext:
            {{- include "enterpriseglue-host.containerSecurityContext" . | nindent 12 }}
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
{{- end }}
{{- if or $schemaEpochTarget .Values.database.preflight.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "enterpriseglue-host.fullname" . }}-preflight-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "enterpriseglue-host.labels" . | nindent 4 }}
    app.kubernetes.io/component: preflight
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.database.preflight.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.database.preflight.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "enterpriseglue-host.selectorLabels" (dict "root" . "component" "preflight") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "enterpriseglue-host.serviceAccountName" (dict "root" . "component" "preflight") }}
      {{- include "enterpriseglue-host.commonPodSpec" (dict "root" . "component" "preflight") | nindent 6 }}
      {{- if .Values.database.connectionProxy.enabled }}
      initContainers:
        {{- include "enterpriseglue-host.connectionProxy" (dict "root" . "nativeSidecar" true) | nindent 8 }}
      {{- end }}
      containers:
        - name: preflight
          image: {{ include "enterpriseglue-host.backendImage" . | quote }}
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command: ["node", "-e"]
          args:
            {{- if $schemaEpochTarget }}
            - "import('./dist/packages/shared/dist/db/run-migrations.js').then(({runSchemaEpochPreflight}) => runSchemaEpochPreflight())"
            {{- else }}
            - "import('./dist/packages/shared/dist/db/run-migrations.js').then(({runMigrations}) => runMigrations({mode:'verify'}))"
            {{- end }}
          envFrom:
            - configMapRef: { name: {{ .Values.database.configMapName }} }
            - secretRef: { name: {{ .Values.database.preflightSecretName }} }
          {{- if .Values.database.profile.databaseType }}
          env:
            {{- if $schemaEpochTarget }}
            - name: EG_POSTGRES_RUNTIME_ROLE
              value: {{ .Values.database.migration.runtimeRole | quote }}
            {{- end }}
            - name: DATABASE_TYPE
              value: {{ .Values.database.profile.databaseType | quote }}
            - name: EG_TENANCY_MODE
              value: {{ .Values.database.profile.tenancyMode | quote }}
          {{- end }}
          securityContext:
            {{- include "enterpriseglue-host.containerSecurityContext" . | nindent 12 }}
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
{{- end }}
