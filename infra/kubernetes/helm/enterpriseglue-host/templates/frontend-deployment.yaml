{{- $upstream := .Values.frontend.upstream | default dict -}}
{{- $tls := $upstream.tls | default dict -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "enterpriseglue-host.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "enterpriseglue-host.labels" . | nindent 4 }}
    {{- include "enterpriseglue-host.selectorLabels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  {{- if not .Values.frontend.autoscaling.enabled }}
  replicas: {{ .Values.frontend.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      {{- include "enterpriseglue-host.selectorLabels" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "enterpriseglue-host.selectorLabels" (dict "root" . "component" "frontend") | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      annotations:
        enterpriseglue.io/rollout-revision: {{ .Values.rolloutRevision | quote }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "enterpriseglue-host.serviceAccountName" (dict "root" . "component" "api") }}
      {{- include "enterpriseglue-host.commonPodSpec" (dict "root" . "component" "frontend") | nindent 6 }}
      {{- include "enterpriseglue-host.topologySpread" (dict "root" . "component" "frontend") | nindent 6 }}
      containers:
        - name: frontend
          image: {{ include "enterpriseglue-host.frontendImage" . | quote }}
          imagePullPolicy: {{ .Values.images.frontend.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
          env:
            - name: API_UPSTREAM
              value: {{ default (printf "%s-api:%v" (include "enterpriseglue-host.fullname" .) .Values.backend.service.port) $upstream.address | quote }}
            - { name: API_UPSTREAM_SCHEME, value: {{ default "http" $upstream.scheme | quote }} }
            {{- if $tls.serverName }}
            - { name: API_UPSTREAM_TLS_SERVER_NAME, value: {{ $tls.serverName | quote }} }
            {{- end }}
            {{- if $tls.caSecretName }}
            - { name: API_UPSTREAM_TLS_CA_FILE, value: /run/secrets/enterpriseglue-upstream/ca/ca.crt }
            {{- end }}
            {{- if $tls.clientSecretName }}
            - { name: API_UPSTREAM_TLS_CLIENT_CERT_FILE, value: /run/secrets/enterpriseglue-upstream/client/tls.crt }
            - { name: API_UPSTREAM_TLS_CLIENT_KEY_FILE, value: /run/secrets/enterpriseglue-upstream/client/tls.key }
            {{- end }}
            - { name: EG_FRONTEND_RUNTIME_API_BASE_URL, value: "" }
            - { name: EG_FRONTEND_RUNTIME_CONFIG_REQUIRED, value: "true" }
            {{- if .Values.cloudEmailSignupProtection.enabled }}
            - { name: EG_FRONTEND_CLOUD_EMAIL_TURNSTILE_ENABLED, value: "true" }
            {{- end }}
          securityContext:
            {{- include "enterpriseglue-host.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          startupProbe:
            httpGet: { path: /_enterpriseglue/frontend-health, port: http }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
              {{- if $upstream.readinessHost }}
              httpHeaders:
                - { name: Host, value: {{ $upstream.readinessHost | quote }} }
              {{- end }}
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /_enterpriseglue/frontend-health, port: http }
            periodSeconds: 15
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-run, mountPath: /var/run }
            {{- if $tls.caSecretName }}
            - { name: upstream-ca, mountPath: /run/secrets/enterpriseglue-upstream/ca, readOnly: true }
            {{- end }}
            {{- if $tls.clientSecretName }}
            - { name: upstream-client, mountPath: /run/secrets/enterpriseglue-upstream/client, readOnly: true }
            {{- end }}
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: nginx-cache, emptyDir: {} }
        - { name: nginx-run, emptyDir: {} }
        {{- if $tls.caSecretName }}
        - name: upstream-ca
          secret:
            secretName: {{ $tls.caSecretName | quote }}
            defaultMode: 0440
            items:
              - { key: ca.crt, path: ca.crt }
        {{- end }}
        {{- if $tls.clientSecretName }}
        - name: upstream-client
          secret:
            secretName: {{ $tls.clientSecretName | quote }}
            defaultMode: 0440
            items:
              - { key: tls.crt, path: tls.crt }
              - { key: tls.key, path: tls.key }
        {{- end }}
