{{- range $component := list "api" "worker" "cohort" "bootstrap" "migration" "preflight" }}
{{- $settings := index $.Values.serviceAccounts $component }}
{{- if and $settings.create (or (and (eq $component "cohort") $.Values.database.releaseEffectCohort.enabled) (and (eq $component "bootstrap") $.Values.database.managedShardBootstrap.enabled) (and (ne $component "cohort") (ne $component "bootstrap") (or (ne $component "worker") $.Values.workers.enabled))) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "enterpriseglue-host.serviceAccountName" (dict "root" $ "component" $component) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "enterpriseglue-host.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $settings.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
    {{- if or (eq $component "cohort") (eq $component "bootstrap") (eq $component "migration") (eq $component "preflight") }}
    helm.sh/hook: {{ ternary "pre-install" "pre-install,pre-upgrade" (eq $component "bootstrap") }}
    helm.sh/hook-weight: "-30"
    {{- if eq $component "cohort" }}
    helm.sh/hook-delete-policy: before-hook-creation
    {{- else }}
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- end }}
    {{- end }}
  {{- end }}
  {{- if and (not $settings.annotations) (or (eq $component "cohort") (eq $component "bootstrap") (eq $component "migration") (eq $component "preflight")) }}
  annotations:
    helm.sh/hook: {{ ternary "pre-install" "pre-install,pre-upgrade" (eq $component "bootstrap") }}
    helm.sh/hook-weight: "-30"
    {{- if eq $component "cohort" }}
    helm.sh/hook-delete-policy: before-hook-creation
    {{- else }}
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- end }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
