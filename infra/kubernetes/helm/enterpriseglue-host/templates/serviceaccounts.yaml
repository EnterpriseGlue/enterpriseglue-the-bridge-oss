{{- range $component := list "api" "worker" "migration" "preflight" }}
{{- $settings := index $.Values.serviceAccounts $component }}
{{- if and $settings.create (or (ne $component "worker") $.Values.workers.enabled) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "enterpriseglue-host.serviceAccountName" (dict "root" $ "component" $component) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "enterpriseglue-host.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $settings.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
    {{- if or (eq $component "migration") (eq $component "preflight") }}
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- end }}
  {{- end }}
  {{- if and (not $settings.annotations) (or (eq $component "migration") (eq $component "preflight")) }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
