<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 -40 1000 840" fill="none">
  <defs>
    <radialGradient id="light"><stop stop-color="#13213b" stop-opacity=".55"/><stop offset="1" stop-color="#08090d" stop-opacity="0"/></radialGradient>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#131c2b"/><stop offset="1" stop-color="#0a101b"/></linearGradient>
    <linearGradient id="edge"><stop stop-color="#4589ff" stop-opacity=".15"/><stop offset=".55" stop-color="#7597cf" stop-opacity=".65"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".15"/></linearGradient>
    <linearGradient id="path"><stop stop-color="#4589ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
