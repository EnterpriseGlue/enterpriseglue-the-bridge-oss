name: Release Publication Reconcile
run-name: 'Publication observation / ${{ inputs.source_ref || github.event.workflow_run.head_sha }}'

on:
  workflow_run:
    workflows: [Docker Images, Publish Plugin/API Packages, Publish Host Packages, OSS Host Chart, Publish plugin installation toolchain]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Frozen qualified release source (40-character SHA)
        required: true
        type: string
      resume:
        description: Explicitly authorize recovery of missing publications using the frozen candidate
        type: boolean
        default: false
      recovery_prs:
        description: JSON array of reviewed publication-only PRs between the frozen source and this protected workflow
        type: string
        default: '[]'

permissions:
  contents: read

concurrency:
  group: release-publication-observation-${{ inputs.source_ref || github.event.workflow_run.display_title || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
      packages: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout protected publication tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node and read-only package access
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@enterpriseglue'

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Set up Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3

      - name: Authenticate ledger writes and candidate reads
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the frozen source without granting publication authority
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
        with:
          script: |
            const run = context.payload.workflow_run;
            const source = process.env.INPUT_SOURCE_REF || String(run?.display_title || '').match(/ \/ ([a-f0-9]{40})$/)?.[1] || run?.head_sha;
            if (!/^[a-f0-9]{40}$/.test(source || '')) { core.setFailed('Observation requires an exact frozen source.'); return; }
            core.setOutput('source_ref', source);

      - name: Load and verify the immutable publication identity
        run: |
          set -euo pipefail
          mkdir -p .artifacts/release-publication
          bash scripts/release-publication-record-store.sh load '${{ steps.source.outputs.source_ref }}' .artifacts/release-publication/identity
          cp .artifacts/release-publication/identity/publication.json .artifacts/release-publication/publication.json
          tag="$(jq -er '.identity.releaseTag' .artifacts/release-publication/publication.json)"
          bash scripts/fetch-release-candidate.sh '${{ steps.source.outputs.source_ref }}' "$tag" "$RUNNER_TEMP/release-candidate" > "$RUNNER_TEMP/candidate-fetch.log"
          [[ "$(tail -n 1 "$RUNNER_TEMP/candidate-fetch.log")" == "$(jq -er '.identity.candidateRef' .artifacts/release-publication/publication.json)" ]]

      - name: Checkout frozen release data for explicitly authorized recovery
        if: github.event_name == 'workflow_dispatch' && inputs.resume
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.source_ref }}
          path: .artifacts/release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Renew exact-source and reviewed-repair approval
        if: github.event_name == 'workflow_dispatch' && inputs.resume
        env:
          RECOVERY_PRS: ${{ inputs.recovery_prs }}
          RELEASE_SOURCE_ROOT: ${{ github.workspace }}/.artifacts/release-source
        run: |
          set -euo pipefail
          jq --arg repairs "$RECOVERY_PRS" '{inputs:{publish_release:true,source_ref:.identity.sourceRef,release_tag:.identity.releaseTag,
            release_pr:(.identity.releasePR|tostring),required_prs:(.identity.requiredPRs|tojson),recovery_prs:$repairs}}' \
            .artifacts/release-publication/publication.json > "$RUNNER_TEMP/recovery-event.json"
          GITHUB_EVENT_PATH="$RUNNER_TEMP/recovery-event.json" node scripts/release-publication-approval.mjs
          cmp .trivyignore .artifacts/release-source/.trivyignore
          bash scripts/release-publication-security.sh "$RUNNER_TEMP/release-candidate" .artifacts/release-publication/security
          namespace="$(jq -r '.identity.dockerhub.namespace // ""' .artifacts/release-publication/publication.json)"
          node scripts/release-publication-record.mjs create --authorization .artifacts/release-publication/authorization.json \
            --artifacts "$RUNNER_TEMP/release-candidate" --candidate-ref "$(jq -er '.identity.candidateRef' .artifacts/release-publication/publication.json)" \
            --security .artifacts/release-publication/security/security.json --dockerhub-namespace "$namespace" \
            --output .artifacts/release-publication/recovery.json
          node scripts/release-publication-record.mjs compare --existing .artifacts/release-publication/publication.json --proposed .artifacts/release-publication/recovery.json
          cp .artifacts/release-publication/recovery.json .artifacts/release-publication/publication.json

      - name: Observe destinations and optionally resume missing work
        env:
          RELEASE_RECOVERY_AUTHORIZATION: ${{ github.workspace }}/.artifacts/release-publication/authorization.json
          RESUME_PUBLICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.resume && 'true' || 'false' }}
        run: |
          set -euo pipefail
          node scripts/release-publication-observe.mjs .artifacts/release-publication/publication.json \
            "$RUNNER_TEMP/release-candidate" .artifacts/release-publication/observation.json "$RESUME_PUBLICATION"

      - name: Retain the immutable signed observation attempt
        if: always()
        run: |
          set -euo pipefail
          if [[ -f .artifacts/release-publication/observation.json ]]; then
            bash scripts/release-publication-record-store.sh save .artifacts/release-publication/observation.json result
            state="$(jq -er '.state' .artifacts/release-publication/observation.json)"
            echo "Publication state: $state" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain non-secret diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-publication-observation-${{ github.run_id }}
          path: .artifacts/release-publication
          if-no-files-found: error
          retention-days: 90
