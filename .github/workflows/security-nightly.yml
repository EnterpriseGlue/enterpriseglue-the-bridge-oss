name: Security Nightly

on:
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC (avoids CI nightly at 00:00)
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  issues: write

jobs:
  # ---------------------------------------------------------------------------
  # Nightly vulnerability drift scan.
  # Scans the :latest published images from GHCR for newly disclosed CVEs.
  # Opens or updates a tracking issue when findings appear.
  # Also audits .trivyignore for expired suppressions.
  # ---------------------------------------------------------------------------

  resolve:
    runs-on: ubuntu-latest
    outputs:
      backend_image_ref: ${{ steps.refs.outputs.backend }}
      frontend_image_ref: ${{ steps.refs.outputs.frontend }}
      managed_shard_bootstrap_image: ${{ steps.refs.outputs.bootstrap }}
      image_platforms: ${{ steps.refs.outputs.platforms }}
    steps:
      - name: Resolve image refs
        id: refs
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          backend="ghcr.io/${owner_lc}/enterpriseglue-the-bridge-oss-backend:latest"
          frontend="ghcr.io/${owner_lc}/enterpriseglue-the-bridge-oss-frontend:latest"
          bootstrap="ghcr.io/${owner_lc}/enterpriseglue-managed-shard-bootstrap"
          platforms="${IMAGE_PLATFORMS:-linux/amd64,linux/arm64}"
          {
            echo "backend=${backend}"
            echo "frontend=${frontend}"
            echo "bootstrap=${bootstrap}"
            echo "platforms=${platforms}"
          } >> "$GITHUB_OUTPUT"
        env:
          IMAGE_PLATFORMS: ${{ vars.IMAGE_PLATFORMS }}

  drift-scan:
    needs: resolve
    uses: ./.github/workflows/security-nightly-reusable.yml
    with:
      backend_image_ref: ${{ needs.resolve.outputs.backend_image_ref }}
      frontend_image_ref: ${{ needs.resolve.outputs.frontend_image_ref }}
      managed_shard_bootstrap_image: ${{ needs.resolve.outputs.managed_shard_bootstrap_image }}
      image_platforms: ${{ needs.resolve.outputs.image_platforms }}
