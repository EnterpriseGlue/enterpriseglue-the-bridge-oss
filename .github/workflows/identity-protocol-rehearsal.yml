name: Identity Protocol Rehearsal (Advisory)

on:
  pull_request:
    paths:
      - '.github/workflows/identity-protocol-rehearsal.yml'
      - 'package.json'
      - 'backend/**'
      - 'frontend/**'
      - 'packages/**'
      - 'scripts/run-ci-identity-protocol-rehearsals.sh'
      - 'scripts/run-local-*-rehearsal-test.sh'
      - 'scripts/configure-local-*-provider.sh'
      - 'infra/docker/compose/docker-compose*.yml'
      - 'infra/docker/keycloak/**'
      - 'test/e2e/local-*-rehearsal.spec.ts'
  schedule:
    - cron: '25 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: identity-protocol-rehearsal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-notes-preflight:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/release-notes-preflight-reusable.yml
    with:
      base_ref: ${{ github.base_ref || 'main' }}
      pull_number: ${{ github.event.pull_request.number || 0 }}

  protocol-rehearsal:
    name: Disposable OIDC, Entra-compatible OIDC, SAML, and LDAP browser rehearsal
    runs-on: ubuntu-latest
    needs: release-notes-preflight
    # Start advisory while the new full-stack lane proves stable. Set this to
    # false when the team elects to make it a required branch-protection check.
    continue-on-error: true
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.0.8

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for local protocol rehearsals
        run: pnpm exec playwright install --with-deps chromium

      - name: Run disposable identity protocol rehearsals
        run: pnpm run test:identity:protocol-rehearsal

      - name: Upload identity protocol diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: identity-protocol-rehearsal-${{ github.run_id }}
          path: .artifacts/identity-protocol-rehearsal
          if-no-files-found: warn
          retention-days: 7
