name: CodeQL

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "30 2 * * 1"

permissions:
  security-events: write
  contents: read
  actions: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-notes-preflight:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/release-notes-preflight-reusable.yml
    with:
      base_ref: ${{ github.base_ref || 'main' }}
      pull_number: ${{ github.event.pull_request.number || 0 }}

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    needs: release-notes-preflight
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"

  codeql-gate:
    name: CodeQL Gate
    runs-on: ubuntu-latest
    needs: analyze
    permissions:
      security-events: read
      contents: read
    steps:
      - name: Fail if open CodeQL alerts exist for this change
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref || '' }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "merge_group" ]]; then
            if [[ "${MERGE_GROUP_HEAD_REF}" =~ (^|/)pr-([0-9]+)- ]]; then
              PR_NUMBER="${BASH_REMATCH[2]}"
            else
              echo "CodeQL Gate failed: could not resolve a pull-request number from merge-group ref ${MERGE_GROUP_HEAD_REF}."
              exit 1
            fi
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" || "${GITHUB_EVENT_NAME}" == "merge_group" ]]; then
            if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
              echo "CodeQL Gate failed: pull-request number is missing or invalid."
              exit 1
            fi
            target="PR #${PR_NUMBER}"
            alert_count="$(
              gh api --method GET --paginate "repos/${GITHUB_REPOSITORY}/code-scanning/alerts" \
                -f state=open -F pr="${PR_NUMBER}" -f tool_name=CodeQL -F per_page=100 \
                | jq -s 'map(length) | add // 0'
            )"
          else
            target="ref ${GITHUB_REF}"
            alert_count="$(
              gh api --method GET --paginate "repos/${GITHUB_REPOSITORY}/code-scanning/alerts" \
                -f state=open -f ref="${GITHUB_REF}" -f tool_name=CodeQL -F per_page=100 \
                | jq -s 'map(length) | add // 0'
            )"
          fi
          echo "Open CodeQL alerts for ${target}: ${alert_count}"

          if [ "${alert_count}" -gt 0 ]; then
            echo "CodeQL Gate failed: open CodeQL alerts exist for ${target}."
            exit 1
          fi

          echo "CodeQL Gate passed: no open CodeQL alerts for ${target}."
