name: CodeQL

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "30 2 * * 1"

permissions:
  security-events: write
  contents: read
  actions: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@820e3160e279568db735cee8ed8f8e77a6da7818 # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@820e3160e279568db735cee8ed8f8e77a6da7818 # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@820e3160e279568db735cee8ed8f8e77a6da7818 # v3
        with:
          category: "/language:${{ matrix.language }}"

  codeql-gate:
    name: CodeQL Gate
    runs-on: ubuntu-latest
    needs: analyze
    permissions:
      security-events: read
      contents: read
    steps:
      - name: Fail if open CodeQL alerts exist for this change
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
              echo "CodeQL Gate failed: pull-request number is missing or invalid."
              exit 1
            fi
            target="PR #${PR_NUMBER}"
            alert_count="$(
              gh api --method GET --paginate "repos/${GITHUB_REPOSITORY}/code-scanning/alerts" \
                -f state=open -F pr="${PR_NUMBER}" -f tool_name=CodeQL -F per_page=100 \
                | jq -s 'map(length) | add // 0'
            )"
          else
            target="ref ${GITHUB_REF}"
            alert_count="$(
              gh api --method GET --paginate "repos/${GITHUB_REPOSITORY}/code-scanning/alerts" \
                -f state=open -f ref="${GITHUB_REF}" -f tool_name=CodeQL -F per_page=100 \
                | jq -s 'map(length) | add // 0'
            )"
          fi
          echo "Open CodeQL alerts for ${target}: ${alert_count}"

          if [ "${alert_count}" -gt 0 ]; then
            echo "CodeQL Gate failed: open CodeQL alerts exist for ${target}."
            exit 1
          fi

          echo "CodeQL Gate passed: no open CodeQL alerts for ${target}."
