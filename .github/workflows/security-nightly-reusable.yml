name: Security Nightly (Reusable)

on:
  workflow_call:
    inputs:
      backend_image_ref:
        required: true
        type: string
      frontend_image_ref:
        required: true
        type: string
      image_platforms:
        required: false
        type: string
        default: linux/amd64,linux/arm64

permissions:
  contents: read
  packages: read
  issues: write

jobs:
  drift-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # -- Validate image provenance --------------------------------------------

      - name: Validate scanned image provenance
        id: image-meta
        shell: bash
        env:
          EXPECTED_PLATFORMS: ${{ inputs.image_platforms }}
          EXPECTED_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          backend_ref="${{ inputs.backend_image_ref }}"
          frontend_ref="${{ inputs.frontend_image_ref }}"

          docker buildx imagetools inspect "$backend_ref" --format '{{json .}}' \
            | node scripts/verify-oci-image-metadata.mjs backend \
            >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$frontend_ref" --format '{{json .}}' \
            | node scripts/verify-oci-image-metadata.mjs frontend \
            >> "$GITHUB_OUTPUT"

      - name: Summarize scanned image provenance
        shell: bash
        run: |
          {
            echo "### Scanned image metadata"
            echo "| Image | Ref | Version | Revision | Digest |"
            echo "|---|---|---|---|---|"
            echo "| backend | \`${{ inputs.backend_image_ref }}\` | ${{ steps.image-meta.outputs.backend_version }} | \`${{ steps.image-meta.outputs.backend_revision }}\` | \`${{ steps.image-meta.outputs.backend_digest }}\` |"
            echo "| frontend | \`${{ inputs.frontend_image_ref }}\` | ${{ steps.image-meta.outputs.frontend_version }} | \`${{ steps.image-meta.outputs.frontend_revision }}\` | \`${{ steps.image-meta.outputs.frontend_digest }}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # -- Trivy scans --------------------------------------------------------

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0
          cache: false

      - name: Trivy scan backend image
        # Defer failure until reports are uploaded and the tracking issue is updated.
        run: >-
          bash ./scripts/run-trivy-image-scan.sh
          '${{ inputs.backend_image_ref }}'
          backend-trivy.json 0

      - name: Trivy scan frontend image
        run: >-
          bash ./scripts/run-trivy-image-scan.sh
          '${{ inputs.frontend_image_ref }}'
          frontend-trivy.json 0

      # -- Artifact upload -----------------------------------------------------

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-nightly-${{ github.run_id }}
          path: |
            backend-trivy.json
            frontend-trivy.json
          if-no-files-found: warn

      # -- Audit .trivyignore expiry -------------------------------------------

      - name: Audit trivyignore expiry
        id: expiry
        run: |
          today=$(date -u +%Y-%m-%d)
          expired=""
          while IFS= read -r line; do
            if [[ ! "$line" =~ ^[[:space:]]*#[[:space:]]+owner: ]]; then
              continue
            fi
            if [[ "$line" =~ expires:\ ([0-9]{4}-[0-9]{2}-[0-9]{2}) ]]; then
              exp_date="${BASH_REMATCH[1]}"
              if [[ "$exp_date" < "$today" || "$exp_date" == "$today" ]]; then
                expired="${expired}\n${line}"
              fi
            fi
          done < .trivyignore

          if [ -n "$expired" ]; then
            echo "has_expired=true" >> "$GITHUB_OUTPUT"
            {
              echo "expired_entries<<EOF"
              echo -e "$expired"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "has_expired=false" >> "$GITHUB_OUTPUT"
          fi

      # -- Collect results and decide if issue is needed -----------------------

      - name: Evaluate findings
        id: evaluate
        run: |
          total=0
          critical_total=0
          high_total=0
          body=""

          for img in backend frontend; do
            file="${img}-trivy.json"
            if [ -f "$file" ]; then
              count=$(jq '[.Results[]?.Vulnerabilities // [] | length] | add // 0' "$file")
              critical=$(jq '[.Results[]?.Vulnerabilities // [] | .[] | select(.Severity == "CRITICAL")] | length' "$file")
              high=$(jq '[.Results[]?.Vulnerabilities // [] | .[] | select(.Severity == "HIGH")] | length' "$file")
              medium=$(jq '[.Results[]?.Vulnerabilities // [] | .[] | select(.Severity == "MEDIUM")] | length' "$file")
              low=$(jq '[.Results[]?.Vulnerabilities // [] | .[] | select(.Severity == "LOW")] | length' "$file")
              total=$((total + count))
              critical_total=$((critical_total + critical))
              high_total=$((high_total + high))

              body="${body}### ${img}\n"
              body="${body}| Severity | Count |\n|---|---|\n"
              body="${body}| Critical | ${critical} |\n"
              body="${body}| High | ${high} |\n"
              body="${body}| Medium | ${medium} |\n"
              body="${body}| Low | ${low} |\n"
              body="${body}| **Total** | **${count}** |\n\n"

              if [ "$count" -gt 0 ]; then
                body="${body}<details><summary>Vulnerability list</summary>\n\n"
                body="${body}| CVE | Package | Severity | Installed | Fixed |\n|---|---|---|---|---|\n"
                body="${body}$(jq -r '[.Results[]?.Vulnerabilities // [] | .[] | "| \(.VulnerabilityID) | \(.PkgName) | \(.Severity) | \(.InstalledVersion) | \(.FixedVersion // "none") |"] | .[]' "$file")\n"
                body="${body}\n</details>\n\n"
              fi
            fi
          done

          {
            echo "total=${total}"
            echo "critical=${critical_total}"
            echo "high=${high_total}"
            echo "body<<EOF"
            echo -e "$body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # -- Step summary --------------------------------------------------------

      - name: Security scan summary
        if: always()
        run: |
          {
            echo "## Nightly Security Drift Scan"
            echo ""
            echo "**Date:** $(date -u +%Y-%m-%d)"
            echo "**Total findings:** ${{ steps.evaluate.outputs.total }}"
            echo "**Release-blocking findings:** ${{ steps.evaluate.outputs.critical }} critical, ${{ steps.evaluate.outputs.high }} high"
            echo ""

            for img in backend frontend; do
              file="${img}-trivy.json"
              if [ -f "$file" ]; then
                count=$(jq '[.Results[]?.Vulnerabilities // [] | length] | add // 0' "$file")
                critical=$(jq '[.Results[]?.Vulnerabilities // [] | .[] | select(.Severity == "CRITICAL")] | length' "$file")
                high=$(jq '[.Results[]?.Vulnerabilities // [] | .[] | select(.Severity == "HIGH")] | length' "$file")
                medium=$(jq '[.Results[]?.Vulnerabilities // [] | .[] | select(.Severity == "MEDIUM")] | length' "$file")
                low=$(jq '[.Results[]?.Vulnerabilities // [] | .[] | select(.Severity == "LOW")] | length' "$file")
                echo "### ${img}"
                echo "| Severity | Count |"
                echo "|---|---|"
                echo "| Critical | ${critical} |"
                echo "| High | ${high} |"
                echo "| Medium | ${medium} |"
                echo "| Low | ${low} |"
                echo "| **Total** | **${count}** |"
                echo ""

                if [ "$count" -gt 0 ]; then
                  echo "<details><summary>Vulnerability details</summary>"
                  echo ""
                  echo "| CVE | Package | Severity | Installed | Fixed |"
                  echo "|---|---|---|---|---|"
                  jq -r '[.Results[]?.Vulnerabilities // [] | .[] | "| \(.VulnerabilityID) | \(.PkgName) | \(.Severity) | \(.InstalledVersion) | \(.FixedVersion // "none") |"] | .[]' "$file"
                  echo ""
                  echo "</details>"
                  echo ""
                fi
              fi
            done

            if [ "${{ steps.expiry.outputs.has_expired }}" == "true" ]; then
              echo "### ⚠️ Expired .trivyignore entries"
              echo '```'
              echo "${{ steps.expiry.outputs.expired_entries }}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # -- Create or update tracking issue -------------------------------------

      - name: Create or update security issue
        if: steps.evaluate.outputs.total != '0' || steps.expiry.outputs.has_expired == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = '🔒 Nightly Security Drift: vulnerabilities detected';
            const label = 'security';
            const total = '${{ steps.evaluate.outputs.total }}';
            const hasExpired = '${{ steps.expiry.outputs.has_expired }}' === 'true';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            let body = `## Nightly Security Drift Report\n\n`;
            body += `**Run:** [${process.env.GITHUB_RUN_ID}](${runUrl})\n`;
            body += `**Date:** ${new Date().toISOString().split('T')[0]}\n`;
            body += `**Total findings:** ${total}\n\n`;
            body += `### Scanned images\n\n`;
            body += `| Image | Ref | Version | Revision | Digest |\n|---|---|---|---|---|\n`;
            body += `| backend | \`${{ inputs.backend_image_ref }}\` | ${{ steps.image-meta.outputs.backend_version }} | \`${{ steps.image-meta.outputs.backend_revision }}\` | \`${{ steps.image-meta.outputs.backend_digest }}\` |\n`;
            body += `| frontend | \`${{ inputs.frontend_image_ref }}\` | ${{ steps.image-meta.outputs.frontend_version }} | \`${{ steps.image-meta.outputs.frontend_revision }}\` | \`${{ steps.image-meta.outputs.frontend_digest }}\` |\n\n`;
            body += ${{ toJSON(steps.evaluate.outputs.body) }};

            if (hasExpired) {
              body += `\n### ⚠️ Expired .trivyignore entries\n\n`;
              body += '```\n';
              body += ${{ toJSON(steps.expiry.outputs.expired_entries) }};
              body += '\n```\n';
              body += `\nThese suppressions have expired and should be reviewed.\n`;
            }

            body += `\n---\n_This issue is auto-managed by the nightly security drift scan. It will be closed when findings reach zero._`;

            // Ensure label exists
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'e11d48',
                description: 'Security-related issues',
              });
            }

            // Find existing open issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
              creator: 'github-actions[bot]',
              per_page: 10,
            });

            const existing = issues.find(i => i.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: body,
              });
              core.info(`Updated issue #${existing.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: [label],
              });
              core.info(`Created issue #${created.number}`);
            }

      - name: Close resolved security issue
        if: steps.evaluate.outputs.total == '0' && steps.expiry.outputs.has_expired != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = '🔒 Nightly Security Drift: vulnerabilities detected';
            const label = 'security';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
              creator: 'github-actions[bot]',
              per_page: 10,
            });

            const existing = issues.find(i => i.title === title);

            if (existing) {
              const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed',
                body: existing.body + `\n\n---\n✅ **Resolved** on ${new Date().toISOString().split('T')[0]} — [run](${runUrl})`,
              });
              core.info(`Closed issue #${existing.number} — zero findings`);
            }

      - name: Enforce high and critical vulnerability gate
        if: always() && steps.evaluate.outcome == 'success'
        shell: bash
        env:
          CRITICAL_FINDINGS: ${{ steps.evaluate.outputs.critical }}
          HIGH_FINDINGS: ${{ steps.evaluate.outputs.high }}
        run: node scripts/enforce-security-severity-gate.mjs
