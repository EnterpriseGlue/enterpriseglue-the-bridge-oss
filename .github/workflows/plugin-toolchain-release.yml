name: Publish plugin installation toolchain

on:
  workflow_run:
    workflows: [Docker Images]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact 40-character OSS commit to build and publish
        required: true
        type: string
      release_tag:
        description: Existing OSS release tag that will receive permanent distribution assets
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: enterpriseglue-plugin-toolchain-production
  cancel-in-progress: false

jobs:
  publish:
    name: Verify, sign, and publish the reusable plugin toolchain
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: plugin-toolchain-production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SOURCE_REF: ${{ inputs.source_ref || github.event.workflow_run.head_sha }}
      REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
      INSTALLER_REPOSITORY: ghcr.io/enterpriseglue/plugin-installer
      MANAGER_REPOSITORY: ghcr.io/enterpriseglue/plugin-manager
      RUNTIME_CHART_REPOSITORY: ghcr.io/enterpriseglue/charts/enterpriseglue-plugin-runtime
      RBAC_CHART_REPOSITORY: ghcr.io/enterpriseglue/charts/enterpriseglue-plugin-installer-rbac
      MANAGER_CHART_REPOSITORY: ghcr.io/enterpriseglue/charts/enterpriseglue-plugin-manager
      TRIVY_IMAGE: aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
      ZOT_IMAGE: ghcr.io/project-zot/zot-minimal@sha256:892f2a5a63dd99bdf85320fee5448506119328a6d5e1a2d14d4db876be595236
      COSIGN_EXPERIMENTAL: '1'

    steps:
      - name: Validate protected release authority
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo "source_ref must be an immutable 40-character commit" >&2
            exit 1
          }
          [[ "$GITHUB_REPOSITORY_OWNER" == "EnterpriseGlue" ]] || {
            echo "Plugin toolchain releases are restricted to EnterpriseGlue" >&2
            exit 1
          }
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "The protected release workflow must run from refs/heads/main" >&2
            exit 1
          }
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$REQUESTED_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "recovery dispatch requires an exact semantic release_tag" >&2
              exit 1
            }
          else
            [[ "${{ github.event.workflow_run.name }}" == "Docker Images" ]]
            [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]]
            [[ "${{ github.event.workflow_run.event }}" == "release" ]]
            [[ "$SOURCE_REF" == "${{ github.event.workflow_run.head_sha }}" ]]
          fi

      - name: Checkout the exact public OSS revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Resolve the owning OSS release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          release_tag="$REQUESTED_RELEASE_TAG"
          if [[ -z "$release_tag" ]]; then
            release_tag="$(
              git tag --points-at "$SOURCE_REF" --list 'v[0-9]*.[0-9]*.[0-9]*' \
                --sort=-v:refname | head -n 1
            )"
          fi
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "No exact semantic OSS release tag points at $SOURCE_REF" >&2
            exit 1
          }
          [[ "$(git rev-list -n 1 "$release_tag")" == "$SOURCE_REF" ]] || {
            echo "$release_tag does not point at $SOURCE_REF" >&2
            exit 1
          }
          gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Verify checked-out source identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_REF" ]]
          test -z "$(git status --porcelain)"

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.0.8
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.5

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        # Keep the CLI version coupled to the immutable setup action. The action's
        # bundled default is guaranteed to exist in its frozen release catalog.

      - name: Set up Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3

      - name: Install the immutable public dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Resolve and validate one toolchain version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          INSTALLER_VERSION="$(node -p "require('./packages/plugin-installer/package.json').version")"
          MANAGER_VERSION="$(node -p "require('./packages/plugin-manager/package.json').version")"
          RUNTIME_CHART_VERSION="$(sed -n 's/^version:[[:space:]]*//p' infra/kubernetes/helm/enterpriseglue-plugin-runtime/Chart.yaml)"
          RBAC_CHART_VERSION="$(sed -n 's/^version:[[:space:]]*//p' infra/kubernetes/helm/enterpriseglue-plugin-installer-rbac/Chart.yaml)"
          MANAGER_CHART_VERSION="$(sed -n 's/^version:[[:space:]]*//p' infra/kubernetes/helm/enterpriseglue-plugin-manager/Chart.yaml)"
          [[ "$INSTALLER_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$MANAGER_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$INSTALLER_VERSION" == "$RUNTIME_CHART_VERSION" ]]
          [[ "$INSTALLER_VERSION" == "$RBAC_CHART_VERSION" ]]
          [[ "$MANAGER_VERSION" == "$MANAGER_CHART_VERSION" ]]
          echo "version=$INSTALLER_VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "TOOLCHAIN_VERSION=$INSTALLER_VERSION"
            echo "MANAGER_VERSION=$MANAGER_VERSION"
            echo "INSTALLER_TAG_REFERENCE=$INSTALLER_REPOSITORY:$INSTALLER_VERSION-$SOURCE_REF"
            echo "MANAGER_TAG_REFERENCE=$MANAGER_REPOSITORY:$MANAGER_VERSION-$SOURCE_REF"
            echo "CHART_OUTPUT=$RUNNER_TEMP/enterpriseglue-plugin-charts"
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$SOURCE_REF")"
          } >> "$GITHUB_ENV"

      - name: Run public plugin-platform and chart gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm guard:paid-plugin-boundary
          pnpm test:plugin-platform
          pnpm typecheck:plugin-platform
          pnpm test:plugin-platform:helm

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate Helm to GHCR
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" |
            helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Fetch the signed pre-tag candidate when required
        shell: bash
        run: |
          set -euo pipefail
          if git cat-file -e "$SOURCE_REF:.github/workflows/release-candidate-stage.yml" 2>/dev/null; then
            candidate="$RUNNER_TEMP/release-candidate"
            mkdir -p "$candidate"
            bash scripts/fetch-release-candidate.sh "$SOURCE_REF" "$RELEASE_TAG" "$candidate" >/dev/null
            echo "CANDIDATE_RECEIPT=$candidate/release-candidate.json" >> "$GITHUB_ENV"
            echo "CANDIDATE_PAYLOAD=$candidate" >> "$GITHUB_ENV"
          else
            echo "LEGACY_RELEASE_WITHOUT_CANDIDATE=true" >> "$GITHUB_ENV"
          fi

      - name: Resolve resumable immutable image state
        id: existing-images
        shell: bash
        run: |
          set -euo pipefail
          installer_exists=false
          manager_exists=false
          if docker buildx imagetools inspect "$INSTALLER_TAG_REFERENCE" >/dev/null 2>&1; then
            installer_exists=true
            installer_digest="$(oras resolve "$INSTALLER_TAG_REFERENCE")"
            [[ "$installer_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "installer_digest=$installer_digest" >> "$GITHUB_OUTPUT"
          fi
          if docker buildx imagetools inspect "$MANAGER_TAG_REFERENCE" >/dev/null 2>&1; then
            manager_exists=true
            manager_digest="$(oras resolve "$MANAGER_TAG_REFERENCE")"
            [[ "$manager_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "manager_digest=$manager_digest" >> "$GITHUB_OUTPUT"
          fi
          echo "installer_exists=$installer_exists" >> "$GITHUB_OUTPUT"
          echo "manager_exists=$manager_exists" >> "$GITHUB_OUTPUT"

      - name: Build and publish the multi-architecture installer
        id: installer
        if: steps.existing-images.outputs.installer_exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./packages/plugin-installer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.INSTALLER_TAG_REFERENCE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_REF }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Record the immutable installer reference
        env:
          INSTALLER_DIGEST: ${{ steps.installer.outputs.digest || steps.existing-images.outputs.installer_digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$INSTALLER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "INSTALLER_REFERENCE=$INSTALLER_REPOSITORY@$INSTALLER_DIGEST" >> "$GITHUB_ENV"

      - name: Build and publish the multi-architecture native manager
        id: manager
        if: steps.existing-images.outputs.manager_exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./packages/plugin-manager/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.MANAGER_TAG_REFERENCE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_REF }}
            org.opencontainers.image.version=${{ env.MANAGER_VERSION }}

      - name: Record the immutable manager reference
        env:
          MANAGER_DIGEST: ${{ steps.manager.outputs.digest || steps.existing-images.outputs.manager_digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MANAGER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "MANAGER_REFERENCE=$MANAGER_REPOSITORY@$MANAGER_DIGEST" >> "$GITHUB_ENV"

      - name: Bind toolchain images to the qualified candidate
        if: env.CANDIDATE_RECEIPT != ''
        shell: bash
        run: |
          set -euo pipefail
          [[ "$INSTALLER_REFERENCE" == "$(jq -er '.subjects.pluginInstaller.subject' "$CANDIDATE_RECEIPT")" ]]
          [[ "$MANAGER_REFERENCE" == "$(jq -er '.subjects.pluginManager.subject' "$CANDIDATE_RECEIPT")" ]]

      - name: Package and publish the fixed Helm charts
        shell: bash
        run: |
          set -euo pipefail
          REPRO_OUTPUT="$RUNNER_TEMP/enterpriseglue-plugin-charts-repro"
          mkdir -p "$CHART_OUTPUT" "$REPRO_OUTPUT"
          helm package infra/kubernetes/helm/enterpriseglue-plugin-runtime \
            --destination "$CHART_OUTPUT"
          helm package infra/kubernetes/helm/enterpriseglue-plugin-installer-rbac \
            --destination "$CHART_OUTPUT"
          helm package infra/kubernetes/helm/enterpriseglue-plugin-manager \
            --destination "$CHART_OUTPUT"
          helm package infra/kubernetes/helm/enterpriseglue-plugin-runtime \
            --destination "$REPRO_OUTPUT" >/dev/null
          helm package infra/kubernetes/helm/enterpriseglue-plugin-installer-rbac \
            --destination "$REPRO_OUTPUT" >/dev/null
          helm package infra/kubernetes/helm/enterpriseglue-plugin-manager \
            --destination "$REPRO_OUTPUT" >/dev/null
          RUNTIME_ARCHIVE="$CHART_OUTPUT/enterpriseglue-plugin-runtime-$TOOLCHAIN_VERSION.tgz"
          RBAC_ARCHIVE="$CHART_OUTPUT/enterpriseglue-plugin-installer-rbac-$TOOLCHAIN_VERSION.tgz"
          MANAGER_ARCHIVE="$CHART_OUTPUT/enterpriseglue-plugin-manager-$MANAGER_VERSION.tgz"
          test -f "$RUNTIME_ARCHIVE"
          test -f "$RBAC_ARCHIVE"
          test -f "$MANAGER_ARCHIVE"
          node scripts/helm-chart-archive.mjs compare \
            "$RUNTIME_ARCHIVE" "$REPRO_OUTPUT/$(basename "$RUNTIME_ARCHIVE")"
          node scripts/helm-chart-archive.mjs compare \
            "$RBAC_ARCHIVE" "$REPRO_OUTPUT/$(basename "$RBAC_ARCHIVE")"
          node scripts/helm-chart-archive.mjs compare \
            "$MANAGER_ARCHIVE" "$REPRO_OUTPUT/$(basename "$MANAGER_ARCHIVE")"
          if [[ -n "${CANDIDATE_PAYLOAD:-}" ]]; then
            node scripts/helm-chart-archive.mjs compare \
              "$RUNTIME_ARCHIVE" "$CANDIDATE_PAYLOAD/charts/$(basename "$RUNTIME_ARCHIVE")"
            node scripts/helm-chart-archive.mjs compare \
              "$RBAC_ARCHIVE" "$CANDIDATE_PAYLOAD/charts/$(basename "$RBAC_ARCHIVE")"
            node scripts/helm-chart-archive.mjs compare \
              "$MANAGER_ARCHIVE" "$CANDIDATE_PAYLOAD/charts/$(basename "$MANAGER_ARCHIVE")"
          fi
          publish_or_verify_chart() {
            local archive="$1"
            local repository="$2"
            local version="$3"
            local candidate_key="$4"
            local existing
            existing="$(oras resolve "$repository:$version" 2>/dev/null || true)"
            if [[ -z "$existing" ]]; then
              if [[ -n "${CANDIDATE_RECEIPT:-}" ]]; then
                local candidate_subject candidate_digest
                candidate_subject="$(jq -er --arg key "$candidate_key" '.subjects[$key].subject' "$CANDIDATE_RECEIPT")"
                candidate_digest="${candidate_subject##*@}"
                oras cp -r "$candidate_subject" "$repository:$version"
                [[ "$(oras resolve "$repository:$version")" == "$candidate_digest" ]]
              else
                helm push "$archive" oci://ghcr.io/enterpriseglue/charts
              fi
              existing="$(oras resolve "$repository:$version")"
            fi
            local layer pulled
            layer="$(
              oras manifest fetch "$repository@$existing" |
                jq -er '[.layers[] | select(.mediaType == "application/vnd.cncf.helm.chart.content.v1.tar+gzip") | .digest] | if length == 1 then .[0] else error("expected one chart layer") end'
            )"
            pulled="$RUNNER_TEMP/existing-$(basename "$archive")"
            oras blob fetch --output "$pulled" "$repository@$layer"
            node scripts/helm-chart-archive.mjs compare "$archive" "$pulled" || {
                echo "Published immutable chart version $repository:$version differs from source" >&2
                exit 1
              }
            if [[ -n "${CANDIDATE_RECEIPT:-}" ]]; then
              [[ "$existing" == "$(jq -er --arg key "$candidate_key" '.subjects[$key].subject' "$CANDIDATE_RECEIPT" | sed 's/.*@//')" ]]
            fi
          }
          publish_or_verify_chart "$RUNTIME_ARCHIVE" "$RUNTIME_CHART_REPOSITORY" "$TOOLCHAIN_VERSION" runtimeChart
          publish_or_verify_chart "$RBAC_ARCHIVE" "$RBAC_CHART_REPOSITORY" "$TOOLCHAIN_VERSION" installerRbacChart
          publish_or_verify_chart "$MANAGER_ARCHIVE" "$MANAGER_CHART_REPOSITORY" "$MANAGER_VERSION" managerChart
          RUNTIME_DIGEST="$(oras resolve "$RUNTIME_CHART_REPOSITORY:$TOOLCHAIN_VERSION")"
          RBAC_DIGEST="$(oras resolve "$RBAC_CHART_REPOSITORY:$TOOLCHAIN_VERSION")"
          MANAGER_CHART_DIGEST="$(oras resolve "$MANAGER_CHART_REPOSITORY:$MANAGER_VERSION")"
          [[ "$RUNTIME_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$RBAC_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$MANAGER_CHART_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "RUNTIME_CHART_REFERENCE=$RUNTIME_CHART_REPOSITORY@$RUNTIME_DIGEST"
            echo "RBAC_CHART_REFERENCE=$RBAC_CHART_REPOSITORY@$RBAC_DIGEST"
            echo "MANAGER_CHART_REFERENCE=$MANAGER_CHART_REPOSITORY@$MANAGER_CHART_DIGEST"
            echo "RUNTIME_CHART_ARCHIVE=$RUNTIME_ARCHIVE"
            echo "RBAC_CHART_ARCHIVE=$RBAC_ARCHIVE"
            echo "MANAGER_CHART_ARCHIVE=$MANAGER_ARCHIVE"
          } >> "$GITHUB_ENV"

      - name: Sign all immutable toolchain subjects with workload identity
        shell: bash
        run: |
          set -euo pipefail
          for subject in \
            "$INSTALLER_REFERENCE" \
            "$MANAGER_REFERENCE" \
            "$RUNTIME_CHART_REFERENCE" \
            "$RBAC_CHART_REFERENCE" \
            "$MANAGER_CHART_REFERENCE"; do
            cosign sign --yes --registry-referrers-mode=oci-1-1 "$subject"
          done

      - name: Attest the installer image
        if: steps.existing-images.outputs.installer_exists != 'true'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ env.INSTALLER_REPOSITORY }}
          subject-digest: ${{ steps.installer.outputs.digest }}
          push-to-registry: true

      - name: Attest the manager image
        if: steps.existing-images.outputs.manager_exists != 'true'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ env.MANAGER_REPOSITORY }}
          subject-digest: ${{ steps.manager.outputs.digest }}
          push-to-registry: true

      - name: Verify signatures, scans, tools, and exact chart payloads
        shell: bash
        run: |
          set -euo pipefail
          CERTIFICATE_IDENTITY="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/plugin-toolchain-release.yml@$GITHUB_REF"
          for subject in \
            "$INSTALLER_REFERENCE" \
            "$MANAGER_REFERENCE" \
            "$RUNTIME_CHART_REFERENCE" \
            "$RBAC_CHART_REFERENCE" \
            "$MANAGER_CHART_REFERENCE"; do
            cosign verify \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$subject" >/dev/null
          done
          docker buildx imagetools inspect "$INSTALLER_REFERENCE" >/dev/null
          docker buildx imagetools inspect "$MANAGER_REFERENCE" >/dev/null
          docker pull "$INSTALLER_REFERENCE"
          docker pull "$MANAGER_REFERENCE"
          docker run --rm --entrypoint oras "$INSTALLER_REFERENCE" version
          docker run --rm --entrypoint cosign "$INSTALLER_REFERENCE" version
          docker run --rm --entrypoint helm "$INSTALLER_REFERENCE" version --short
          docker run --rm --entrypoint kubectl "$INSTALLER_REFERENCE" version --client
          docker run --rm --entrypoint oras "$MANAGER_REFERENCE" version
          docker run --rm --entrypoint cosign "$MANAGER_REFERENCE" version
          docker run --rm --entrypoint helm "$MANAGER_REFERENCE" version --short
          docker run --rm --entrypoint kubectl "$MANAGER_REFERENCE" version --client
          docker run --rm \
            --volume "$HOME/.docker:/root/.docker:ro" \
            "$TRIVY_IMAGE" image --quiet --exit-code 1 \
            --severity HIGH,CRITICAL "$INSTALLER_REFERENCE"
          docker run --rm \
            --volume "$HOME/.docker:/root/.docker:ro" \
            "$TRIVY_IMAGE" image --quiet --exit-code 1 \
            --severity HIGH,CRITICAL "$MANAGER_REFERENCE"

          mkdir -p "$RUNNER_TEMP/runtime-chart-pull" "$RUNNER_TEMP/rbac-chart-pull" "$RUNNER_TEMP/manager-chart-pull"
          RUNTIME_LAYER_DIGEST="$(
            oras manifest fetch "$RUNTIME_CHART_REFERENCE" |
              jq -er '
                [.layers[]
                  | select(.mediaType == "application/vnd.cncf.helm.chart.content.v1.tar+gzip")
                  | .digest]
                | if length == 1 then .[0] else error("expected exactly one Helm chart layer") end
              '
          )"
          RBAC_LAYER_DIGEST="$(
            oras manifest fetch "$RBAC_CHART_REFERENCE" |
              jq -er '
                [.layers[]
                  | select(.mediaType == "application/vnd.cncf.helm.chart.content.v1.tar+gzip")
                  | .digest]
                | if length == 1 then .[0] else error("expected exactly one Helm chart layer") end
              '
          )"
          MANAGER_CHART_LAYER_DIGEST="$(
            oras manifest fetch "$MANAGER_CHART_REFERENCE" |
              jq -er '
                [.layers[]
                  | select(.mediaType == "application/vnd.cncf.helm.chart.content.v1.tar+gzip")
                  | .digest]
                | if length == 1 then .[0] else error("expected exactly one Helm chart layer") end
              '
          )"
          PULLED_RUNTIME="$RUNNER_TEMP/runtime-chart-pull/$(basename "$RUNTIME_CHART_ARCHIVE")"
          PULLED_RBAC="$RUNNER_TEMP/rbac-chart-pull/$(basename "$RBAC_CHART_ARCHIVE")"
          PULLED_MANAGER_CHART="$RUNNER_TEMP/manager-chart-pull/$(basename "$MANAGER_CHART_ARCHIVE")"
          oras blob fetch \
            --output "$PULLED_RUNTIME" \
            "${RUNTIME_CHART_REFERENCE%@*}@$RUNTIME_LAYER_DIGEST"
          oras blob fetch \
            --output "$PULLED_RBAC" \
            "${RBAC_CHART_REFERENCE%@*}@$RBAC_LAYER_DIGEST"
          oras blob fetch \
            --output "$PULLED_MANAGER_CHART" \
            "${MANAGER_CHART_REFERENCE%@*}@$MANAGER_CHART_LAYER_DIGEST"
          node scripts/helm-chart-archive.mjs compare "$RUNTIME_CHART_ARCHIVE" "$PULLED_RUNTIME"
          node scripts/helm-chart-archive.mjs compare "$RBAC_CHART_ARCHIVE" "$PULLED_RBAC"
          node scripts/helm-chart-archive.mjs compare "$MANAGER_CHART_ARCHIVE" "$PULLED_MANAGER_CHART"
          {
            echo "PUBLISHED_RUNTIME_CHART_ARCHIVE=$PULLED_RUNTIME"
            echo "PUBLISHED_RBAC_CHART_ARCHIVE=$PULLED_RBAC"
            echo "PUBLISHED_MANAGER_CHART_ARCHIVE=$PULLED_MANAGER_CHART"
          } >> "$GITHUB_ENV"

      - name: Write the immutable toolchain release receipt
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT="$RUNNER_TEMP/enterpriseglue-plugin-toolchain-receipt"
          mkdir -p "$RECEIPT"
          cp "$PUBLISHED_RUNTIME_CHART_ARCHIVE" "$RECEIPT/"
          cp "$PUBLISHED_RBAC_CHART_ARCHIVE" "$RECEIPT/"
          cp "$PUBLISHED_MANAGER_CHART_ARCHIVE" "$RECEIPT/"
          jq -n \
            --arg version "$TOOLCHAIN_VERSION" \
            --arg sourceRevision "$SOURCE_REF" \
            --arg installer "$INSTALLER_REFERENCE" \
            --arg managerVersion "$MANAGER_VERSION" \
            --arg manager "$MANAGER_REFERENCE" \
            --arg runtimeChart "$RUNTIME_CHART_REFERENCE" \
            --arg runtimeChartSha256 "$(sha256sum "$PUBLISHED_RUNTIME_CHART_ARCHIVE" | cut -d' ' -f1)" \
            --arg rbacChart "$RBAC_CHART_REFERENCE" \
            --arg rbacChartSha256 "$(sha256sum "$PUBLISHED_RBAC_CHART_ARCHIVE" | cut -d' ' -f1)" \
            --arg managerChart "$MANAGER_CHART_REFERENCE" \
            --arg managerChartSha256 "$(sha256sum "$PUBLISHED_MANAGER_CHART_ARCHIVE" | cut -d' ' -f1)" \
            --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{
              schemaVersion: "enterpriseglue-plugin-toolchain-release/v1",
              version: $version,
              sourceRevision: $sourceRevision,
              installer: $installer,
              managerVersion: $managerVersion,
              manager: $manager,
              runtimeChart: {
                subject: $runtimeChart,
                archiveSha256: $runtimeChartSha256
              },
              installerRbacChart: {
                subject: $rbacChart,
                archiveSha256: $rbacChartSha256
              },
              managerChart: {
                subject: $managerChart,
                archiveSha256: $managerChartSha256
              },
              workflowRun: $workflowRun,
              customerCiRequired: false,
              customerBuildRequired: false
            }' > "$RECEIPT/release.json"

      - name: Build, sign, and verify the generic air-gap toolchain
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT="$RUNNER_TEMP/enterpriseglue-plugin-toolchain-receipt"
          AIRGAP="$RECEIPT/toolchain-airgap"
          TRUSTED_ROOT="$RUNNER_TEMP/sigstore-trusted-root.json"
          IMPORT_RECEIPT="$RECEIPT/toolchain-airgap-import-receipt.json"
          TARGET_REGISTRY_NAME="enterpriseglue-toolchain-airgap-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          TARGET_REGISTRY="127.0.0.1:5000"
          CERTIFICATE_IDENTITY="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/plugin-toolchain-release.yml@$GITHUB_REF"

          EG_PLUGIN_TOOLCHAIN_AIRGAP_GENERATED_AT="$(
            date -u -d "@$SOURCE_DATE_EPOCH" '+%Y-%m-%dT%H:%M:%SZ'
          )" node scripts/plugin-toolchain-airgap.mjs export \
            --release "$RECEIPT/release.json" \
            --output "$AIRGAP"
          cosign sign-blob --yes \
            --bundle "$AIRGAP/toolchain-airgap.sigstore.json" \
            "$AIRGAP/toolchain-airgap.json" >/dev/null
          cosign trusted-root create \
            --with-default-services \
            --out "$TRUSTED_ROOT"
          cosign verify-blob \
            --bundle "$AIRGAP/toolchain-airgap.sigstore.json" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --trusted-root "$TRUSTED_ROOT" \
            "$AIRGAP/toolchain-airgap.json" >/dev/null

          cleanup_target_registry() {
            docker rm -f "$TARGET_REGISTRY_NAME" >/dev/null 2>&1 || true
          }
          trap cleanup_target_registry EXIT INT TERM
          docker run --detach \
            --name "$TARGET_REGISTRY_NAME" \
            --publish 127.0.0.1:5000:5000 \
            "$ZOT_IMAGE" >/dev/null
          for attempt in $(seq 1 60); do
            if curl --fail --silent "http://$TARGET_REGISTRY/v2/" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Disposable air-gap target registry did not become ready" >&2
              exit 1
            fi
            sleep 0.25
          done

          node scripts/plugin-toolchain-airgap.mjs import \
            --bundle "$AIRGAP" \
            --target-prefix "$TARGET_REGISTRY/enterpriseglue" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --trusted-root "$TRUSTED_ROOT" \
            --target-plain-http \
            --receipt "$IMPORT_RECEIPT" >/dev/null
          jq -e \
            '.schemaVersion == "enterpriseglue-plugin-toolchain-airgap-import/v1"
              and .sourceRegistryAccessed == false
              and .customerCiRequired == false
              and .customerBuildRequired == false
              and (.artifacts | length == 5)
              and all(.artifacts[]; .signatureVerified == true)' \
            "$IMPORT_RECEIPT" >/dev/null

      - name: Resolve and verify the published OSS application images
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE_METADATA="$RUNNER_TEMP/application-image-digests"
          mkdir -p "$IMAGE_METADATA"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            docker_images_run="${{ github.event.workflow_run.id }}"
          else
            docker_images_run="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow docker-images.yml \
                --commit "$SOURCE_REF" \
                --event release \
                --status success \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId'
            )"
          fi
          [[ "$docker_images_run" =~ ^[0-9]+$ ]] || {
            echo "No successful Docker Images release run was found for $SOURCE_REF" >&2
            exit 1
          }
          gh run download "$docker_images_run" \
            --repo "$GITHUB_REPOSITORY" \
            --name "image-digests-$RELEASE_TAG" \
            --dir "$IMAGE_METADATA"
          IMAGE_DIGESTS="$IMAGE_METADATA/image-digests.json"
          jq -e \
            --arg revision "$SOURCE_REF" \
            --arg version "$RELEASE_TAG" \
            '.revision == $revision
              and .version == $version
              and .platforms == "linux/amd64,linux/arm64"
              and (.backend_digest | test("^sha256:[0-9a-f]{64}$"))
              and (.frontend_digest | test("^sha256:[0-9a-f]{64}$"))' \
            "$IMAGE_DIGESTS" >/dev/null
          backend_tag="$(jq -er '.backend_image' "$IMAGE_DIGESTS")"
          frontend_tag="$(jq -er '.frontend_image' "$IMAGE_DIGESTS")"
          backend_digest="$(jq -er '.backend_digest' "$IMAGE_DIGESTS")"
          frontend_digest="$(jq -er '.frontend_digest' "$IMAGE_DIGESTS")"
          [[ "$backend_tag" == *":$RELEASE_TAG" ]]
          [[ "$frontend_tag" == *":$RELEASE_TAG" ]]
          backend_repository="${backend_tag%:*}"
          frontend_repository="${frontend_tag%:*}"
          backend_reference="$backend_repository@$backend_digest"
          frontend_reference="$frontend_repository@$frontend_digest"
          [[ "$(oras resolve "$backend_tag")" == "$backend_digest" ]]
          [[ "$(oras resolve "$frontend_tag")" == "$frontend_digest" ]]

          image_identity="^$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/docker-images(-reusable)?\\.yml@refs/tags/$RELEASE_TAG$"
          for subject in "$backend_reference" "$frontend_reference"; do
            cosign verify \
              --certificate-identity-regexp "$image_identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$subject" >/dev/null
            manifest="$(docker buildx imagetools inspect "$subject")"
            grep -Fq 'linux/amd64' <<<"$manifest"
            grep -Fq 'linux/arm64' <<<"$manifest"
          done
          {
            echo "BACKEND_REFERENCE=$backend_reference"
            echo "FRONTEND_REFERENCE=$frontend_reference"
            echo "APPLICATION_IMAGE_DIGESTS=$IMAGE_DIGESTS"
          } >> "$GITHUB_ENV"

      - name: Build and publish the signed OSS distribution assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RECEIPT="$RUNNER_TEMP/enterpriseglue-plugin-toolchain-receipt"
          DISTRIBUTION="$RUNNER_TEMP/enterpriseglue-distribution"
          STATIC_ROOT="$RUNNER_TEMP/frontend-static"
          KIT_ROOT="$RUNNER_TEMP/plugin-compose-deployment-kit"
          VERSION="${RELEASE_TAG#v}"
          STATIC_ARCHIVE="$DISTRIBUTION/enterpriseglue-frontend-static-$RELEASE_TAG.tar.gz"
          KIT_ARCHIVE="$DISTRIBUTION/enterpriseglue-plugin-deployment-kit-$RELEASE_TAG.tar.gz"
          AIRGAP_ARCHIVE="$DISTRIBUTION/enterpriseglue-plugin-toolchain-airgap-$RELEASE_TAG.tar.gz"
          LOCK="$DISTRIBUTION/enterpriseglue-distribution-lock-$RELEASE_TAG.json"
          LOCK_BUNDLE="$DISTRIBUTION/enterpriseglue-distribution-lock-$RELEASE_TAG.sigstore.json"
          TOOLCHAIN_RECEIPT="$DISTRIBUTION/enterpriseglue-plugin-toolchain-$RELEASE_TAG.json"
          TRUSTED_ROOT="$RUNNER_TEMP/sigstore-trusted-root.json"
          CERTIFICATE_IDENTITY="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/plugin-toolchain-release.yml@$GITHUB_REF"
          mkdir -p "$DISTRIBUTION" "$STATIC_ROOT" "$KIT_ROOT"

          frontend_container="$(docker create --platform linux/amd64 "$FRONTEND_REFERENCE")"
          cleanup_frontend_container() {
            docker rm -f "$frontend_container" >/dev/null 2>&1 || true
          }
          trap cleanup_frontend_container EXIT INT TERM
          docker cp "$frontend_container:/usr/share/nginx/html/." "$STATIC_ROOT/"
          cleanup_frontend_container
          trap - EXIT INT TERM
          test -f "$STATIC_ROOT/index.html"
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" \
            --owner=0 --group=0 --numeric-owner -cf - -C "$STATIC_ROOT" . |
            gzip -n > "$STATIC_ARCHIVE"

          node scripts/build-plugin-compose-deployment-kit.mjs \
            --output "$KIT_ROOT" \
            --host-version "$VERSION" \
            --backend-image "$BACKEND_REFERENCE" \
            --frontend-image "$FRONTEND_REFERENCE" \
            --manager-image "$MANAGER_REFERENCE"
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" \
            --owner=0 --group=0 --numeric-owner -cf - -C "$KIT_ROOT" . |
            gzip -n > "$KIT_ARCHIVE"

          cp "$RECEIPT/release.json" "$TOOLCHAIN_RECEIPT"
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" \
            --owner=0 --group=0 --numeric-owner -cf - \
            -C "$RECEIPT/toolchain-airgap" . |
            gzip -n > "$AIRGAP_ARCHIVE"

          EG_DISTRIBUTION_GENERATED_AT="$(
            date -u -d "@$SOURCE_DATE_EPOCH" '+%Y-%m-%dT%H:%M:%SZ'
          )" node scripts/enterpriseglue-distribution-lock.mjs create \
            --version "$VERSION" \
            --source-revision "$SOURCE_REF" \
            --backend "$BACKEND_REFERENCE" \
            --frontend "$FRONTEND_REFERENCE" \
            --toolchain-release "$RECEIPT/release.json" \
            --frontend-static "$STATIC_ARCHIVE" \
            --deployment-kit "$KIT_ARCHIVE" \
            --output "$LOCK"
          node scripts/enterpriseglue-distribution-lock.mjs verify \
            --lock "$LOCK" \
            --root "$DISTRIBUTION"
          cosign sign-blob --yes \
            --bundle "$LOCK_BUNDLE" \
            "$LOCK" >/dev/null
          cosign trusted-root create \
            --with-default-services \
            --out "$TRUSTED_ROOT"
          cosign verify-blob \
            --bundle "$LOCK_BUNDLE" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --trusted-root "$TRUSTED_ROOT" \
            "$LOCK" >/dev/null

          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "$LOCK" \
            "$LOCK_BUNDLE" \
            "$STATIC_ARCHIVE" \
            "$KIT_ARCHIVE" \
            "$TOOLCHAIN_RECEIPT" \
            "$AIRGAP_ARCHIVE"

      - name: Retain the non-secret toolchain receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enterpriseglue-plugin-toolchain-${{ steps.version.outputs.version }}-${{ inputs.source_ref }}
          path: ${{ runner.temp }}/enterpriseglue-plugin-toolchain-receipt
          if-no-files-found: error
          retention-days: 90
