name: Engine Tenancy Database Qualification

on:
  pull_request:
    paths:
      - ".github/workflows/engine-tenancy-database.yml"
      - "backend/test/integration/engine-tenancy-database-qualification.mjs"
      - "backend/__tests__/shared/db/**"
      - "backend/scripts/check-no-raw-sql.ts"
      - "packages/backend-host/src/server.ts"
      - "packages/shared/src/db/**"
      - "packages/shared/src/infrastructure/persistence/adapters/**"
      - "packages/shared/src/infrastructure/persistence/entities/**"
      - "packages/shared/src/infrastructure/persistence/migrations/**"
      - "packages/shared/src/infrastructure/persistence/transformers/**"
      - "scripts/engine-tenancy-database-matrix.test.mjs"
      - "scripts/run-engine-tenancy-database-matrix.mjs"
      - "scripts/engine-tenancy-evidence.test.mjs"
      - "test/database/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/engine-tenancy-database.yml"
      - "backend/test/integration/engine-tenancy-database-qualification.mjs"
      - "backend/__tests__/shared/db/**"
      - "backend/scripts/check-no-raw-sql.ts"
      - "packages/backend-host/src/server.ts"
      - "packages/shared/src/db/**"
      - "packages/shared/src/infrastructure/persistence/adapters/**"
      - "packages/shared/src/infrastructure/persistence/entities/**"
      - "packages/shared/src/infrastructure/persistence/migrations/**"
      - "packages/shared/src/infrastructure/persistence/transformers/**"
      - "scripts/engine-tenancy-database-matrix.test.mjs"
      - "scripts/run-engine-tenancy-database-matrix.mjs"
      - "test/database/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  schedule:
    - cron: "45 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-tenancy-database-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-notes-preflight:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/release-notes-preflight-reusable.yml
    with:
      base_ref: ${{ github.base_ref || 'main' }}
      pull_number: ${{ github.event.pull_request.number || 0 }}

  database-matrix:
    name: Five-adapter migration and runtime portability
    runs-on: ubuntu-latest
    needs: release-notes-preflight
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.0.8

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Run portability guards, migration tests, and database qualification
        run: pnpm run test:engine-tenancy:database-matrix

      - name: Upload database evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-tenancy-database-${{ github.run_id }}
          path: |
            test/results/engine-tenancy-release/database-matrix.json
            test/results/engine-tenancy-release/database-observations
          if-no-files-found: warn
          retention-days: 14

      - name: Remove qualification containers
        if: always()
        continue-on-error: true
        run: |
          docker rm -f -v \
            eg-engine-tenancy-dbq-postgres \
            eg-engine-tenancy-dbq-mysql \
            eg-engine-tenancy-dbq-mssql \
            eg-engine-tenancy-dbq-oracle \
            eg-engine-tenancy-dbq-spanner
