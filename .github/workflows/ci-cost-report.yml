name: CI and Release Observability

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  rolling-ci-release-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reporting code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build rolling CI and release report (last 7 days)
        id: report
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const { pathToFileURL } = require('node:url');
            const reportModule = await import(pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/ci-observability.mjs`,
            ).href);

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const daysBack = 7;
            const since = new Date(Date.now() - daysBack * 24 * 60 * 60 * 1000);
            const allRuns = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              status: 'completed',
              created: `>=${since.toISOString()}`,
              per_page: 100,
            });
            const recentRuns = allRuns
              .filter((run) => Date.parse(run.created_at) >= since.getTime())
              .slice(0, 200);

            const jobsByRun = new Map();
            for (const run of recentRuns.slice(0, 120)) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner,
                repo,
                run_id: run.id,
                filter: 'all',
                per_page: 100,
              });
              jobsByRun.set(run.id, jobs);
            }

            const report = reportModule.buildCiObservabilityReport({
              runs: recentRuns,
              jobsByRun,
              daysBack,
            });
            const slo = reportModule.evaluateCiSlo(report);
            report.slo = slo;
            const markdown = reportModule.renderCiObservabilityMarkdown(report);

            fs.writeFileSync('ci-release-observability.json', `${JSON.stringify(report, null, 2)}\n`);
            fs.writeFileSync('ci-release-observability.md', `${markdown}\n`);
            await core.summary.addRaw(markdown).write();
            core.setOutput('slo_status', slo.status);
            core.setOutput('slo_body', slo.breaches.map((breach) => `- **${breach.code}**: ${breach.message}`).join('\n'));
            for (const breach of slo.breaches) core.warning(breach.message);

      - name: Open or refresh the release SLO alert
        if: steps.report.outputs.slo_status == 'breached'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SLO_BODY: ${{ steps.report.outputs.slo_body }}
        with:
          script: |
            const title = '[CI SLO] Release pipeline threshold breach';
            const body = [
              'The rolling seven-day EnterpriseGlue CI/release report detected:',
              '',
              process.env.SLO_BODY,
              '',
              `Evidence: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'This issue is maintained by the scheduled observability workflow.',
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }

      - name: Close a recovered release SLO alert
        if: steps.report.outputs.slo_status == 'met'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = '[CI SLO] Release pipeline threshold breach';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            for (const issue of issues.filter((candidate) => !candidate.pull_request && candidate.title === title)) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

      - name: Upload CI and release observability artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-release-observability
          path: |
            ci-release-observability.json
            ci-release-observability.md
          if-no-files-found: error
          retention-days: 30
