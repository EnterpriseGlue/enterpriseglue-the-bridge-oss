name: CI and Release Observability

on:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  weekly-ci-release-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reporting code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build weekly CI and release report (last 7 days)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const { pathToFileURL } = require('node:url');
            const reportModule = await import(pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/ci-observability.mjs`,
            ).href);

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const daysBack = 7;
            const since = new Date(Date.now() - daysBack * 24 * 60 * 60 * 1000);
            const allRuns = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              status: 'completed',
              created: `>=${since.toISOString()}`,
              per_page: 100,
            });
            const recentRuns = allRuns
              .filter((run) => Date.parse(run.created_at) >= since.getTime())
              .slice(0, 200);

            const jobsByRun = new Map();
            for (const run of recentRuns.slice(0, 120)) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner,
                repo,
                run_id: run.id,
                filter: 'all',
                per_page: 100,
              });
              jobsByRun.set(run.id, jobs);
            }

            const report = reportModule.buildCiObservabilityReport({
              runs: recentRuns,
              jobsByRun,
              daysBack,
            });
            const markdown = reportModule.renderCiObservabilityMarkdown(report);

            fs.writeFileSync('ci-release-observability.json', `${JSON.stringify(report, null, 2)}\n`);
            fs.writeFileSync('ci-release-observability.md', `${markdown}\n`);
            await core.summary.addRaw(markdown).write();

      - name: Upload CI and release observability artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-release-observability
          path: |
            ci-release-observability.json
            ci-release-observability.md
          if-no-files-found: error
          retention-days: 30
