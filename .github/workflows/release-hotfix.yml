name: Hotfix Release

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why are we triggering a hotfix release now?
        required: true
        type: string
      release_as:
        description: Optional explicit version (without v prefix, e.g. 0.4.5). Leave empty for automatic bump.
        required: false
        type: string
      enable_release_pr_automerge:
        description: Enable auto-merge on the generated Release Please PR.
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: hotfix-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trigger-hotfix-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full release history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Validate release baseline
        run: node scripts/release-notes.mjs baseline

      - name: Validate forced hotfix version
        if: ${{ inputs.release_as != '' }}
        env:
          RELEASE_VERSION: ${{ inputs.release_as }}
        run: |
          set -euo pipefail
          base_tag="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
          node scripts/release-notes.mjs assert-version --base-ref "$base_tag" --version "$RELEASE_VERSION"

      - name: Run Release Please (automatic bump)
        id: release_auto
        if: ${{ inputs.release_as == '' }}
        uses: googleapis/release-please-action@c3fc4de07084f75a2b61a5b933069bda6edf3d5c # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      - name: Run Release Please (forced release-as)
        id: release_forced
        if: ${{ inputs.release_as != '' }}
        uses: googleapis/release-please-action@c3fc4de07084f75a2b61a5b933069bda6edf3d5c # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          release-as: ${{ inputs.release_as }}

      - name: Resolve release outputs
        id: resolve
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PRS_JSON: ${{ steps.release_auto.outputs.prs || steps.release_forced.outputs.prs || '[]' }}
          PR_JSON: ${{ steps.release_auto.outputs.pr || steps.release_forced.outputs.pr || '{}' }}
          PRS_CREATED: ${{ steps.release_auto.outputs.prs_created || steps.release_forced.outputs.prs_created || 'false' }}
          RELEASES_CREATED: ${{ steps.release_auto.outputs.releases_created || steps.release_forced.outputs.releases_created || 'false' }}
        with:
          github-token: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && secrets.RELEASE_PLEASE_TOKEN || github.token }}
          script: |
            const parseJson = (value, fallback) => {
              try {
                return JSON.parse(value);
              } catch {
                return fallback;
              }
            };

            const prs = parseJson(process.env.PRS_JSON || '[]', []);
            const pr = parseJson(process.env.PR_JSON || '{}', {});

            const releasesCreated = String(process.env.RELEASES_CREATED) === 'true';
            let pullNumber = '';
            if (!releasesCreated && Array.isArray(prs) && prs.length > 0) {
              const first = prs[0] || {};
              pullNumber = String(first.number || first.pullRequestNumber || '');
            }
            if (!releasesCreated && !pullNumber) {
              pullNumber = String(pr.number || pr.pullRequestNumber || '');
            }

            if (pullNumber) {
              const { data: pull } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(pullNumber),
              });
              const version = String(pull.title || '').match(/release (\d+\.\d+\.\d+)\b/i)?.[1] || '';
              const headRef = String(pull.head?.ref || '');
              if (!version || !headRef.startsWith('release-please--branches--')) {
                core.setFailed(`Could not resolve a safe version/ref for release PR #${pullNumber}.`);
                return;
              }
              core.setOutput('head_ref', headRef);
              core.setOutput('pr_version', version);
            }

            core.setOutput('pull_number', pullNumber);
            core.setOutput('prs_created', String(process.env.PRS_CREATED || 'false'));
            core.setOutput('releases_created', String(process.env.RELEASES_CREATED || 'false'));

      - name: Prepare detailed hotfix release notes
        if: steps.resolve.outputs.pull_number != ''
        env:
          CI: "true"
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && secrets.RELEASE_PLEASE_TOKEN || github.token }}
          RELEASE_PR_NUMBER: ${{ steps.resolve.outputs.pull_number }}
          RELEASE_PR_HEAD_REF: ${{ steps.resolve.outputs.head_ref }}
          RELEASE_VERSION: ${{ steps.resolve.outputs.pr_version }}
        run: bash scripts/prepare-release-notes-pr.sh

      - name: Enable auto-merge on generated release PR
        if: ${{ inputs.enable_release_pr_automerge && steps.resolve.outputs.pull_number != '' }}
        uses: peter-evans/enable-pull-request-automerge@a660677d5469627102a1c1e11409dd063606628d # v3
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && secrets.RELEASE_PLEASE_TOKEN || github.token }}
          pull-request-number: ${{ steps.resolve.outputs.pull_number }}
          merge-method: merge

      - name: Publish hotfix summary
        run: |
          echo "hotfix_reason=${{ inputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          echo "release_as=${{ inputs.release_as || 'auto' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "prs_created=${{ steps.resolve.outputs.prs_created }}" >> "$GITHUB_STEP_SUMMARY"
          echo "releases_created=${{ steps.resolve.outputs.releases_created }}" >> "$GITHUB_STEP_SUMMARY"
          echo "release_pr_number=${{ steps.resolve.outputs.pull_number || 'none' }}" >> "$GITHUB_STEP_SUMMARY"
