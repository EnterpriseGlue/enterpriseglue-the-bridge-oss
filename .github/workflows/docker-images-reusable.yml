name: Docker Images (Reusable)

on:
  workflow_call:
    inputs:
      backend_image:
        required: true
        type: string
      frontend_image:
        required: true
        type: string
      dockerhub_namespace:
        required: false
        type: string
      image_tag:
        required: true
        type: string
      image_version:
        description: OCI version label and host compatibility version; defaults to image_tag
        required: false
        type: string
        default: ''
      source_ref:
        description: Exact source revision checked out and recorded in OCI provenance; defaults to the caller SHA
        required: false
        type: string
        default: ''
      image_platforms:
        required: false
        type: string
        default: linux/amd64,linux/arm64
      security_rebuild:
        required: false
        type: boolean
        default: false
      enable_dockerhub:
        required: false
        type: boolean
        default: false
    outputs:
      backend_image:
        value: ${{ jobs.publish.outputs.backend_image }}
      frontend_image:
        value: ${{ jobs.publish.outputs.frontend_image }}
      image_tag:
        value: ${{ jobs.publish.outputs.image_tag }}
      publish_latest:
        value: ${{ jobs.publish.outputs.publish_latest }}
      publish_dockerhub:
        value: ${{ jobs.publish.outputs.publish_dockerhub }}
      image_platforms:
        value: ${{ jobs.publish.outputs.image_platforms }}
      backend_digest:
        value: ${{ jobs.publish.outputs.backend_digest }}
      frontend_digest:
        value: ${{ jobs.publish.outputs.frontend_digest }}
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  prepare:
    name: Resolve immutable image build metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_version: ${{ steps.meta.outputs.image_version }}
      source_revision: ${{ steps.meta.outputs.source_revision }}
      host_version: ${{ steps.meta.outputs.host_version }}
      publish_latest: ${{ steps.meta.outputs.publish_latest }}
      publish_dockerhub: ${{ steps.meta.outputs.publish_dockerhub }}
      image_platforms: ${{ steps.meta.outputs.image_platforms }}
      dockerhub_backend: ${{ steps.meta.outputs.dockerhub_backend }}
      dockerhub_frontend: ${{ steps.meta.outputs.dockerhub_frontend }}
      backend_temp_tag: ${{ steps.meta.outputs.backend_temp_tag }}
      frontend_temp_tag: ${{ steps.meta.outputs.frontend_temp_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Resolve image names and tags
        id: meta
        shell: bash
        env:
          INPUT_BACKEND_IMAGE: ${{ inputs.backend_image }}
          INPUT_FRONTEND_IMAGE: ${{ inputs.frontend_image }}
          INPUT_DOCKERHUB_NAMESPACE: ${{ inputs.dockerhub_namespace }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_IMAGE_VERSION: ${{ inputs.image_version }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          INPUT_IMAGE_PLATFORMS: ${{ inputs.image_platforms }}
          ENABLE_DOCKERHUB: ${{ inputs.enable_dockerhub }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail

          backend_image="$INPUT_BACKEND_IMAGE"
          frontend_image="$INPUT_FRONTEND_IMAGE"
          dockerhub_namespace="${INPUT_DOCKERHUB_NAMESPACE:-}"
          dockerhub_backend=""
          dockerhub_frontend=""
          if [[ -n "$dockerhub_namespace" ]]; then
            dockerhub_backend="docker.io/${dockerhub_namespace}/enterpriseglue-the-bridge-oss-backend"
            dockerhub_frontend="docker.io/${dockerhub_namespace}/enterpriseglue-the-bridge-oss-frontend"
          fi

          image_platforms="${INPUT_IMAGE_PLATFORMS:-linux/amd64,linux/arm64}"
          [[ "$image_platforms" == "linux/amd64,linux/arm64" ]] || {
            echo "image_platforms must be exactly linux/amd64,linux/arm64; the release matrix qualifies both architectures" >&2
            exit 1
          }
          image_tag="$INPUT_IMAGE_TAG"
          image_version="${INPUT_IMAGE_VERSION:-$image_tag}"
          source_revision="${INPUT_SOURCE_REF:-$GITHUB_SHA}"
          [[ "$source_revision" =~ ^[0-9a-f]{40}$ ]] || {
            echo "source_ref must resolve to an immutable 40-character commit" >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$source_revision" ]] || {
            echo "Checked-out source does not match the requested immutable revision" >&2
            exit 1
          }

          default_host_version="$(sed -n "s/^[[:space:]]*hostVersion: '\([^']*\)',/\1/p" packages/plugin-sdk/src/platform.ts | head -n 1)"
          [[ "$default_host_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Could not resolve the checked-in plugin host release identity." >&2
            exit 1
          }
          host_version="$default_host_version"
          publish_latest=false
          if [[ "$image_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then host_version="${image_version#v}"; fi
          if [[ "$image_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then publish_latest=true; fi

          publish_dockerhub=false
          if [[ "$ENABLE_DOCKERHUB" == true && -n "${DOCKERHUB_USERNAME:-}" && -n "$dockerhub_namespace" && "$publish_latest" == true ]]; then
            publish_dockerhub=true
          fi

          {
            echo "backend_image=$backend_image"
            echo "frontend_image=$frontend_image"
            echo "image_tag=$image_tag"
            echo "image_version=$image_version"
            echo "source_revision=$source_revision"
            echo "host_version=$host_version"
            echo "publish_latest=$publish_latest"
            echo "publish_dockerhub=$publish_dockerhub"
            echo "image_platforms=$image_platforms"
            echo "dockerhub_backend=$dockerhub_backend"
            echo "dockerhub_frontend=$dockerhub_frontend"
            echo "backend_temp_tag=tmp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-backend"
            echo "frontend_temp_tag=tmp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-frontend"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.component }} ${{ matrix.platform }} application image
    needs: prepare
    runs-on: ubuntu-latest
    # Setup plus two isolated 60-minute build attempts. Keep the enclosing
    # budget larger than both retry windows so a timed-out first attempt does
    # not make the declared retry impossible.
    timeout-minutes: 130
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            platform: linux/amd64
            platform_id: linux-amd64
          - component: backend
            platform: linux/arm64
            platform_id: linux-arm64
          - component: frontend
            platform: linux/amd64
            platform_id: linux-amd64
          - component: frontend
            platform: linux/arm64
            platform_id: linux-arm64
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_revision }}
          persist-credentials: false

      - name: Verify exact image source checkout
        run: test "$(git rev-parse HEAD)" = "${{ needs.prepare.outputs.source_revision }}"

      - name: Set up QEMU fallback for cross-platform builds
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Set up Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3.10.1
        with:
          cosign-release: v3.1.3

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select component build contract
        id: component
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          BACKEND_IMAGE: ${{ needs.prepare.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.prepare.outputs.frontend_image }}
          BACKEND_TEMP_TAG: ${{ needs.prepare.outputs.backend_temp_tag }}
          FRONTEND_TEMP_TAG: ${{ needs.prepare.outputs.frontend_temp_tag }}
          HOST_VERSION: ${{ needs.prepare.outputs.host_version }}
          PLATFORM_ID: ${{ matrix.platform_id }}
        run: |
          set -euo pipefail
          if [[ "$COMPONENT" == backend ]]; then
            image="$BACKEND_IMAGE"
            temp_tag="${BACKEND_TEMP_TAG}-${PLATFORM_ID}"
            file=backend/Dockerfile.prod
            build_args="ENTERPRISEGLUE_HOST_VERSION=$HOST_VERSION"
          else
            image="$FRONTEND_IMAGE"
            temp_tag="${FRONTEND_TEMP_TAG}-${PLATFORM_ID}"
            file=frontend/Dockerfile.prod
            build_args='API_BASE_URL='
          fi
          {
            echo "image=$image"
            echo "temp_tag=$temp_tag"
            echo "file=$file"
            echo "build_args=$build_args"
            echo "cache_ref=${image}:buildcache-${COMPONENT}-${PLATFORM_ID}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.component }} image (attempt 1)
        id: build_try1
        continue-on-error: true
        timeout-minutes: 60
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ${{ steps.component.outputs.file }}
          platforms: ${{ matrix.platform }}
          pull: true
          no-cache: ${{ inputs.security_rebuild }}
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=registry,ref=${{ steps.component.outputs.cache_ref }}
          cache-to: type=registry,ref=${{ steps.component.outputs.cache_ref }},mode=max,oci-mediatypes=true,image-manifest=true
          build-args: ${{ steps.component.outputs.build_args }}
          tags: ${{ steps.component.outputs.image }}:${{ steps.component.outputs.temp_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.source_revision }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.image_version }}

      - name: Build and push ${{ matrix.component }} image (attempt 2 after transient failure)
        id: build_try2
        if: steps.build_try1.outcome == 'failure'
        timeout-minutes: 60
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ${{ steps.component.outputs.file }}
          platforms: ${{ matrix.platform }}
          pull: true
          no-cache: ${{ inputs.security_rebuild }}
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=registry,ref=${{ steps.component.outputs.cache_ref }}
          cache-to: type=registry,ref=${{ steps.component.outputs.cache_ref }},mode=max,oci-mediatypes=true,image-manifest=true
          build-args: ${{ steps.component.outputs.build_args }}
          tags: ${{ steps.component.outputs.image }}:${{ steps.component.outputs.temp_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.source_revision }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.image_version }}

      - name: Capture immutable component digest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.build_try1.outcome }}" == success ]]; then
            digest="${{ steps.build_try1.outputs.digest }}"
            attempt=1
          else
            digest="${{ steps.build_try2.outputs.digest }}"
            attempt=2
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"

      - name: Verify backend runtime contract for every supported database adapter
        if: matrix.component == 'backend' && matrix.platform_id == 'linux-amd64'
        shell: bash
        env:
          BACKEND_REF: ${{ steps.component.outputs.image }}:${{ steps.component.outputs.temp_tag }}
          HOST_VERSION: ${{ needs.prepare.outputs.host_version }}
        run: |
          set -euo pipefail
          common_env=(
            -e API_PORT=8787
            -e JWT_SECRET=runtime_contract_test_secret_with_32_chars
            -e ADMIN_PASSWORD=runtime_contract_test_password
            -e ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
            -e FRONTEND_URL=http://localhost:8080
          )
          verify_adapter() {
            local database_type="$1"
            shift
            docker run --rm --entrypoint '' "${common_env[@]}" -e "DATABASE_TYPE=$database_type" "$@" "$BACKEND_REF" \
              node --input-type=module -e "import fs from 'fs'; const candidates=['./dist/shared/db/adapters/index.js','./dist/src/shared/db/adapters/index.js','./dist/packages/shared/src/db/adapters/index.js']; const adapterPath=candidates.find(p=>fs.existsSync(p)); if(!adapterPath){console.error('No adapters/index.js found');process.exit(1)} const { createAdapter } = await import(adapterPath); const adapter=createAdapter('$database_type'); const options=adapter.getDataSourceOptions(); if(options.type!=='$database_type'){process.exit(1)} console.log('$database_type runtime contract ok');"
          }
          verify_adapter postgres -e POSTGRES_HOST=db -e POSTGRES_PORT=5432 -e POSTGRES_USER=enterpriseglue -e POSTGRES_PASSWORD=enterpriseglue -e POSTGRES_DATABASE=enterpriseglue -e POSTGRES_SCHEMA=main
          verify_adapter oracle -e ORACLE_HOST=db -e ORACLE_PORT=1521 -e ORACLE_USER=enterpriseglue -e ORACLE_PASSWORD=oracle -e ORACLE_SERVICE_NAME=XEPDB1 -e ORACLE_SCHEMA=ENTERPRISEGLUE
          verify_adapter mysql -e MYSQL_HOST=db -e MYSQL_PORT=3306 -e MYSQL_USER=enterpriseglue -e MYSQL_PASSWORD=enterpriseglue -e MYSQL_DATABASE=enterpriseglue
          verify_adapter mssql -e MSSQL_HOST=db -e MSSQL_PORT=1433 -e MSSQL_USER=sa -e MSSQL_PASSWORD='Str0ngPassword!_123' -e MSSQL_DATABASE=master -e MSSQL_SCHEMA=dbo -e MSSQL_ENCRYPT=false -e MSSQL_TRUST_SERVER_CERTIFICATE=true
          verify_adapter spanner -e SPANNER_PROJECT_ID=test-project -e SPANNER_INSTANCE_ID=test-instance -e SPANNER_DATABASE_ID=test-database
          docker run --rm --entrypoint '' "${common_env[@]}" "$BACKEND_REF" \
            node --input-type=module -e "import fs from 'fs'; const paths=['/usr/bin/npm','/usr/bin/npx','/usr/lib/node_modules/npm']; const found=paths.filter((p)=>fs.existsSync(p)); const db=fs.existsSync('/lib/apk/db/installed') ? fs.readFileSync('/lib/apk/db/installed','utf8') : ''; const npmPackages=[...db.matchAll(/^P:(npm(?:-[0-9]+)?)$/gm)].map((match)=>match[1]); if(found.length || npmPackages.length){console.error('npm must not be present in final backend image',{found,npmPackages});process.exit(1)} if(process.env.ENTERPRISEGLUE_HOST_VERSION !== '$HOST_VERSION'){console.error('plugin host version does not match immutable image version');process.exit(1)} console.log('backend runtime contract ok');"

      - name: Verify temporary image reference
        run: docker buildx imagetools inspect "${{ steps.component.outputs.image }}:${{ steps.component.outputs.temp_tag }}" >/dev/null

      - name: Sign immutable application image
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: >-
          cosign sign --yes --registry-referrers-mode=oci-1-1
          "${{ steps.component.outputs.image }}@${{ steps.digest.outputs.digest }}"

      - name: Attest application image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.2.0
        with:
          subject-name: ${{ steps.component.outputs.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Record component build receipt
        env:
          COMPONENT: ${{ matrix.component }}
          PLATFORM: ${{ matrix.platform }}
          PLATFORM_ID: ${{ matrix.platform_id }}
          IMAGE: ${{ steps.component.outputs.image }}
          TEMP_TAG: ${{ steps.component.outputs.temp_tag }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          ATTEMPT: ${{ steps.digest.outputs.attempt }}
          CACHE_REF: ${{ steps.component.outputs.cache_ref }}
        run: |
          jq -n \
            --arg component "$COMPONENT" \
            --arg platform "$PLATFORM" \
            --arg platformId "$PLATFORM_ID" \
            --arg image "$IMAGE" \
            --arg tempTag "$TEMP_TAG" \
            --arg digest "$DIGEST" \
            --argjson attempt "$ATTEMPT" \
            --arg cacheRef "$CACHE_REF" \
            '{schemaVersion:1, component:$component, platform:$platform, platformId:$platformId, image:$image, tempTag:$tempTag, digest:$digest, attempt:$attempt, cacheRef:$cacheRef}' \
            > "${COMPONENT}-${PLATFORM_ID}-image-build.json"

      - name: Upload component build receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-image-build-${{ matrix.component }}-${{ matrix.platform_id }}-${{ github.run_id }}
          path: ${{ matrix.component }}-${{ matrix.platform_id }}-image-build.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Promote and verify application image manifests
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      backend_image: ${{ needs.prepare.outputs.backend_image }}
      frontend_image: ${{ needs.prepare.outputs.frontend_image }}
      image_tag: ${{ needs.prepare.outputs.image_tag }}
      publish_latest: ${{ needs.prepare.outputs.publish_latest }}
      publish_dockerhub: ${{ needs.prepare.outputs.publish_dockerhub }}
      image_platforms: ${{ needs.prepare.outputs.image_platforms }}
      backend_digest: ${{ steps.digests.outputs.backend_digest }}
      frontend_digest: ${{ steps.digests.outputs.frontend_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_revision }}
          persist-credentials: false

      - name: Verify exact manifest source checkout
        run: test "$(git rev-parse HEAD)" = "${{ needs.prepare.outputs.source_revision }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Set up Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3.10.1
        with:
          cosign-release: v3.1.3

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: needs.prepare.outputs.publish_dockerhub == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download exact component build receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: application-image-build-*-${{ github.run_id }}
          path: ${{ runner.temp }}/application-image-builds
          merge-multiple: true

      - name: Assemble and expose exact multi-platform build digests
        id: digests
        shell: bash
        env:
          RECEIPT_DIRECTORY: ${{ runner.temp }}/application-image-builds
          BACKEND_IMAGE: ${{ needs.prepare.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.prepare.outputs.frontend_image }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
        run: |
          set -euo pipefail
          for component in backend frontend; do
            if [[ "$component" == backend ]]; then image="$BACKEND_IMAGE"; else image="$FRONTEND_IMAGE"; fi
            sources=()
            for platform_id in linux-amd64 linux-arm64; do
              receipt="$RECEIPT_DIRECTORY/${component}-${platform_id}-image-build.json"
              jq -e \
                --arg component "$component" \
                --arg platformId "$platform_id" \
                --arg image "$image" \
                '.component == $component and .platformId == $platformId and .image == $image and (.digest | test("^sha256:[0-9a-f]{64}$"))' \
                "$receipt" >/dev/null
              sources+=("$image@$(jq -r .digest "$receipt")")
            done
            docker buildx imagetools create -t "$image:$IMAGE_TAG" "${sources[@]}"
            digest="$(oras resolve "$image:$IMAGE_TAG")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "${component}_digest=$digest" >> "$GITHUB_OUTPUT"
          done

      - name: Sign assembled application image manifests
        env:
          COSIGN_EXPERIMENTAL: '1'
          BACKEND_IMAGE: ${{ needs.prepare.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.prepare.outputs.frontend_image }}
          BACKEND_DIGEST: ${{ steps.digests.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ steps.digests.outputs.frontend_digest }}
        run: |
          cosign sign --yes --registry-referrers-mode=oci-1-1 "$BACKEND_IMAGE@$BACKEND_DIGEST"
          cosign sign --yes --registry-referrers-mode=oci-1-1 "$FRONTEND_IMAGE@$FRONTEND_DIGEST"

      - name: Attest assembled backend image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.2.0
        with:
          subject-name: ${{ needs.prepare.outputs.backend_image }}
          subject-digest: ${{ steps.digests.outputs.backend_digest }}
          push-to-registry: true

      - name: Attest assembled frontend image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.2.0
        with:
          subject-name: ${{ needs.prepare.outputs.frontend_image }}
          subject-digest: ${{ steps.digests.outputs.frontend_digest }}
          push-to-registry: true

      - name: Promote latest tags
        if: needs.prepare.outputs.publish_latest == 'true'
        env:
          BACKEND_IMAGE: ${{ needs.prepare.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.prepare.outputs.frontend_image }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
        run: |
          docker buildx imagetools create -t "$BACKEND_IMAGE:latest" "$BACKEND_IMAGE:$IMAGE_TAG"
          docker buildx imagetools create -t "$FRONTEND_IMAGE:latest" "$FRONTEND_IMAGE:$IMAGE_TAG"

      - name: Publish version and latest tags on Docker Hub
        if: needs.prepare.outputs.publish_dockerhub == 'true'
        env:
          BACKEND_IMAGE: ${{ needs.prepare.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.prepare.outputs.frontend_image }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          DOCKERHUB_BACKEND: ${{ needs.prepare.outputs.dockerhub_backend }}
          DOCKERHUB_FRONTEND: ${{ needs.prepare.outputs.dockerhub_frontend }}
          PUBLISH_LATEST: ${{ needs.prepare.outputs.publish_latest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "$DOCKERHUB_BACKEND:$IMAGE_TAG" "$BACKEND_IMAGE:$IMAGE_TAG"
          docker buildx imagetools create -t "$DOCKERHUB_FRONTEND:$IMAGE_TAG" "$FRONTEND_IMAGE:$IMAGE_TAG"
          if [[ "$PUBLISH_LATEST" == true ]]; then
            docker buildx imagetools create -t "$DOCKERHUB_BACKEND:latest" "$BACKEND_IMAGE:$IMAGE_TAG"
            docker buildx imagetools create -t "$DOCKERHUB_FRONTEND:latest" "$FRONTEND_IMAGE:$IMAGE_TAG"
          fi

      - name: Verify published image provenance and platform coverage
        shell: bash
        env:
          EXPECTED_PLATFORMS: ${{ needs.prepare.outputs.image_platforms }}
          EXPECTED_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          EXPECTED_REVISION: ${{ needs.prepare.outputs.source_revision }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.image_version }}
          BACKEND_REF: ${{ needs.prepare.outputs.backend_image }}:${{ needs.prepare.outputs.image_tag }}
          FRONTEND_REF: ${{ needs.prepare.outputs.frontend_image }}:${{ needs.prepare.outputs.image_tag }}
          BACKEND_DIGEST: ${{ steps.digests.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ steps.digests.outputs.frontend_digest }}
        run: |
          set -euo pipefail
          for entry in "backend=$BACKEND_REF@$BACKEND_DIGEST" "frontend=$FRONTEND_REF@$FRONTEND_DIGEST"; do
            prefix="${entry%%=*}"
            tagged_and_digest="${entry#*=}"
            ref="${tagged_and_digest%@*}"
            expected_digest="${tagged_and_digest##*@}"
            actual_digest="$(oras resolve "$ref")"
            [[ "$actual_digest" == "$expected_digest" ]] || {
              echo "$ref resolved to $actual_digest instead of the qualified $expected_digest" >&2
              exit 1
            }
            manifest="$(docker buildx imagetools inspect "$ref")"
            docker buildx imagetools inspect "$ref" --format '{{json .}}' \
              | node scripts/verify-oci-image-metadata.mjs "$prefix" >/dev/null
            IFS=',' read -ra platforms <<< "$EXPECTED_PLATFORMS"
            for platform in "${platforms[@]}"; do
              grep -Fq "$platform" <<< "$manifest" || {
                echo "$ref is missing $platform" >&2
                exit 1
              }
            done
          done

      - name: Capture image digest metadata
        env:
          BACKEND_IMAGE: ${{ needs.prepare.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.prepare.outputs.frontend_image }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          BACKEND_DIGEST: ${{ steps.digests.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ steps.digests.outputs.frontend_digest }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ needs.prepare.outputs.source_revision }}
          VERSION: ${{ needs.prepare.outputs.image_version }}
          PLATFORMS: ${{ needs.prepare.outputs.image_platforms }}
          PUBLISH_LATEST: ${{ needs.prepare.outputs.publish_latest }}
        run: |
          jq -n \
            --arg backend_image "$BACKEND_IMAGE:$IMAGE_TAG" \
            --arg frontend_image "$FRONTEND_IMAGE:$IMAGE_TAG" \
            --arg backend_digest "$BACKEND_DIGEST" \
            --arg frontend_digest "$FRONTEND_DIGEST" \
            --arg source "$SOURCE" \
            --arg revision "$REVISION" \
            --arg version "$VERSION" \
            --arg platforms "$PLATFORMS" \
            --argjson publish_latest "$PUBLISH_LATEST" \
            '{backend_image:$backend_image, frontend_image:$frontend_image, backend_digest:$backend_digest, frontend_digest:$frontend_digest, source:$source, revision:$revision, version:$version, platforms:$platforms, publish_latest:$publish_latest}' \
            > image-digests.json
          {
            echo "## Application images"
            echo
            echo "- Backend: $BACKEND_IMAGE@$BACKEND_DIGEST"
            echo "- Frontend: $FRONTEND_IMAGE@$FRONTEND_DIGEST"
            echo "- Platforms: $PLATFORMS"
            echo "- Source revision: $REVISION"
            echo "- Builds: parallel backend/frontend with protected registry caches"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image digest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digests-${{ needs.prepare.outputs.image_tag }}
          path: image-digests.json
          if-no-files-found: error
