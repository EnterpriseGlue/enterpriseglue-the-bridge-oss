name: Microsoft Entra ID Rehearsal (Opt-in)

on:
  workflow_dispatch:
    inputs:
      run_rehearsal:
        description: Run against the dedicated Entra ID test tenant
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '40 5 * * 1-5'

permissions:
  contents: read

concurrency:
  group: entra-id-rehearsal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rehearsal:
    name: Dedicated Entra ID OIDC browser rehearsal
    runs-on: ubuntu-latest
    environment: entra-id-test
    if: >-
      (github.event_name == 'schedule' && vars.ENTRA_ID_REHEARSAL_SCHEDULED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_rehearsal)
    timeout-minutes: 25
    env:
      ENTRA_ID_REHEARSAL_ENABLED: 'true'
      ENTRA_ID_REHEARSAL_TEST_TENANT: 'true'
      ENTRA_ID_REHEARSAL_ALLOW_EXTERNAL: 'true'
      ENTRA_ID_REHEARSAL_BASE_URL: ${{ vars.ENTRA_ID_REHEARSAL_BASE_URL }}
      ENTRA_ID_REHEARSAL_TENANT_ID: ${{ vars.ENTRA_ID_REHEARSAL_TENANT_ID }}
      ENTRA_ID_REHEARSAL_CLIENT_ID: ${{ vars.ENTRA_ID_REHEARSAL_CLIENT_ID }}
      ENTRA_ID_REHEARSAL_CLIENT_SECRET_REF: ${{ vars.ENTRA_ID_REHEARSAL_CLIENT_SECRET_REF }}
      ENTRA_ID_REHEARSAL_ENTITLEMENT_TYPE: ${{ vars.ENTRA_ID_REHEARSAL_ENTITLEMENT_TYPE }}
      ENTRA_ID_REHEARSAL_ENTITLEMENT_ID: ${{ vars.ENTRA_ID_REHEARSAL_ENTITLEMENT_ID }}
      ENTRA_ID_REHEARSAL_ENGINE_BASE_URL: ${{ secrets.ENTRA_ID_REHEARSAL_ENGINE_BASE_URL }}
      ENTRA_ID_REHEARSAL_ENGINE_TYPE: ${{ vars.ENTRA_ID_REHEARSAL_ENGINE_TYPE }}
      ENTRA_ID_REHEARSAL_PLATFORM_ADMIN_EMAIL: ${{ secrets.ENTRA_ID_REHEARSAL_PLATFORM_ADMIN_EMAIL }}
      ENTRA_ID_REHEARSAL_PLATFORM_ADMIN_PASSWORD: ${{ secrets.ENTRA_ID_REHEARSAL_PLATFORM_ADMIN_PASSWORD }}
      ENTRA_ID_REHEARSAL_USERNAME: ${{ secrets.ENTRA_ID_REHEARSAL_USERNAME }}
      ENTRA_ID_REHEARSAL_PASSWORD: ${{ secrets.ENTRA_ID_REHEARSAL_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.0.8

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run dedicated Entra ID rehearsal
        run: pnpm run test:entra:real-rehearsal

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: entra-id-rehearsal-${{ github.run_id }}
          path: test/results/playwright
          if-no-files-found: warn
          retention-days: 7
