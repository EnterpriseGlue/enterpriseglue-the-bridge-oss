name: Configuration Bundle

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment containing ENTERPRISEGLUE_API_URL and ENTERPRISEGLUE_CONFIG_TOKEN
        required: true
        type: environment
      bundle_path:
        description: Repository-relative path to a JSON bundle or directory of JSON bundles
        required: true
        default: config/enterpriseglue.json
        type: string
      git_ref:
        description: Immutable commit SHA to apply; use a reviewed commit for production
        required: true
        type: string
      operation:
        description: Preview has no side effects. Apply runs a new hash-bound preview before mutation.
        required: true
        default: preview
        type: choice
        options:
          - preview
          - apply
      identity_reconciliation_mode:
        description: Applied bundles can skip stored identity replay, preview it, or run a bounded replay after commit.
        required: false
        default: apply
        type: choice
        options:
          - apply
          - preview
          - none
      confirm_apply:
        description: Type APPLY only after reviewing the preview for this exact commit
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: config-bundle-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  config-bundle:
    name: ${{ inputs.operation }} configuration bundle
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ENTERPRISEGLUE_API_URL: ${{ vars.ENTERPRISEGLUE_API_URL }}
      ENTERPRISEGLUE_API_TOKEN: ${{ secrets.ENTERPRISEGLUE_CONFIG_TOKEN }}
      ENTERPRISEGLUE_CONFIG_IDEMPOTENCY_KEY: config-bundle-${{ github.run_id }}
      ENTERPRISEGLUE_CONFIG_EXPECTED_TENANT_SCOPE: ${{ vars.ENTERPRISEGLUE_CONFIG_EXPECTED_TENANT_SCOPE }}
      ENTERPRISEGLUE_CONFIG_IDENTITY_RECONCILIATION_MODE: ${{ inputs.identity_reconciliation_mode }}
      ENTERPRISEGLUE_CONFIG_SOURCE_REPOSITORY: ${{ github.repository }}
      ENTERPRISEGLUE_CONFIG_SOURCE_REVISION: ${{ inputs.git_ref }}
      ENTERPRISEGLUE_CONFIG_SOURCE_WORKFLOW_RUN_ID: ${{ github.run_id }}
      ENTERPRISEGLUE_CONFIG_SOURCE_WORKFLOW: ${{ github.workflow }}
      BUNDLE_PATH: ${{ inputs.bundle_path }}
      GIT_REF: ${{ inputs.git_ref }}
      OPERATION: ${{ inputs.operation }}
      CONFIRM_APPLY: ${{ inputs.confirm_apply }}
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_ref }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validate workflow inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ENTERPRISEGLUE_API_URL"
          test -n "$ENTERPRISEGLUE_API_TOKEN"
          test -n "$ENTERPRISEGLUE_CONFIG_EXPECTED_TENANT_SCOPE"
          bundle_type="$(git cat-file -t "HEAD:$BUNDLE_PATH")"
          if [[ -L "$BUNDLE_PATH" ]] ||
             ! { [[ "$bundle_type" == tree && -d "$BUNDLE_PATH" ]] ||
                 [[ "$bundle_type" == blob && -f "$BUNDLE_PATH" && "$BUNDLE_PATH" == *.json ]]; }; then
            echo "bundle_path must name a tracked JSON file or directory" >&2
            exit 64
          fi
          if [[ -n "$(git status --porcelain --untracked-files=all --ignored -- ":(literal)$BUNDLE_PATH")" ]]; then
            echo "bundle_path must match the checked-out revision" >&2
            exit 64
          fi
          if [[ "$OPERATION" == "apply" && "$CONFIRM_APPLY" != "APPLY" ]]; then
            echo "Apply requires confirm_apply=APPLY" >&2
            exit 64
          fi
          if [[ "$OPERATION" == "apply" && ! "$GIT_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Apply requires git_ref to be a full immutable commit SHA" >&2
            exit 64
          fi

      - name: Preview or apply configuration bundles
        id: bundles
        shell: bash
        run: |
          set -euo pipefail
          node scripts/config-bundle.mjs "$OPERATION" "$BUNDLE_PATH" --summary | tee "$RUNNER_TEMP/config-bundle-$OPERATION.json"

      - name: Upload bundle results
        if: ${{ !cancelled() && (steps.bundles.outcome == 'success' || steps.bundles.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: config-bundle-${{ inputs.operation }}-${{ github.run_id }}
          path: ${{ runner.temp }}/config-bundle-${{ inputs.operation }}.json
          if-no-files-found: error
          retention-days: 30
