name: Configuration Bundle

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment containing ENTERPRISEGLUE_API_URL and ENTERPRISEGLUE_CONFIG_TOKEN
        required: true
        type: environment
      bundle_path:
        description: Repository-relative path to the JSON bundle
        required: true
        default: config/enterpriseglue.json
        type: string
      git_ref:
        description: Immutable commit SHA to apply; use a reviewed commit for production
        required: true
        type: string
      operation:
        description: Preview has no side effects. Apply runs a new hash-bound preview before mutation.
        required: true
        default: preview
        type: choice
        options:
          - preview
          - apply
      identity_reconciliation_mode:
        description: Applied bundles can skip stored identity replay, preview it, or run a bounded replay after commit.
        required: false
        default: apply
        type: choice
        options:
          - apply
          - preview
          - none
      confirm_apply:
        description: Type APPLY only after reviewing the preview for this exact commit
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: config-bundle-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  config-bundle:
    name: ${{ inputs.operation }} configuration bundle
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ENTERPRISEGLUE_API_URL: ${{ vars.ENTERPRISEGLUE_API_URL }}
      ENTERPRISEGLUE_API_TOKEN: ${{ secrets.ENTERPRISEGLUE_CONFIG_TOKEN }}
      ENTERPRISEGLUE_CONFIG_IDEMPOTENCY_KEY: config-bundle-${{ github.run_id }}
      ENTERPRISEGLUE_CONFIG_EXPECTED_TENANT_SCOPE: ${{ vars.ENTERPRISEGLUE_CONFIG_EXPECTED_TENANT_SCOPE }}
      ENTERPRISEGLUE_CONFIG_IDENTITY_RECONCILIATION_MODE: ${{ inputs.identity_reconciliation_mode }}
      BUNDLE_PATH: ${{ inputs.bundle_path }}
      GIT_REF: ${{ inputs.git_ref }}
      OPERATION: ${{ inputs.operation }}
      CONFIRM_APPLY: ${{ inputs.confirm_apply }}
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.git_ref }}

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.0.8

      - name: Validate workflow inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ENTERPRISEGLUE_API_URL"
          test -n "$ENTERPRISEGLUE_API_TOKEN"
          test -n "$ENTERPRISEGLUE_CONFIG_EXPECTED_TENANT_SCOPE"
          case "$BUNDLE_PATH" in
            *.json) ;;
            *) echo "bundle_path must name a JSON file" >&2; exit 64 ;;
          esac
          git ls-files --error-unmatch -- "$BUNDLE_PATH" >/dev/null
          if [[ "$OPERATION" == "apply" && "$CONFIRM_APPLY" != "APPLY" ]]; then
            echo "Apply requires confirm_apply=APPLY" >&2
            exit 64
          fi
          if [[ "$OPERATION" == "apply" && ! "$GIT_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Apply requires git_ref to be a full immutable commit SHA" >&2
            exit 64
          fi

      - name: Preview configuration bundle
        shell: bash
        run: |
          set -euo pipefail
          pnpm authz:config preview "$BUNDLE_PATH" | tee config-bundle-preview.json

      - name: Upload preview receipt
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: config-bundle-preview-${{ github.run_id }}
          path: config-bundle-preview.json
          if-no-files-found: error
          retention-days: 30

      - name: Apply configuration bundle
        if: inputs.operation == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/config-bundle.mjs apply "$BUNDLE_PATH" | tee config-bundle-apply.json
          APPLY_RUN_ID="$(node -e "const receipt=require('./config-bundle-apply.json'); if (!receipt.applyRunId) process.exit(1); process.stdout.write(receipt.applyRunId)")"
          node scripts/config-bundle.mjs wait "$APPLY_RUN_ID" | tee config-bundle-reconciliation.json

      - name: Upload apply receipt
        if: inputs.operation == 'apply'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: config-bundle-apply-${{ github.run_id }}
          path: config-bundle-apply.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload reconciliation receipt
        if: inputs.operation == 'apply'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: config-bundle-reconciliation-${{ github.run_id }}
          path: config-bundle-reconciliation.json
          if-no-files-found: error
          retention-days: 30
