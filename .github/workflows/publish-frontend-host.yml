name: Publish Frontend Host

on:
  push:
    branches:
      - main
    tags:
      - "frontend-host/v*"
    paths:
      - "packages/frontend-host/**"
      - ".github/workflows/publish-frontend-host.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no actual publish)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-frontend-host
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frontend-host
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@enterpriseglue"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.0.8

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Build ESM output
        run: pnpm run build

      - name: Read package version
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Publishing $NAME@$VERSION"

      - name: Pack package
        id: pack
        run: |
          PACK_DIR="$RUNNER_TEMP/frontend-host-pack"
          mkdir -p "$PACK_DIR"
          TARBALL="$(pnpm pack --pack-destination "$PACK_DIR" | tail -n 1)"
          case "$TARBALL" in
            /*) ;;
            *) TARBALL="$PACK_DIR/$TARBALL" ;;
          esac
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          tar -xOf "$TARBALL" package/package.json > "$RUNNER_TEMP/frontend-host-package.json"
          node - <<'NODE'
          const pkg = require(`${process.env.RUNNER_TEMP}/frontend-host-package.json`);
          const workspaceDeps = Object.entries({
            ...pkg.dependencies,
            ...pkg.peerDependencies,
            ...pkg.optionalDependencies,
          }).filter(([, version]) => typeof version === 'string' && version.startsWith('workspace:'));
          if (workspaceDeps.length) {
            console.error(`ERROR: packed package contains workspace protocol dependencies: ${workspaceDeps.map(([name]) => name).join(', ')}`);
            process.exit(1);
          }
          NODE

      - name: Verify exports point to dist
        run: |
          node -e "const pkg=require('./package.json'); const exp=pkg.exports?.['./*']; if (!exp || exp.default !== './dist/*.js' || exp.types !== './dist/*.d.ts') { console.error('ERROR: exports for ./* must point to dist/*.js and dist/*.d.ts'); process.exit(1); }"

      - name: Verify not already published
        id: check
        continue-on-error: true
        run: |
          npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version \
            --registry=https://npm.pkg.github.com 2>/dev/null
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if already published
        if: steps.check.outcome == 'success'
        run: |
          echo "::warning::${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} is already published. Skipping."
          exit 0

      - name: Publish (dry run)
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true')
          && steps.check.outcome != 'success'
        run: npm publish "${{ steps.pack.outputs.tarball }}" --dry-run --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: >-
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true')
          && steps.check.outcome != 'success'
        run: npm publish "${{ steps.pack.outputs.tarball }}" --ignore-scripts --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify EE canary
        if: >-
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true')
          && steps.check.outcome != 'success'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.EE_DISPATCH_TOKEN }}
          repository: EnterpriseGlue/enterpriseglue-the-bridge-ee
          event-type: oss-package-published
          client-payload: |
            {
              "package_name": "${{ steps.pkg.outputs.name }}",
              "package_version": "${{ steps.pkg.outputs.version }}"
            }

      - name: Summary
        run: |
          echo "### Frontend Host Published :package:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Package**: \`${{ steps.pkg.outputs.name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version**: \`${{ steps.pkg.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Registry**: GitHub Packages" >> "$GITHUB_STEP_SUMMARY"
