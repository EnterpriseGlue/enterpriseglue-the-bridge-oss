name: Documentation release handoff
on:
  release:
    types: [published]
  workflow_run:
    workflows: [Release Please]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release to catch up; blank selects the latest published release
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: documentation-handoff-${{ inputs.release_tag || github.event.release.tag_name || 'latest' }}
  cancel-in-progress: false
jobs:
  handoff:
    if: >-
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.path == '.github/workflows/release-please.yml'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout protected tools, never executable release contents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Verify the owning repository lifecycle
        run: node plugins/enterpriseglue-dev-workflows/scripts/check-repository-lifecycle.mjs --repository EnterpriseGlue/enterpriseglue-the-bridge-oss --operation read
      - name: Request private documentation preparation independently
        env:
          GH_TOKEN: ${{ github.token }}
          DOCUMENTATION_UPDATE_TOKEN: ${{ secrets.DOCUMENTATION_UPDATE_TOKEN }}
          DOCUMENTATION_RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name || '' }}
        run: node scripts/request-documentation-update.mjs
