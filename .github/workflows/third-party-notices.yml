name: Third-Party Notices

on:
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - backend/package.json
      - frontend/package.json
      - packages/*/package.json
      - scripts/generate-third-party-notices.mjs
      - scripts/update-third-party-notices.sh
      - third_party_licenses.json
      - backend/third_party_licenses.json
      - frontend/third_party_licenses.json
      - packages/*/third_party_licenses.json
      - THIRD_PARTY_NOTICES.md
      - .github/workflows/third-party-notices.yml
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  packages: read

jobs:
  release-notes-preflight:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/release-notes-preflight-reusable.yml
    with:
      base_ref: ${{ github.base_ref || 'main' }}
      pull_number: ${{ github.event.pull_request.number || 0 }}

  verify-third-party-notices:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: release-notes-preflight
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.0.8

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Verify third-party notices and Apache-2.0 compatibility
        id: verify
        continue-on-error: true
        run: |
          set -o pipefail
          bash ./scripts/update-third-party-notices.sh --check --strict 2>&1 | tee third-party-notices.log

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-notices-${{ github.run_id }}
          path: third-party-notices.log
          if-no-files-found: warn

      - name: Fail if verification failed
        if: steps.verify.outcome == 'failure'
        run: |
          echo "Third-party notices check failed. See logs for details."
          exit 1

  refresh-third-party-notices:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.0.8

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Refresh third-party notices and enforce strict compatibility
        id: refresh
        continue-on-error: true
        run: |
          set -o pipefail
          bash ./scripts/update-third-party-notices.sh --strict 2>&1 | tee third-party-notices-refresh.log

      - name: Upload refresh log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-notices-refresh-${{ github.run_id }}
          path: third-party-notices-refresh.log
          if-no-files-found: warn

      - name: Create or update compliance alert issue
        if: steps.refresh.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = '⚠️ Third-party license compatibility alert';
            const label = 'compliance';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = [
              'The third-party notices refresh workflow failed.',
              '',
              `Run: ${runUrl}`,
              '',
              'Possible reasons:',
              '- potential Apache-2.0 compatibility issues were detected (strict mode)',
              '- generation script failed while refreshing notice artifacts',
              '',
              'Please inspect the workflow logs/artifact and update dependencies or notices as needed.',
            ].join('\n');

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'fbca04',
                description: 'Dependency/license compliance alerts',
              });
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
              creator: 'github-actions[bot]',
              per_page: 20,
            });

            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            }

      - name: Close resolved compliance alert issue
        if: steps.refresh.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = '⚠️ Third-party license compatibility alert';
            const label = 'compliance';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
              creator: 'github-actions[bot]',
              per_page: 20,
            });

            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed',
                body: `${existing.body || ''}\n\n---\n✅ Resolved on refresh run: ${runUrl}`,
              });
            }

      - name: Create PR with refreshed notice artifacts
        if: steps.refresh.outcome == 'success'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "chore(compliance): refresh third-party license notices"
          title: "chore(compliance): refresh third-party license notices"
          body: |
            Automated refresh of third-party notice artifacts.

            Generated by:
            - `bash ./scripts/update-third-party-notices.sh --strict`
          branch: chore/refresh-third-party-notices
          delete-branch: true
          labels: |
            dependencies
            release:internal
          add-paths: |
            third_party_licenses.json
            backend/third_party_licenses.json
            frontend/third_party_licenses.json
            packages/*/third_party_licenses.json
            THIRD_PARTY_NOTICES.md

      - name: Fail if refresh failed
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "Third-party notices refresh failed. See logs for details."
          exit 1
