name: CI Detect Reusable

on:
  workflow_call:
    inputs:
      enable_plugin_package:
        description: Enable plugin package artifact lane gating output
        required: false
        type: boolean
        default: true
      security_scan_on_smoke_only:
        description: Run image security scans only when the application image lane is selected
        required: false
        type: boolean
        default: true
    outputs:
      metadata_only:
        value: ${{ jobs.detect.outputs.metadata_only }}
      frontend:
        value: ${{ jobs.detect.outputs.frontend }}
      backend:
        value: ${{ jobs.detect.outputs.backend }}
      persistence:
        value: ${{ jobs.detect.outputs.persistence }}
      engine_integration:
        value: ${{ jobs.detect.outputs.engine_integration }}
      authorization:
        value: ${{ jobs.detect.outputs.authorization }}
      plugin_contract:
        value: ${{ jobs.detect.outputs.plugin_contract }}
      plugin_packaging:
        value: ${{ jobs.detect.outputs.plugin_packaging }}
      application_container:
        value: ${{ jobs.detect.outputs.application_container }}
      toolchain_container:
        value: ${{ jobs.detect.outputs.toolchain_container }}
      helm:
        value: ${{ jobs.detect.outputs.helm }}
      workflow_or_release:
        value: ${{ jobs.detect.outputs.workflow_or_release }}
      unknown_high_risk:
        value: ${{ jobs.detect.outputs.unknown_high_risk }}
      run_tests:
        value: ${{ jobs.detect.outputs.run_tests }}
      current_sha:
        value: ${{ jobs.detect.outputs.current_sha }}
      run_postgres:
        value: ${{ jobs.detect.outputs.run_postgres }}
      run_oracle:
        value: ${{ jobs.detect.outputs.run_oracle }}
      run_smoke:
        value: ${{ jobs.detect.outputs.run_smoke }}
      run_documentation_guard:
        value: ${{ jobs.detect.outputs.run_documentation_guard }}
      test_databases:
        value: ${{ jobs.detect.outputs.test_databases }}
      run_boundary_guards:
        value: ${{ jobs.detect.outputs.run_boundary_guards }}
      run_plugin_checks:
        value: ${{ jobs.detect.outputs.run_plugin_checks }}
      run_plugin_package:
        value: ${{ jobs.detect.outputs.run_plugin_package }}
      run_plugin_images:
        value: ${{ jobs.detect.outputs.run_plugin_images }}
      run_package_discipline:
        value: ${{ jobs.detect.outputs.run_package_discipline }}
      run_compose_render:
        value: ${{ jobs.detect.outputs.run_compose_render }}
      run_ci_images:
        value: ${{ jobs.detect.outputs.run_ci_images }}
      run_security_scan:
        value: ${{ jobs.detect.outputs.run_security_scan }}
      run_smoke_exposed:
        value: ${{ jobs.detect.outputs.run_smoke_exposed }}
      run_native_tenancy:
        value: ${{ jobs.detect.outputs.run_native_tenancy }}
      run_release_readiness:
        value: ${{ jobs.detect.outputs.run_release_readiness }}
      run_adapter_backstop:
        value: ${{ jobs.detect.outputs.run_adapter_backstop }}
      run_engine_browser:
        value: ${{ jobs.detect.outputs.run_engine_browser }}
      run_database_matrix:
        value: ${{ jobs.detect.outputs.run_database_matrix }}
      run_identity_rehearsal:
        value: ${{ jobs.detect.outputs.run_identity_rehearsal }}
      run_deployment_evidence:
        value: ${{ jobs.detect.outputs.run_deployment_evidence }}
      changed_files_count:
        value: ${{ jobs.detect.outputs.changed_files_count }}
      selection_summary:
        value: ${{ jobs.detect.outputs.selection_summary }}

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      metadata_only: ${{ steps.classify.outputs.metadata_only }}
      frontend: ${{ steps.classify.outputs.frontend }}
      backend: ${{ steps.classify.outputs.backend }}
      persistence: ${{ steps.classify.outputs.persistence }}
      engine_integration: ${{ steps.classify.outputs.engine_integration }}
      authorization: ${{ steps.classify.outputs.authorization }}
      plugin_contract: ${{ steps.classify.outputs.plugin_contract }}
      plugin_packaging: ${{ steps.classify.outputs.plugin_packaging }}
      application_container: ${{ steps.classify.outputs.application_container }}
      toolchain_container: ${{ steps.classify.outputs.toolchain_container }}
      helm: ${{ steps.classify.outputs.helm }}
      workflow_or_release: ${{ steps.classify.outputs.workflow_or_release }}
      unknown_high_risk: ${{ steps.classify.outputs.unknown_high_risk }}
      run_tests: ${{ steps.classify.outputs.run_tests }}
      current_sha: ${{ steps.source.outputs.current_sha }}
      run_postgres: ${{ steps.classify.outputs.run_postgres }}
      run_oracle: ${{ steps.classify.outputs.run_oracle }}
      run_smoke: ${{ steps.classify.outputs.run_smoke }}
      run_documentation_guard: ${{ steps.classify.outputs.run_documentation_guard }}
      test_databases: ${{ steps.classify.outputs.test_databases }}
      run_boundary_guards: ${{ steps.classify.outputs.run_boundary_guards }}
      run_plugin_checks: ${{ steps.classify.outputs.run_plugin_checks }}
      run_plugin_package: ${{ steps.classify.outputs.run_plugin_package }}
      run_plugin_images: ${{ steps.classify.outputs.run_plugin_images }}
      run_package_discipline: ${{ steps.classify.outputs.run_package_discipline }}
      run_compose_render: ${{ steps.classify.outputs.run_compose_render }}
      run_ci_images: ${{ steps.classify.outputs.run_ci_images }}
      run_security_scan: ${{ steps.classify.outputs.run_security_scan }}
      run_smoke_exposed: ${{ steps.classify.outputs.run_smoke_exposed }}
      run_native_tenancy: ${{ steps.classify.outputs.run_native_tenancy }}
      run_release_readiness: ${{ steps.classify.outputs.run_release_readiness }}
      run_adapter_backstop: ${{ steps.classify.outputs.run_adapter_backstop }}
      run_engine_browser: ${{ steps.classify.outputs.run_engine_browser }}
      run_database_matrix: ${{ steps.classify.outputs.run_database_matrix }}
      run_identity_rehearsal: ${{ steps.classify.outputs.run_identity_rehearsal }}
      run_deployment_evidence: ${{ steps.classify.outputs.run_deployment_evidence }}
      changed_files_count: ${{ steps.classify.outputs.changed_files_count }}
      selection_summary: ${{ steps.classify.outputs.selection_summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve exact comparison
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current_sha="$(git rev-parse HEAD)"
          echo "current_sha=$current_sha" >> "$GITHUB_OUTPUT"
          changed_file="$RUNNER_TEMP/enterpriseglue-changed-files.txt"
          : > "$changed_file"

          case "$EVENT_NAME" in
            pull_request)
              test -n "$PR_BASE_SHA"
              test -n "$PR_HEAD_SHA"
              git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" > "$changed_file"
              ;;
            merge_group)
              test -n "$MERGE_GROUP_BASE_SHA"
              test -n "$MERGE_GROUP_HEAD_SHA"
              git diff --name-only "$MERGE_GROUP_BASE_SHA" "$MERGE_GROUP_HEAD_SHA" > "$changed_file"
              ;;
            schedule)
              last_sha="$(gh api 'repos/{owner}/{repo}/actions/workflows/ci.yml/runs?event=schedule&status=success&per_page=1' --jq '.workflow_runs[0].head_sha // ""' 2>/dev/null || true)"
              if [[ -z "$last_sha" || "$last_sha" != "$current_sha" ]]; then
                echo "force_full=true" >> "$GITHUB_OUTPUT"
              fi
              ;;
            workflow_dispatch)
              echo "force_full=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "force_full=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

          # A pull request or merge-group comparison with no resolved paths is
          # ambiguous (for example, a shallow/missing ref or malformed event).
          # Fail closed instead of silently taking the policy-only fast path.
          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "merge_group" ]]; then
            if [[ ! -s "$changed_file" ]]; then
              echo "force_full=true" >> "$GITHUB_OUTPUT"
            fi
          fi

          echo "changed_file=$changed_file" >> "$GITHUB_OUTPUT"

      - name: Classify changed paths and select evidence lanes
        id: classify
        shell: bash
        env:
          CHANGED_FILE: ${{ steps.source.outputs.changed_file }}
          FORCE_FULL: ${{ steps.source.outputs.force_full }}
          ENABLE_PLUGIN_PACKAGE: ${{ inputs.enable_plugin_package }}
          SECURITY_SCAN_ON_SMOKE_ONLY: ${{ inputs.security_scan_on_smoke_only }}
        run: |
          set -euo pipefail
          args=(
            --changed-files "$CHANGED_FILE"
            --github-output "$GITHUB_OUTPUT"
            --summary "$GITHUB_STEP_SUMMARY"
          )
          if [[ "$FORCE_FULL" == "true" ]]; then args+=(--full); fi
          if [[ "$ENABLE_PLUGIN_PACKAGE" != "true" ]]; then args+=(--disable-plugin-package); fi
          if [[ "$SECURITY_SCAN_ON_SMOKE_ONLY" != "true" ]]; then args+=(--security-on-container-or-toolchain); fi
          node scripts/ci-change-classifier.mjs "${args[@]}"
