  # ---------------------------------------------------------------------------
  # Security gate: Trivy image vulnerability scan.
  # Builds backend + frontend images from PR source and scans for all
  # severity levels. Any finding blocks the PR (zero-tolerance policy).
  # Use .trivyignore with owner + expiry for accepted exceptions.
  # ---------------------------------------------------------------------------

  security-pr-scan:
    runs-on: ubuntu-latest
    needs: [detect, build-ci-images]
    if: needs.detect.outputs.run_tests == 'true' && needs.detect.outputs.run_security_scan == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download prebuilt images artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-images

      - name: Load prebuilt images
        run: |
          gunzip -c eg-local-backend-pr.tar.gz | docker load
          gunzip -c eg-local-frontend-pr.tar.gz | docker load

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0
          cache: false

      - name: Trivy scan backend image
        run: bash ./scripts/run-trivy-image-scan.sh eg-local-backend:pr backend-trivy.json 1

      - name: Trivy scan frontend image
        if: ${{ !cancelled() }}
        run: bash ./scripts/run-trivy-image-scan.sh eg-local-frontend:pr frontend-trivy.json 1

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-findings-${{ github.run_id }}
          path: |
            backend-trivy.json
            frontend-trivy.json
          if-no-files-found: warn

      - name: Security scan summary
        if: always()
        run: |
          echo "## Security Scan Results" >> "$GITHUB_STEP_SUMMARY"
          for img in backend frontend; do
            file="${img}-trivy.json"
            if [ -f "$file" ]; then
              total=$(jq '[.Results[]?.Vulnerabilities // [] | length] | add // 0' "$file")
              critical=$(jq '[.Results[]?.Vulnerabilities // [] | .[] | select(.Severity == "CRITICAL")] | length' "$file")
              high=$(jq '[.Results[]?.Vulnerabilities // [] | .[] | select(.Severity == "HIGH")] | length' "$file")
              medium=$(jq '[.Results[]?.Vulnerabilities // [] | .[] | select(.Severity == "MEDIUM")] | length' "$file")
              low=$(jq '[.Results[]?.Vulnerabilities // [] | .[] | select(.Severity == "LOW")] | length' "$file")
              echo "### ${img}" >> "$GITHUB_STEP_SUMMARY"
              echo "| Severity | Count |" >> "$GITHUB_STEP_SUMMARY"
              echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
              echo "| Critical | ${critical} |" >> "$GITHUB_STEP_SUMMARY"
              echo "| High | ${high} |" >> "$GITHUB_STEP_SUMMARY"
              echo "| Medium | ${medium} |" >> "$GITHUB_STEP_SUMMARY"
              echo "| Low | ${low} |" >> "$GITHUB_STEP_SUMMARY"
              echo "| **Total** | **${total}** |" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  native-tenancy-pooled-e2e:
    name: Native pooled tenancy and segregated SSO
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.run_native_tenancy == 'true'
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

