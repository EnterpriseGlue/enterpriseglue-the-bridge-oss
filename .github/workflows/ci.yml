name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-notes-preflight:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/release-notes-preflight-reusable.yml
    with:
      base_ref: ${{ github.base_ref || 'main' }}
      pull_number: ${{ github.event.pull_request.number || 0 }}
      publish_preview: true

  detect:
    needs: release-notes-preflight
    permissions:
      contents: read
    uses: ./.github/workflows/ci-detect-reusable.yml
    with:
      enable_plugin_package: true
      security_scan_on_smoke_only: true
    secrets: inherit

  boundary-guards:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.run_boundary_guards == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.0.8

      - name: Run OSS boundary guard
        run: pnpm run guard:oss-ee-boundary

      - name: Validate configuration deployment contract
        run: pnpm run guard:config-deployment-contract

      - name: Validate frontend runtime configuration deployment contract
        run: pnpm run test:frontend-runtime-config-contract

      - name: Enforce documentation publication boundary
        run: pnpm run guard:documentation-boundary -- --base-ref "origin/${{ github.base_ref || 'main' }}"

      - name: Verify pooled tenant ownership and timed execution inventory
        run: |
          pnpm run test:tenant-ownership-inventory
          pnpm run guard:tenant-ownership-inventory

      - name: Validate versioned Codex workflow plugin
        run: pnpm run test:codex-plugin

      - name: Prove paid plugins stay outside the public OSS dependency closure
        run: pnpm run guard:paid-plugin-boundary

  plugin-platform:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.run_tests == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.0.8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify public plugin contracts and hosts
        run: |
          pnpm --filter @enterpriseglue/plugin-sdk run test
          pnpm --filter @enterpriseglue/plugin-sdk run build
          pnpm --filter @enterpriseglue/plugin-sdk run test:compat
          pnpm --filter @enterpriseglue/plugin-runtime run test
          pnpm run test:plugin-installer
          pnpm run test:plugin-manager
          pnpm run test:plugin-reference
          pnpm --filter @enterpriseglue/backend-host run typecheck:plugin-acceptance
          pnpm --filter @enterpriseglue/backend-host run test:plugin-runtime
          pnpm --filter @enterpriseglue/frontend-host run typecheck
          pnpm --filter @enterpriseglue/frontend-host run test:plugin-bridge

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Verify generic deployment and multi-replica acceptance
        run: |
          pnpm run test:plugin-platform:chart
          pnpm run test:plugin-platform:compose-lifecycle
          pnpm run test:plugin-platform:multi-replica

  plugin-platform-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: detect
    if: needs.detect.outputs.run_tests == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify production OSS plugin-host images stay deployable and public-only
        run: bash ./scripts/check-plugin-platform-production-images.sh

  published-package-version-discipline:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.run_tests == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.0.8

      - name: Enforce published OSS package version discipline
        run: pnpm run guard:published-package-versions

  plugin-api-compat-current:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.run_plugin_checks == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.0.8

      - name: Validate plugin-api current compatibility lane
        run: pnpm run guard:plugin-api:current

  plugin-api-compat-next:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.run_plugin_checks == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.0.8

      - name: Validate plugin-api next compatibility lane
        run: pnpm run guard:plugin-api:next

  plugin-api-package:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.run_plugin_package == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.0.8

      - name: Package plugin-api artifact
        run: |
          pnpm run plugin-api:pack
          echo "--- Artifacts directory ---"
          ls -la .artifacts/

      - name: Upload plugin-api artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-api-package
          path: .artifacts/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  compose-render:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.run_tests == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate compose render for dev DB overlays
        shell: bash
        run: |
          set -euo pipefail
          COMPOSE_DIR="infra/docker/compose"
          ENV_EXAMPLES_DIR="infra/docker/env/examples"
          cp "$ENV_EXAMPLES_DIR/docker.postgres.env.example" .env.docker
          EG_BACKEND_ENV_FILE=./infra/docker/env/examples/docker.postgres.env.example docker compose --project-directory . --env-file "$ENV_EXAMPLES_DIR/docker.postgres.env.example" -f "$COMPOSE_DIR/docker-compose.yml" config >/dev/null
          EG_CONFIG_BUNDLE_HOST_PATH=./backend/.env.example EG_CONFIG_SECRETS_HOST_PATH=./backend EG_BACKEND_ENV_FILE=./infra/docker/env/examples/docker.postgres.env.example docker compose --project-directory . --env-file "$ENV_EXAMPLES_DIR/docker.postgres.env.example" -f "$COMPOSE_DIR/docker-compose.yml" -f "$COMPOSE_DIR/docker-compose.config-bundle.yml" config >/dev/null
          EG_BACKEND_ENV_FILE=./infra/docker/env/examples/docker.mysql.env.example docker compose --project-directory . --env-file "$ENV_EXAMPLES_DIR/docker.mysql.env.example" -f "$COMPOSE_DIR/docker-compose.yml" -f "$COMPOSE_DIR/docker-compose.mysql.yml" config >/dev/null
          EG_BACKEND_ENV_FILE=./infra/docker/env/examples/docker.mssql.env.example docker compose --project-directory . --env-file "$ENV_EXAMPLES_DIR/docker.mssql.env.example" -f "$COMPOSE_DIR/docker-compose.yml" -f "$COMPOSE_DIR/docker-compose.mssql.yml" config >/dev/null
          EG_BACKEND_ENV_FILE=./infra/docker/env/examples/docker.oracle.env.example docker compose --project-directory . --env-file "$ENV_EXAMPLES_DIR/docker.oracle.env.example" -f "$COMPOSE_DIR/docker-compose.yml" -f "$COMPOSE_DIR/docker-compose.oracle.yml" config >/dev/null
          EG_BACKEND_ENV_FILE=./infra/docker/env/examples/docker.spanner.env.example docker compose --project-directory . --env-file "$ENV_EXAMPLES_DIR/docker.spanner.env.example" -f "$COMPOSE_DIR/docker-compose.yml" -f "$COMPOSE_DIR/docker-compose.spanner.yml" config >/dev/null

      - name: Validate compose render for image deployment overlays
        shell: bash
        run: |
          set -euo pipefail
          COMPOSE_DIR="infra/docker/compose"
          ENV_EXAMPLES_DIR="infra/docker/env/examples"
          EG_BACKEND_ENV_FILE=./infra/docker/env/examples/images.postgres.env.example docker compose --project-directory . --env-file "$ENV_EXAMPLES_DIR/images.postgres.env.example" -f "$COMPOSE_DIR/docker-compose.prod.yml" -f "$COMPOSE_DIR/docker-compose.images.yml" config >/dev/null
          EG_BACKEND_ENV_FILE=./infra/docker/env/examples/images.oracle.env.example docker compose --project-directory . --env-file "$ENV_EXAMPLES_DIR/images.oracle.env.example" -f "$COMPOSE_DIR/docker-compose.prod.yml" -f "$COMPOSE_DIR/docker-compose.oracle.yml" -f "$COMPOSE_DIR/docker-compose.images.yml" config >/dev/null

      - name: Validate backend exposure overlay wiring
        shell: bash
        run: |
          set -euo pipefail
          COMPOSE_DIR="infra/docker/compose"
          ENV_EXAMPLES_DIR="infra/docker/env/examples"
          cp "$ENV_EXAMPLES_DIR/production.env.example" .env.production
          EG_BACKEND_ENV_FILE=./infra/docker/env/examples/docker.postgres.env.example docker compose --project-directory . --env-file "$ENV_EXAMPLES_DIR/docker.postgres.env.example" -f "$COMPOSE_DIR/docker-compose.yml" -f "$COMPOSE_DIR/docker-compose.backend-expose.yml" config >/dev/null
          EG_BACKEND_ENV_FILE=./infra/docker/env/examples/production.env.example docker compose --project-directory . --env-file "$ENV_EXAMPLES_DIR/production.env.example" -f "$COMPOSE_DIR/docker-compose.prod.yml" -f "$COMPOSE_DIR/docker-compose.backend-expose.yml" config >/dev/null
          EG_BACKEND_ENV_FILE=./infra/docker/env/examples/images.postgres.env.example docker compose --project-directory . --env-file "$ENV_EXAMPLES_DIR/images.postgres.env.example" -f "$COMPOSE_DIR/docker-compose.prod.yml" -f "$COMPOSE_DIR/docker-compose.images.yml" -f "$COMPOSE_DIR/docker-compose.backend-expose.yml" config >/dev/null

      - name: Validate compose network isolation
        shell: bash
        run: |
          set -euo pipefail
          COMPOSE_DIR="infra/docker/compose"
          ENV_EXAMPLES_DIR="infra/docker/env/examples"

          assert_project_network() {
            local project_name="$1"
            local rendered
            shift
            rendered="$("$@")"
            if grep -Fq "name: enterpriseglue-network" <<<"$rendered"; then
              echo "Compose render uses shared network name enterpriseglue-network for project ${project_name}" >&2
              exit 1
            fi
            if ! grep -Fq "name: ${project_name}_enterpriseglue-network" <<<"$rendered"; then
              echo "Compose render did not use project-scoped enterpriseglue network for project ${project_name}" >&2
              exit 1
            fi
          }

          assert_project_network eg-compose-dev \
            env EG_BACKEND_ENV_FILE=./infra/docker/env/examples/docker.postgres.env.example \
            docker compose --project-name eg-compose-dev --project-directory . --env-file "$ENV_EXAMPLES_DIR/docker.postgres.env.example" -f "$COMPOSE_DIR/docker-compose.yml" config

          assert_project_network eg-compose-prod \
            env EG_BACKEND_ENV_FILE=./infra/docker/env/examples/production.env.example \
            docker compose --project-name eg-compose-prod --project-directory . --env-file "$ENV_EXAMPLES_DIR/production.env.example" -f "$COMPOSE_DIR/docker-compose.prod.yml" config

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          cp "$COMPOSE_DIR/docker-compose.selfhost.yml" "$tmp_dir/docker-compose.selfhost.yml"
          cp "$ENV_EXAMPLES_DIR/selfhost.env.example" "$tmp_dir/.env"
          assert_project_network eg-compose-selfhost \
            docker compose --project-name eg-compose-selfhost --project-directory "$tmp_dir" -f "$tmp_dir/docker-compose.selfhost.yml" config

      - name: Validate Docker docs command spelling
        shell: bash
        run: |
          set -euo pipefail
          matches="$(grep -RInE '(^|[^[:alnum:]_])(pm|ppnpm|npm)[[:space:]]+run' README.md CONTRIBUTING.md docs 2>/dev/null || true)"
          if [[ -n "$matches" ]]; then
            echo "Docker docs should use pnpm run commands; found:" >&2
            echo "$matches" >&2
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.run_tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        database: ${{ fromJSON(needs.detect.outputs.test_databases) }}
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      oracle:
        image: gvenzl/oracle-xe:21-slim-faststart
        env:
          ORACLE_PASSWORD: oracle123
          APP_USER: main
          APP_USER_PASSWORD: oracle123
        ports:
          - 1521:1521
        options: >-
          --health-cmd="healthcheck.sh"
          --health-interval=20s
          --health-timeout=10s
          --health-retries=20
          --health-start-period=60s
    env:
      NODE_ENV: test
      DATABASE_TYPE: ${{ matrix.database }}
      PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
      JWT_SECRET: test-secret-please-change-00000000000000
      CAMUNDA_BASE_URL: http://localhost:9080/engine-rest
      POSTGRES_HOST: ${{ matrix.database == 'postgres' && 'localhost' || '' }}
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${{ matrix.database == 'postgres' && 'postgres' || '' }}
      POSTGRES_PASSWORD: ${{ matrix.database == 'postgres' && 'postgres' || '' }}
      POSTGRES_DATABASE: ${{ matrix.database == 'postgres' && 'postgres' || '' }}
      POSTGRES_SCHEMA: main
      POSTGRES_SSL_REJECT_UNAUTHORIZED: false
      ORACLE_HOST: ${{ matrix.database == 'oracle' && 'localhost' || '' }}
      ORACLE_PORT: 1521
      ORACLE_USER: ${{ matrix.database == 'oracle' && 'main' || '' }}
      ORACLE_PASSWORD: ${{ matrix.database == 'oracle' && 'oracle123' || '' }}
      ORACLE_SERVICE_NAME: ${{ matrix.database == 'oracle' && 'XEPDB1' || '' }}
      ORACLE_SCHEMA: ${{ matrix.database == 'oracle' && 'MAIN' || '' }}
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.0.8

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Install DB driver for matrix database
        if: matrix.database == 'oracle'
        run: pnpm add --filter webmodeler-backend --save-dev oracledb

      - name: Build OSS packages
        run: |
          pnpm --filter shared run build
          pnpm install --filter backend-host
          pnpm --filter backend-host run build
          pnpm install --filter frontend-host
          pnpm run build:frontend-host

      - name: Build backend
        run: pnpm --filter webmodeler-backend run build:skip-generate

      - name: Create PostgreSQL schema
        if: matrix.database == 'postgres'
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE SCHEMA IF NOT EXISTS main;"

      - name: Sync database schema
        run: pnpm --filter webmodeler-backend run db:schema:sync

      - name: Run unit tests
        if: matrix.database == 'postgres' && github.event_name != 'merge_group'
        run: pnpm run test:unit

      - name: Enforce fine-grained authorization coverage contracts
        if: matrix.database == 'postgres' && github.event_name != 'merge_group'
        run: pnpm run test:authz:structure

      - name: Enforce headless administrator configuration parity
        if: matrix.database == 'postgres' && github.event_name != 'merge_group'
        run: node --test scripts/headless-admin-contract-parity.test.mjs scripts/headless-admin-cli-lifecycle.test.mjs

      - name: Run integration tests
        if: matrix.database == 'postgres' && github.event_name != 'merge_group'
        run: pnpm run test:integration

      - name: Run authorization mutation guard
        if: matrix.database == 'postgres' && github.event_name != 'merge_group'
        run: pnpm run test:authz:mutation

      - name: Run Oracle backend smoke
        if: matrix.database == 'oracle'
        run: |
          pnpm --filter webmodeler-backend run start:compiled &
          for i in {1..45}; do
            if curl -sf http://localhost:8787/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:8787/health >/dev/null

      - name: Start Camunda mock server
        if: matrix.database == 'postgres' && github.event_name != 'merge_group'
        run: node test/e2e/mock-camunda/server.mjs &

      - name: Start backend
        if: matrix.database == 'postgres' && github.event_name != 'merge_group'
        run: pnpm --filter webmodeler-backend run start:compiled &

      - name: Start frontend
        if: matrix.database == 'postgres' && github.event_name != 'merge_group'
        run: pnpm --filter webmodeler-frontend run dev -- --host 0.0.0.0 --port 5173 &

      - name: Wait for services
        if: matrix.database == 'postgres' && github.event_name != 'merge_group'
        run: |
          for i in {1..45}; do
            if curl -sf http://localhost:8787/health >/dev/null \
              && curl -sf http://localhost:9080/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:8787/health >/dev/null
          curl -sf http://localhost:5173/login >/dev/null
          curl -sf http://localhost:9080/health >/dev/null

      - name: Run smoke e2e
        if: matrix.database == 'postgres' && github.event_name != 'merge_group'
        run: |
          PW_VERSION="$(node -p "require('@playwright/test/package.json').version")"
          docker run --rm \
            --network host \
            --ipc host \
            --user "$(id -u):$(id -g)" \
            -e CI="${CI:-true}" \
            -e HOME=/tmp \
            -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            -e PLAYWRIGHT_BASE_URL=http://localhost:5173 \
            -e E2E_API_BASE_URL=http://localhost:8787 \
            -e CAMUNDA_BASE_URL \
            -e DATABASE_TYPE \
            -e POSTGRES_HOST \
            -e POSTGRES_PORT \
            -e POSTGRES_USER \
            -e POSTGRES_PASSWORD \
            -e POSTGRES_DATABASE \
            -e POSTGRES_SCHEMA \
            -e POSTGRES_SSL_REJECT_UNAUTHORIZED \
            -e ADMIN_EMAIL \
            -e ADMIN_PASSWORD \
            -e ENCRYPTION_KEY \
            -v "$PWD:/work" \
            -w /work \
            "mcr.microsoft.com/playwright:v${PW_VERSION}-jammy" \
            bash -lc "npx playwright test --config test/e2e/playwright.config.ts --grep @smoke"

      - name: Run identity lifecycle browser e2e
        if: matrix.database == 'postgres' && github.event_name != 'merge_group'
        run: |
          PW_VERSION="$(node -p "require('@playwright/test/package.json').version")"
          docker run --rm \
            --network host \
            --ipc host \
            --user "$(id -u):$(id -g)" \
            -e CI="${CI:-true}" \
            -e HOME=/tmp \
            -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            -e PLAYWRIGHT_BASE_URL=http://localhost:5173 \
            -e E2E_SEED_USER=false \
            -e IDENTITY_TEST_EVIDENCE_PATH=test/results/identity-lifecycle-evidence.json \
            -e DATABASE_TYPE \
            -e POSTGRES_HOST \
            -e POSTGRES_PORT \
            -e POSTGRES_USER \
            -e POSTGRES_PASSWORD \
            -e POSTGRES_DATABASE \
            -e POSTGRES_SCHEMA \
            -e POSTGRES_SSL_REJECT_UNAUTHORIZED \
            -e ENCRYPTION_KEY \
            -v "$PWD:/work" \
            -w /work \
            "mcr.microsoft.com/playwright:v${PW_VERSION}-jammy" \
            bash -lc "npx playwright test --config test/e2e/playwright.config.ts --grep @identity-lifecycle"

      - name: Upload sanitized identity lifecycle evidence
        if: always() && matrix.database == 'postgres' && github.event_name != 'merge_group'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: identity-lifecycle-evidence-${{ github.run_id }}
          path: test/results/identity-lifecycle-evidence.json
          if-no-files-found: warn
          retention-days: 7

      - name: Run Access Control and headless administration browser e2e
        if: matrix.database == 'postgres' && github.event_name != 'merge_group'
        run: |
          PW_VERSION="$(node -p "require('@playwright/test/package.json').version")"
          docker run --rm \
            --network host \
            --ipc host \
            --user "$(id -u):$(id -g)" \
            -e CI="${CI:-true}" \
            -e HOME=/tmp \
            -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            -e PLAYWRIGHT_BASE_URL=http://localhost:5173 \
            -e E2E_SEED_USER=false \
            -e DATABASE_TYPE \
            -e POSTGRES_HOST \
            -e POSTGRES_PORT \
            -e POSTGRES_USER \
            -e POSTGRES_PASSWORD \
            -e POSTGRES_DATABASE \
            -e POSTGRES_SCHEMA \
            -e POSTGRES_SSL_REJECT_UNAUTHORIZED \
            -e ENCRYPTION_KEY \
            -v "$PWD:/work" \
            -w /work \
            "mcr.microsoft.com/playwright:v${PW_VERSION}-jammy" \
            bash -lc "npx playwright test --config test/e2e/playwright.config.ts --grep '@access-control-layout|@headless-admin'"

      - name: Cleanup test data
        if: always() && matrix.database == 'postgres' && github.event_name != 'merge_group'
        continue-on-error: true
        run: pnpm --filter webmodeler-backend run db:cleanup-test-data

      - name: Upload backend coverage
        if: failure() && matrix.database == 'postgres' && github.event_name != 'merge_group'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: backend/coverage

      - name: Upload frontend coverage
        if: failure() && matrix.database == 'postgres' && github.event_name != 'merge_group'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage

  build-ci-images:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.run_tests == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Verify source backend image dependency contract
        run: |
          docker buildx build --load \
            --pull \
            --cache-from type=gha,scope=ci-source-backend-contract \
            --cache-to type=gha,mode=max,scope=ci-source-backend-contract \
            -f backend/Dockerfile \
            -t eg-source-backend-contract:pr \
            .

      - name: Build backend image once
        run: |
          docker buildx build --load \
            --pull \
            --cache-from type=gha,scope=ci-smoke-backend \
            --cache-to type=gha,mode=max,scope=ci-smoke-backend \
            -f backend/Dockerfile.prod \
            -t eg-local-backend:pr \
            .

      - name: Build frontend image once
        run: |
          docker buildx build --load \
            --pull \
            --cache-from type=gha,scope=ci-smoke-frontend \
            --cache-to type=gha,mode=max,scope=ci-smoke-frontend \
            -f frontend/Dockerfile.prod \
            --build-arg API_BASE_URL= \
            -t eg-local-frontend:pr \
            .

      - name: Export local images
        run: |
          docker save eg-local-backend:pr | gzip -1 > eg-local-backend-pr.tar.gz
          docker save eg-local-frontend:pr | gzip -1 > eg-local-frontend-pr.tar.gz

      - name: Upload prebuilt images artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-images
          path: |
            eg-local-backend-pr.tar.gz
            eg-local-frontend-pr.tar.gz


  smoke-postgres-image-deploy:
    runs-on: ubuntu-latest
    needs: [detect, build-ci-images]
    if: needs.detect.outputs.run_tests == 'true' && needs.detect.outputs.run_smoke == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download prebuilt images artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-images

      - name: Load prebuilt images
        run: |
          gunzip -c eg-local-backend-pr.tar.gz | docker load
          gunzip -c eg-local-frontend-pr.tar.gz | docker load

      - name: Prepare image deployment env file
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "NODE_ENV=production"
            echo "BACKEND_IMAGE=eg-local-backend"
            echo "FRONTEND_IMAGE=eg-local-frontend"
            echo "IMAGE_TAG=pr"
            echo "EG_BACKEND_ENV_FILE=./.env.images.ci"
            echo "API_PORT=8787"
            echo "FRONTEND_HOST_PORT=8080"
            echo "FRONTEND_URL=http://localhost:8080"
            echo "EXPOSE_BACKEND=false"
            echo "BACKEND_HOST_PORT=8787"
            echo "DATABASE_TYPE=postgres"
            echo "POSTGRES_SCHEMA=main"
            echo "POSTGRES_USER=enterpriseglue"
            echo "POSTGRES_PASSWORD=enterpriseglue"
            echo "POSTGRES_DB=enterpriseglue"
            echo "POSTGRES_HOST=db"
            echo "POSTGRES_PORT=5432"
            echo "POSTGRES_DATABASE=enterpriseglue"
            echo "POSTGRES_SSL=false"
            echo "POSTGRES_SSL_REJECT_UNAUTHORIZED=false"
            echo "JWT_SECRET=test_secret_for_ci_release_images_only_please_change"
            echo "ADMIN_EMAIL=admin@enterpriseglue.ai"
            echo "ADMIN_PASSWORD=change_me_change_me"
            echo "ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
            echo "GIT_REPOS_PATH=./data/repos"
            echo "GIT_DEFAULT_BRANCH=main"
            echo "API_BASE_URL="
          } > .env.images.ci

      - name: Start image deployment stack
        run: |
          COMPOSE_DIR="infra/docker/compose"
          docker compose --project-directory . --env-file .env.images.ci -f "$COMPOSE_DIR/docker-compose.prod.yml" -f "$COMPOSE_DIR/docker-compose.images.yml" pull db
          docker compose --project-directory . --env-file .env.images.ci -f "$COMPOSE_DIR/docker-compose.prod.yml" -f "$COMPOSE_DIR/docker-compose.images.yml" up -d --pull never

      - name: Wait for frontend and backend health
        shell: bash
        run: |
          set -euo pipefail
          COMPOSE_DIR="infra/docker/compose"
          for i in {1..45}; do
            if curl -sf http://localhost:8080/login >/dev/null && curl -sf http://localhost:8080/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:8080/login >/dev/null
          curl -sf http://localhost:8080/health >/dev/null
          docker compose --project-directory . --env-file .env.images.ci -f "$COMPOSE_DIR/docker-compose.prod.yml" -f "$COMPOSE_DIR/docker-compose.images.yml" exec -T backend node -e "require('http').get('http://127.0.0.1:'+(process.env.API_PORT||'8787')+'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1));"

      - name: Dump stack logs on failure
        if: failure()
        run: |
          COMPOSE_DIR="infra/docker/compose"
          docker compose --project-directory . --env-file .env.images.ci -f "$COMPOSE_DIR/docker-compose.prod.yml" -f "$COMPOSE_DIR/docker-compose.images.yml" logs --no-color --tail=200 backend frontend db

      - name: Stop image deployment stack
        if: always()
        run: |
          COMPOSE_DIR="infra/docker/compose"
          docker compose --project-directory . --env-file .env.images.ci -f "$COMPOSE_DIR/docker-compose.prod.yml" -f "$COMPOSE_DIR/docker-compose.images.yml" down -v

