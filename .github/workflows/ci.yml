          path: .artifacts/saas-upgrade-restore-rollback
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Read-only release candidate qualification. Runs for Release Please pull
  # requests and whenever its own contracts change. All registry operations are
  # plan, compare, pull, or dry-run operations; publication remains post-tag.
  # ---------------------------------------------------------------------------

  release-readiness:
    name: Release candidate readiness
    needs: [release-notes-preflight, detect]
    if: >-
      needs.release-notes-preflight.result == 'success' &&
      needs.detect.result == 'success' &&
      (needs.release-notes-preflight.outputs.is_release_pull_request == 'true' ||
      (needs.detect.outputs.run_release_readiness == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository)))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout full candidate history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.0.8
          run_install: false

      - name: Set up Node.js and GitHub Packages
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: "@enterpriseglue"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        id: release-buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.5

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Set up Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3

      - name: Authenticate read-only registry access
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate read-only Helm registry access
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" |
            helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Qualify the exact release candidate without publishing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN_PLATFORM_BUILDX_BUILDER: ${{ steps.release-buildx.outputs.name }}
        run: pnpm run test:release-readiness

      - name: Retain the release-candidate receipt
        if: always() && hashFiles('.artifacts/release-readiness/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-readiness-${{ github.sha }}
          path: .artifacts/release-readiness
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Single aggregate gate: required check target for branch protection.
  # Always runs. Succeeds if all work jobs succeeded or were skipped.
  # Fails if any work job failed or was cancelled.
  # ---------------------------------------------------------------------------

  ci-complete:
    needs:
      - release-notes-preflight
      - detect
      - boundary-guards
      - plugin-platform
      - plugin-platform-images
      - published-package-version-discipline
      - plugin-api-compat-current
      - plugin-api-compat-next
      - plugin-api-package
      - compose-render
      - test
      - build-ci-images
      - smoke-postgres-image-deploy
      - smoke-postgres-image-deploy-exposed
      - security-pr-scan
      - native-tenancy-pooled-e2e
      - saas-upgrade-restore-rollback
      - release-readiness
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify aggregate dependency coverage
        run: node scripts/check-ci-aggregate-contract.mjs

      - name: Evaluate required CI results
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_REQUIRED_NON_SKIPPED_JOBS: ${{ (needs.release-notes-preflight.outputs.is_release_pull_request == 'true' || (needs.detect.outputs.run_release_readiness == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository))) && 'release-readiness' || '' }}
        run: node scripts/evaluate-ci-needs.mjs
