name: Publish plugin SDK packages

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact 40-character OSS commit to build and publish
        required: true
        type: string
      release_tag:
        description: Signed candidate release tag; required for new non-dry-run publications
        required: false
        type: string
      dry_run:
        description: Build, pack, and validate without publishing
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: enterpriseglue-plugin-packages-production
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish public plugin packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: plugin-packages-production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SOURCE_REF: ${{ inputs.source_ref }}
      PACKAGE_DIRECTORY: .artifacts/plugin-packages
    steps:
      - name: Validate protected release authority
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo "source_ref must be an immutable 40-character commit" >&2
            exit 1
          }
          [[ "$GITHUB_REPOSITORY_OWNER" == "EnterpriseGlue" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "The protected package workflow must run from refs/heads/main" >&2
            exit 1
          }
          if [[ -z "${{ inputs.release_tag }}" ]]; then
            [[ "$SOURCE_REF" == "$GITHUB_SHA" ]] || {
              echo "A non-current source_ref requires an exact release_tag" >&2
              exit 1
            }
          else
            [[ "${{ inputs.release_tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          fi

      - name: Checkout the exact public OSS revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Verify checked-out source identity
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_REF" ]]
          test -z "$(git status --porcelain)"
          if [[ -n "${{ inputs.release_tag }}" ]]; then
            git fetch --force --tags origin
            [[ "$(git rev-list -n 1 '${{ inputs.release_tag }}')" == "$SOURCE_REF" ]]
            gh release view "${{ inputs.release_tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi
          if [[ "${{ inputs.dry_run }}" != "true" ]] && git cat-file -e "$SOURCE_REF:.github/workflows/release-candidate-stage.yml" 2>/dev/null; then
            [[ "${{ inputs.release_tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "New package publications require the signed candidate release_tag" >&2
              exit 1
            }
          fi
          candidate_required=false
          if [[ -n "${{ inputs.release_tag }}" ]] && git cat-file -e "$SOURCE_REF:.github/workflows/release-candidate-stage.yml" 2>/dev/null; then
            candidate_required=true
          fi
          echo "candidate_required=$candidate_required" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.0.8
          run_install: false

      - name: Set up Node.js and GitHub Packages
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: "@enterpriseglue"

      - name: Set up ORAS
        if: steps.source.outputs.candidate_required == 'true'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Set up Cosign
        if: steps.source.outputs.candidate_required == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3

      - name: Authenticate to GHCR
        if: steps.source.outputs.candidate_required == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch the signed pre-tag package payload
        if: steps.source.outputs.candidate_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/release-candidate"
          mkdir -p "$candidate"
          bash scripts/fetch-release-candidate.sh "$SOURCE_REF" "${{ inputs.release_tag }}" "$candidate" >/dev/null
          echo "CANDIDATE_PAYLOAD=$candidate" >> "$GITHUB_ENV"

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test and build public packages
        run: |
          set -euo pipefail
          pnpm --filter @enterpriseglue/plugin-sdk run test
          pnpm --filter @enterpriseglue/plugin-sdk run build
          pnpm --filter @enterpriseglue/plugin-sdk run test:compat
          pnpm --filter @enterpriseglue/plugin-runtime run test
          pnpm --filter @enterpriseglue/plugin-runtime run build
          pnpm --filter @enterpriseglue/plugin-installer run test
          pnpm --filter @enterpriseglue/plugin-installer run build
          pnpm --filter @enterpriseglue/plugin-manager run test
          pnpm --filter @enterpriseglue/plugin-manager run build

      - name: Pack and validate immutable package payloads
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PACKAGE_DIRECTORY"
          if [[ -n "${CANDIDATE_PAYLOAD:-}" ]]; then
            cp "$CANDIDATE_PAYLOAD"/packages/*.tgz "$PACKAGE_DIRECTORY/"
          else
            pnpm --dir packages/plugin-sdk pack --pack-destination "$GITHUB_WORKSPACE/$PACKAGE_DIRECTORY"
            pnpm --dir packages/plugin-runtime pack --pack-destination "$GITHUB_WORKSPACE/$PACKAGE_DIRECTORY"
            pnpm --dir packages/plugin-installer pack --pack-destination "$GITHUB_WORKSPACE/$PACKAGE_DIRECTORY"
            pnpm --dir packages/plugin-manager pack --pack-destination "$GITHUB_WORKSPACE/$PACKAGE_DIRECTORY"
          fi
          node scripts/verify-plugin-package-tarballs.mjs "$PACKAGE_DIRECTORY" |
            tee "$PACKAGE_DIRECTORY/release-receipt.json"

      - name: Verify existing versions or plan new immutable publications
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/publish-plugin-package-set.mjs plan "$PACKAGE_DIRECTORY" |
            tee "$PACKAGE_DIRECTORY/registry-plan.json"

      - name: Publish dry run
        if: inputs.dry_run == true
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/publish-plugin-package-set.mjs dry-run "$PACKAGE_DIRECTORY" |
            tee "$PACKAGE_DIRECTORY/publication-receipt.json"

      - name: Publish packages in dependency order
        if: inputs.dry_run != true
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/publish-plugin-package-set.mjs publish "$PACKAGE_DIRECTORY" |
            tee "$PACKAGE_DIRECTORY/publication-receipt.json"

      - name: Attest published package payloads
        if: inputs.dry_run != true
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: ${{ env.PACKAGE_DIRECTORY }}/*.tgz

      - name: Verify registry visibility
        if: inputs.dry_run != true
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/publish-plugin-package-set.mjs verify "$PACKAGE_DIRECTORY" |
            tee "$PACKAGE_DIRECTORY/registry-verification.json"

      - name: Retain non-secret package receipt and tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-packages-${{ inputs.source_ref }}
          path: ${{ env.PACKAGE_DIRECTORY }}
          if-no-files-found: error
          retention-days: 30
