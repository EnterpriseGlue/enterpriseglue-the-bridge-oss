name: Release Please

on:
  push:
    branches:
      - main
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full release history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Validate release baseline
        run: node scripts/release-notes.mjs baseline --allow-pending

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@c3fc4de07084f75a2b61a5b933069bda6edf3d5c # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      - name: Resolve detailed release-note context
        id: notes
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PRS_JSON: ${{ steps.release.outputs.prs || '[]' }}
          PR_JSON: ${{ steps.release.outputs.pr || '{}' }}
          RELEASES_CREATED: ${{ steps.release.outputs.releases_created || 'false' }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
        with:
          github-token: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && secrets.RELEASE_PLEASE_TOKEN || github.token }}
          script: |
            const parseJson = (value, fallback) => {
              try { return JSON.parse(value); } catch { return fallback; }
            };
            const prs = parseJson(process.env.PRS_JSON || '[]', []);
            const pr = parseJson(process.env.PR_JSON || '{}', {});
            const releasesCreated = String(process.env.RELEASES_CREATED) === 'true';
            let pullNumber = releasesCreated
              ? ''
              : String(pr.number || pr.pullRequestNumber || prs[0]?.number || prs[0]?.pullRequestNumber || '');

            if (!pullNumber && !releasesCreated) {
              const candidates = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              });
              const releasePull = candidates.find((candidate) =>
                String(candidate.head?.ref || '').startsWith('release-please--branches--')
              );
              pullNumber = releasePull ? String(releasePull.number) : '';
            }

            if (pullNumber) {
              const { data: pull } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(pullNumber),
              });
              const version = String(pull.title || '').match(/release (\d+\.\d+\.\d+)\b/i)?.[1] || '';
              const headRef = String(pull.head?.ref || '');
              if (!version || !headRef.startsWith('release-please--branches--')) {
                core.setFailed(`Could not resolve a safe version/ref for release PR #${pullNumber}.`);
                return;
              }
              core.setOutput('pull_number', pullNumber);
              core.setOutput('head_ref', headRef);
              core.setOutput('pr_version', version);
            }

            const releasedVersion = String(process.env.HEAD_COMMIT_MESSAGE || '')
              .match(/^chore\(main\)!?: release (\d+\.\d+\.\d+)\b/)?.[1] || '';
            core.setOutput('released_version', releasedVersion);

      - name: Prepare detailed release PR notes
        if: steps.notes.outputs.pull_number != ''
        env:
          CI: "true"
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && secrets.RELEASE_PLEASE_TOKEN || github.token }}
          RELEASE_PR_NUMBER: ${{ steps.notes.outputs.pull_number }}
          RELEASE_PR_HEAD_REF: ${{ steps.notes.outputs.head_ref }}
          RELEASE_VERSION: ${{ steps.notes.outputs.pr_version }}
        run: bash scripts/prepare-release-notes-pr.sh

      - name: Release Please result
        if: ${{ always() }}
        run: |
          echo "prs_created=${{ steps.release.outputs.prs_created }}"
          echo "releases_created=${{ steps.release.outputs.releases_created }}"

      - name: Verify release exists for merged release commit
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && secrets.RELEASE_PLEASE_TOKEN || github.token }}
          script: |
            const headCommitMessage = String(context.payload.head_commit?.message || '').trim();
            const match = headCommitMessage.match(/^chore\(main\)!?: release (\d+\.\d+\.\d+)\b/);
            if (!match) {
              core.notice('Head commit is not a merged release commit. Skipping release existence verification.');
              return;
            }

            const version = match[1];
            const tagName = `v${version}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function hasTag() {
              try {
                await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `tags/${tagName}`,
                });
                return true;
              } catch (error) {
                if (error.status === 404) return false;
                throw error;
              }
            }

            async function hasRelease() {
              try {
                await github.rest.repos.getReleaseByTag({
                  owner,
                  repo,
                  tag: tagName,
                });
                return true;
              } catch (error) {
                if (error.status === 404) return false;
                throw error;
              }
            }

            for (let attempt = 1; attempt <= 6; attempt += 1) {
              const [tagExists, releaseExists] = await Promise.all([hasTag(), hasRelease()]);
              if (tagExists && releaseExists) {
                core.notice(`Verified release ${tagName} exists.`);
                return;
              }
              if (attempt < 6) {
                core.notice(`Waiting for release publication for ${tagName} (attempt ${attempt}/6).`);
                await new Promise((resolve) => setTimeout(resolve, 10000));
              }
            }

            const [tagExists, releaseExists] = await Promise.all([hasTag(), hasRelease()]);
            core.setFailed(
              `Expected merged release commit "${headCommitMessage}" to publish ${tagName}, but verification failed. ` +
              `tagExists=${tagExists} releaseExists=${releaseExists}.`
            );

      - name: Publish detailed GitHub release notes
        if: steps.notes.outputs.released_version != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && secrets.RELEASE_PLEASE_TOKEN || github.token }}
          RELEASE_VERSION: ${{ steps.notes.outputs.released_version }}
        run: |
          set -euo pipefail
          release_file="docs/releases/v${RELEASE_VERSION}.md"
          test -f "$release_file"
          gh release edit "v${RELEASE_VERSION}" --notes-file "$release_file"
