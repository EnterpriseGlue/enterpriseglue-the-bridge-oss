name: Release Please

on:
  push:
    branches:
      - main
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the explicitly approved /release batch after its release PR has merged.
        type: boolean
        default: false
      source_ref:
        description: Exact approved 40-character release merge commit on protected main.
        type: string
        default: ''
      release_tag:
        description: Exact approved vX.Y.Z release tag.
        type: string
        default: ''
      release_pr:
        description: Merged Release Please PR approved by /release.
        type: string
        default: ''
      required_prs:
        description: JSON array of merged code PR numbers included in the approved batch.
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validate release baseline
        run: node scripts/release-notes.mjs baseline --allow-pending

      - name: Resolve release preparation or explicitly approved publication
        id: publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-publication-approval.mjs

      - name: Detect fragment-derived release demand
        id: demand
        if: steps.publication.outputs.should_prepare == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base_tag="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
          test -n "$base_tag"
          fragments="$(
            git diff --name-only --diff-filter=ACMR "$base_tag"...HEAD -- .release-notes |
              grep -E '^\.release-notes/[^/]+\.json$' |
              grep -Fv '.release-notes/schema.json' || true
          )"
          if [[ -n "$fragments" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Release Please demand is backed by fragment(s) changed since $base_tag:"
            printf '%s\n' "$fragments"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "No release-note fragment changed since $base_tag; skipping Release Please mutation."
          fi
          echo "base_tag=$base_tag" >> "$GITHUB_OUTPUT"

      - name: Set up ORAS for candidate verification
        if: steps.publication.outputs.is_release == 'true'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Set up Cosign for candidate verification
        if: steps.publication.outputs.is_release == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3

      - name: Authenticate read-only candidate access
        if: steps.publication.outputs.is_release == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify signed candidate before tag creation
        if: steps.publication.outputs.is_release == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.publication.outputs.release_tag }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/release-candidate"
          mkdir -p "$candidate"
          bash scripts/fetch-release-candidate.sh "$GITHUB_SHA" "$RELEASE_TAG" "$candidate" >/dev/null

      - name: Run Release Please
        id: release
        if: steps.publication.outputs.is_release == 'true' || (steps.publication.outputs.should_prepare == 'true' && steps.demand.outputs.should_run == 'true')
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          skip-github-release: ${{ steps.publication.outputs.is_release != 'true' }}
          skip-github-pull-request: ${{ steps.publication.outputs.is_release == 'true' }}

      - name: Resolve detailed release-note context
        id: notes
        if: steps.publication.outputs.is_release == 'true' || (steps.publication.outputs.should_prepare == 'true' && steps.demand.outputs.should_run == 'true')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PRS_JSON: ${{ steps.release.outputs.prs || '[]' }}
          PR_JSON: ${{ steps.release.outputs.pr || '{}' }}
          RELEASES_CREATED: ${{ steps.release.outputs.releases_created || 'false' }}
        with:
          github-token: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && secrets.RELEASE_PLEASE_TOKEN || github.token }}
          script: |
            const parseJson = (value, fallback) => {
              try { return JSON.parse(value); } catch { return fallback; }
            };
            const prs = parseJson(process.env.PRS_JSON || '[]', []);
            const pr = parseJson(process.env.PR_JSON || '{}', {});
            const releasesCreated = String(process.env.RELEASES_CREATED) === 'true';
            let pullNumber = releasesCreated
              ? ''
              : String(pr.number || pr.pullRequestNumber || prs[0]?.number || prs[0]?.pullRequestNumber || '');

            if (!pullNumber && !releasesCreated) {
              const candidates = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              });
              const releasePull = candidates.find((candidate) =>
                String(candidate.head?.ref || '').startsWith('release-please--branches--')
              );
              pullNumber = releasePull ? String(releasePull.number) : '';
            }

            if (pullNumber) {
              const { data: pull } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(pullNumber),
              });
              const version = String(pull.title || '').match(/release (\d+\.\d+\.\d+)\b/i)?.[1] || '';
              const headRef = String(pull.head?.ref || '');
              const baseRef = String(pull.base?.ref || '');
              if (!version || !headRef.startsWith('release-please--branches--') || baseRef !== 'main') {
                core.setFailed(`Could not resolve a safe version/ref for release PR #${pullNumber}.`);
                return;
              }
              core.setOutput('pull_number', pullNumber);
              core.setOutput('head_ref', headRef);
              core.setOutput('base_ref', baseRef);
              core.setOutput('pr_version', version);
            }

      - name: Prepare detailed release PR notes
        if: steps.notes.outputs.pull_number != ''
        env:
          CI: "true"
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && secrets.RELEASE_PLEASE_TOKEN || github.token }}
          RELEASE_PR_NUMBER: ${{ steps.notes.outputs.pull_number }}
          RELEASE_PR_HEAD_REF: ${{ steps.notes.outputs.head_ref }}
          RELEASE_PR_BASE_REF: ${{ steps.notes.outputs.base_ref }}
          RELEASE_VERSION: ${{ steps.notes.outputs.pr_version }}
        run: bash scripts/prepare-release-notes-pr.sh

      - name: Release Please result
        if: ${{ always() }}
        run: |
          echo "prs_created=${{ steps.release.outputs.prs_created }}"
          echo "releases_created=${{ steps.release.outputs.releases_created }}"

      - name: Verify release exists for merged release commit
        if: ${{ always() && steps.publication.outputs.is_release == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          APPROVED_SOURCE_REF: ${{ steps.publication.outputs.source_ref }}
          APPROVED_RELEASE_TAG: ${{ steps.publication.outputs.release_tag }}
        with:
          github-token: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && secrets.RELEASE_PLEASE_TOKEN || github.token }}
          script: |
            const tagName = process.env.APPROVED_RELEASE_TAG;
            const sourceRef = process.env.APPROVED_SOURCE_REF;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function hasTag() {
              try {
                const { data: ref } = await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `tags/${tagName}`,
                });
                let object = ref.object;
                for (let depth = 0; object.type === 'tag' && depth < 3; depth++) {
                  ({ data: { object } } = await github.rest.git.getTag({ owner, repo, tag_sha: object.sha }));
                }
                if (object.type !== 'commit' || object.sha !== sourceRef) {
                  throw new Error(`Release tag ${tagName} does not identify approved source ${sourceRef}.`);
                }
                return true;
              } catch (error) {
                if (error.status === 404) return false;
                throw error;
              }
            }

            async function hasRelease() {
              try {
                await github.rest.repos.getReleaseByTag({
                  owner,
                  repo,
                  tag: tagName,
                });
                return true;
              } catch (error) {
                if (error.status === 404) return false;
                throw error;
              }
            }

            for (let attempt = 1; attempt <= 6; attempt += 1) {
              const [tagExists, releaseExists] = await Promise.all([hasTag(), hasRelease()]);
              if (tagExists && releaseExists) {
                core.notice(`Verified release ${tagName} exists.`);
                return;
              }
              if (attempt < 6) {
                core.notice(`Waiting for release publication for ${tagName} (attempt ${attempt}/6).`);
                await new Promise((resolve) => setTimeout(resolve, 10000));
              }
            }

            const [tagExists, releaseExists] = await Promise.all([hasTag(), hasRelease()]);
            core.setFailed(
              `Approved source ${sourceRef} did not publish ${tagName}. ` +
              `tagExists=${tagExists} releaseExists=${releaseExists}.`
            );

      - name: Publish detailed GitHub release notes
        if: steps.publication.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && secrets.RELEASE_PLEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ steps.publication.outputs.release_tag }}
        run: |
          set -euo pipefail
          release_file="docs/releases/${RELEASE_TAG}.md"
          test -f "$release_file"
          gh release edit "$RELEASE_TAG" --notes-file "$release_file"

      - name: Retain batch publication authorization
        if: always() && steps.publication.outputs.is_release == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-publication-authorization-${{ github.run_id }}
          path: .artifacts/release-publication
          if-no-files-found: error
          retention-days: 90
