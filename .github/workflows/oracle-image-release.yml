name: Publish Qualified Oracle Backend Image
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact commit of the existing released tag
        required: true
        type: string
      release_tag:
        description: Existing stable vX.Y.Z release tag
        required: true
        type: string
      qualification_run_id:
        description: Reuse both retained images from a completed publication run at this exact released source; leave empty for initial qualification.
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: oracle-image-release-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      source_ref: ${{ steps.source.outputs.source_ref }}
      release_tag: ${{ steps.source.outputs.release_tag }}
      qualification_run_id: ${{ steps.source.outputs.qualification_run_id }}
    steps:
      - name: Verify protected release authority before any checkout
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
        with:
          script: |
            const sourceRef = String(process.env.SOURCE_REF || '');
            const releaseTag = String(process.env.RELEASE_TAG || '');
            if (context.eventName !== 'workflow_dispatch' || context.ref !== 'refs/heads/main' ||
                context.repo.owner !== 'EnterpriseGlue' || context.repo.repo !== 'enterpriseglue-the-bridge-oss') {
              throw new Error('Oracle publication requires the first-party protected main workflow.');
            }
            if (!/^[0-9a-f]{40}$/.test(sourceRef) || !/^v\d+\.\d+\.\d+$/.test(releaseTag)) {
              throw new Error('Oracle publication requires an exact released SHA and stable release tag.');
            }
            const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            if (!branch.protected || branch.commit.sha !== context.sha) {
              throw new Error('Oracle publication requires the current protected workflow source.');
            }
            const { data: release } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag: releaseTag });
            if (release.draft || release.prerelease || release.tag_name !== releaseTag) {
              throw new Error('Oracle publication requires an existing stable published release.');
            }
            const { data: commit } = await github.rest.repos.getCommit({ ...context.repo, ref: releaseTag });
            if (commit.sha !== sourceRef) throw new Error('The released tag does not match the supplied source SHA.');
            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo, basehead: `${commit.sha}...${context.sha}`,
            });
            if (!['ahead', 'identical'].includes(comparison.status)) {
              throw new Error('The released source is outside protected main history.');
            }
            const qualificationRun = String(process.env.QUALIFICATION_RUN_ID || '');
            if (qualificationRun) {
              if (!/^[1-9][0-9]*$/.test(qualificationRun) || !Number.isSafeInteger(Number(qualificationRun))) {
                throw new Error('Oracle recovery requires a numeric qualification run ID.');
              }
              const runId = Number(qualificationRun);
              const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: runId });
              const repository = `${context.repo.owner}/${context.repo.repo}`;
              if (run.path !== '.github/workflows/oracle-image-release.yml' || run.event !== 'workflow_dispatch' ||
                  run.head_branch !== 'main' || run.head_sha !== sourceRef || run.head_repository?.full_name !== repository ||
                  run.repository?.full_name !== repository || run.status !== 'completed') {
                throw new Error('Oracle recovery requires a completed first-party publication run at the exact released source.');
              }
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                ...context.repo, run_id: runId, filter: 'latest', per_page: 100,
              });
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...context.repo, run_id: runId, per_page: 100,
              });
              for (const architecture of ['amd64', 'arm64']) {
                const qualified = jobs.filter(job => job.name === `qualify / Required AES256 and real Oracle SSO (${architecture})`);
                const retained = artifacts.filter(artifact => artifact.name === `oracle-nne-acceptance-${architecture}-${qualificationRun}`);
                if (qualified.length !== 1 || qualified[0].status !== 'completed' || qualified[0].conclusion !== 'success' ||
                    retained.length !== 1 || retained[0].expired !== false || !(retained[0].size_in_bytes > 0)) {
                  throw new Error('Oracle recovery requires passing qualification and unexpired retained images for both architectures.');
                }
              }
            }
            core.setOutput('source_ref', commit.sha);
            core.setOutput('release_tag', release.tag_name);
            core.setOutput('qualification_run_id', qualificationRun);
  qualify:
    needs: validate
    if: needs.validate.outputs.qualification_run_id == ''
    uses: ./.github/workflows/oracle-native-encryption-reusable.yml
    with:
      source_ref: ${{ needs.validate.outputs.source_ref }}
      retain_image: true
  publish:
    needs: [validate, qualify]
    if: ${{ always() && needs.validate.result == 'success' && (needs.qualify.result == 'success' || (needs.qualify.result == 'skipped' && needs.validate.outputs.qualification_run_id != '')) }}
    runs-on: ubuntu-24.04
    env:
      COSIGN_EXPERIMENTAL: '1'
      QUALIFICATION_RUN_ID: ${{ needs.validate.outputs.qualification_run_id || github.run_id }}
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.source_ref }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: oracle-nne-acceptance-*-${{ needs.validate.outputs.qualification_run_id || github.run_id }}
          path: qualification
          github-token: ${{ github.token }}
          run-id: ${{ needs.validate.outputs.qualification_run_id || github.run_id }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with: { cosign-release: v3.1.3 }
      - name: Scan and publish the retained qualified image bytes
        id: publication
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/enterpriseglue-the-bridge-oss-backend-oracle"
          # Recovery is limited to an absent stable image tag. Unknown registry
          # state or an existing immutable version must not authorize an overwrite.
          registry_error=$(mktemp)
          if oras resolve "$image:$RELEASE_TAG" > /dev/null 2> "$registry_error"; then
            echo 'The stable Oracle image tag already exists; inspect its signed publication before recovery.' >&2
            exit 1
          elif ! grep -Eqi 'manifest unknown|MANIFEST_UNKNOWN|404 Not Found|NAME_UNKNOWN' "$registry_error" &&
               ! grep -Fxq "Error response from registry: failed to resolve digest: $image:$RELEASE_TAG: not found" "$registry_error"; then
            cat "$registry_error" >&2
            exit 1
          fi
          rm -f "$registry_error"
          refs=()
          for arch in amd64 arm64; do
            directory="qualification/oracle-nne-acceptance-${arch}-${QUALIFICATION_RUN_ID}/oracle-nne-sso"
            test "$(jq -r .Architecture "$directory/qualified-image.json")" = "$arch"
            jq -e '.status == "passed" and .algorithm == "AES256" and .sessions > 0 and .unencrypted == 0' "$directory/oracle-encryption-after.json"
            jq -e --arg version "ENTERPRISEGLUE_HOST_VERSION=${RELEASE_TAG#v}" '.Config.Env | index($version) != null' "$directory/qualified-image.json"
            grep -qx 'status=passed' "$directory/summary.txt"
            gzip -dc "$directory/qualified-backend-image.tar.gz" | docker load
            id="$(jq -r .Id "$directory/qualified-image.json")"
            test "$(docker image inspect "$id" --format '{{.Id}}')" = "$id"
            scripts/scan-oracle-image.sh "$id" "oracle-${arch}-security"
            ref="$image:${RELEASE_TAG}-${arch}-${GITHUB_RUN_ID}"
            docker tag "$id" "$ref"
            refs+=("$ref")
          done
          for ref in "${refs[@]}"; do
            docker push "$ref"
            cosign sign --yes --registry-referrers-mode=oci-1-1 "$ref"
          done
          for arch in amd64 arm64; do
            ref="$image:${RELEASE_TAG}-${arch}-${GITHUB_RUN_ID}"
            digest="$(oras resolve "$ref")"
            cosign attest --yes --type cyclonedx \
              --predicate "oracle-${arch}-security/sbom.cdx.json" "$image@$digest"
          done
          docker buildx imagetools create -t "$image:$RELEASE_TAG" "${refs[@]}"
          digest="$(oras resolve "$image:$RELEASE_TAG")"
          cosign sign --yes --registry-referrers-mode=oci-1-1 "$image@$digest"
          printf '%s\n' "$image@$digest" > oracle-image-digest.txt
          jq -n --arg image "$image" --arg digest "$digest" --arg source "$SOURCE_REF" \
            --arg control "$GITHUB_SHA" --arg qualification "$QUALIFICATION_RUN_ID" --arg tag "$RELEASE_TAG" \
            --slurpfile amd64 oracle-amd64-security/image.json --slurpfile arm64 oracle-arm64-security/image.json \
            '{schemaVersion:"enterpriseglue-oracle-image-publication/v1",status:"published",releaseTag:$tag,
              sourceRevision:$source,controlRevision:$control,qualificationRun:$qualification,image:$image,digest:$digest,
              imageIds:{amd64:$amd64[0].Id,arm64:$arm64[0].Id}}' > oracle-image-publication.json
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ steps.publication.outputs.image }}
          subject-digest: ${{ steps.publication.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: oracle-image-publication-${{ inputs.release_tag }}
          path: |
            oracle-image-digest.txt
            oracle-image-publication.json
            oracle-*-security
          if-no-files-found: warn
