name: Publish Qualified Oracle Backend Image
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact commit of the existing released tag
        required: true
        type: string
      release_tag:
        description: Existing stable vX.Y.Z release tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: oracle-image-release-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require an exact existing released source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$SOURCE_REF"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease | jq -e '.isDraft == false and .isPrerelease == false'
  qualify:
    needs: validate
    uses: ./.github/workflows/oracle-native-encryption-reusable.yml
    with:
      source_ref: ${{ inputs.source_ref }}
      retain_image: true
  publish:
    needs: [validate, qualify]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: oracle-nne-acceptance-*-${{ github.run_id }}
          path: qualification
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with: { cosign-release: v3.1.3 }
      - name: Scan and publish the retained qualified image bytes
        id: publication
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/enterpriseglue-the-bridge-oss-backend-oracle"
          refs=()
          for arch in amd64 arm64; do
            directory="qualification/oracle-nne-acceptance-${arch}-${GITHUB_RUN_ID}/oracle-nne-sso"
            test "$(jq -r .Architecture "$directory/qualified-image.json")" = "$arch"
            test "$(jq -r .algorithm "$directory/oracle-encryption-after.json")" = AES256
            grep -qx 'status=passed' "$directory/summary.txt"
            gzip -dc "$directory/qualified-backend-image.tar.gz" | docker load
            id="$(jq -r .Id "$directory/qualified-image.json")"
            test "$(docker image inspect "$id" --format '{{.Id}}')" = "$id"
            scripts/scan-oracle-image.sh "$id" "oracle-${arch}-security"
            ref="$image:${RELEASE_TAG}-${arch}-${GITHUB_RUN_ID}"
            docker tag "$id" "$ref"
            refs+=("$ref")
          done
          for ref in "${refs[@]}"; do
            docker push "$ref"
            cosign sign --yes --registry-referrers-mode=oci-1-1 "$ref"
          done
          for arch in amd64 arm64; do
            ref="$image:${RELEASE_TAG}-${arch}-${GITHUB_RUN_ID}"
            digest="$(oras resolve "$ref")"
            cosign attest --yes --registry-referrers-mode=oci-1-1 --type cyclonedx \
              --predicate "oracle-${arch}-security/sbom.cdx.json" "$image@$digest"
          done
          docker buildx imagetools create -t "$image:$RELEASE_TAG" "${refs[@]}"
          digest="$(oras resolve "$image:$RELEASE_TAG")"
          cosign sign --yes --registry-referrers-mode=oci-1-1 "$image@$digest"
          printf '%s\n' "$image@$digest" > oracle-image-digest.txt
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ steps.publication.outputs.image }}
          subject-digest: ${{ steps.publication.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: oracle-image-publication-${{ inputs.release_tag }}
          path: |
            oracle-image-digest.txt
            oracle-*-security
          if-no-files-found: warn
